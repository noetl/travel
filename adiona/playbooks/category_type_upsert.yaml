apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_category_type_upsert
  path: adiona/v1/category_type_upsert
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j), checked AS MATERIALIZED (SELECT j FROM p WHERE adiona.require(adiona.is_admin(),'Operation not authorized')), changed AS (
         INSERT INTO adiona.category_types(category_type,default_lang_code) SELECT (j->>'category_type')::text,COALESCE(j->>'default_lang_code','en') FROM checked
         ON CONFLICT(category_type) DO UPDATE SET default_lang_code=EXCLUDED.default_lang_code RETURNING *
        ) SELECT to_jsonb(result_row) AS result FROM (SELECT * FROM changed) result_row;
