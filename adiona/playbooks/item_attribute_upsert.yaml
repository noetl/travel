apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_item_attribute_upsert
  path: adiona/v1/item_attribute_upsert
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j), checked AS MATERIALIZED (SELECT j FROM p WHERE adiona.require(adiona.is_admin() OR (adiona.is_provider() AND EXISTS(SELECT FROM adiona.items WHERE item_id=(j->>'item_id')::bigint AND provider_id=adiona.actor_id())),'Operation not authorized')), changed AS (
         INSERT INTO adiona.item_attributes(item_id,attribute_id,attribute_value,has_content) SELECT (j->>'item_id')::bigint,(j->>'attribute_id')::bigint,(j->>'attribute_value')::bigint,COALESCE(j->>'has_content','Y') FROM checked
         ON CONFLICT(item_id,attribute_id) DO UPDATE SET attribute_value=EXCLUDED.attribute_value,has_content=EXCLUDED.has_content RETURNING *
        ) SELECT to_jsonb(result_row) AS result FROM (SELECT * FROM changed) result_row;
