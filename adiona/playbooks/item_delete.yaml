apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_item_delete
  path: adiona/v1/item_delete
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j), changed AS (DELETE FROM adiona.items USING p WHERE item_id=(j->>'item_id')::bigint RETURNING item_id) SELECT to_jsonb(result_row) AS result FROM (SELECT * FROM changed) result_row;
