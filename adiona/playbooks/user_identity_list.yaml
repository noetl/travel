apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_user_identity_list
  path: adiona/v1/user_identity_list
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j) SELECT to_jsonb(result_row) AS result FROM (SELECT user_auth_id,user_id,method,id,email,created_dtm,modified_dtm FROM adiona.user_auth CROSS JOIN p WHERE user_id=COALESCE((j->>'user_id')::bigint,adiona.actor_id()) ORDER BY user_auth_id) result_row;
