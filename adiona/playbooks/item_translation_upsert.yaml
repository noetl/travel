apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_item_translation_upsert
  path: adiona/v1/item_translation_upsert
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j), checked AS MATERIALIZED (SELECT j FROM p WHERE adiona.require(adiona.is_admin() OR (adiona.is_provider() AND EXISTS(SELECT FROM adiona.items WHERE item_id=(j->>'item_id')::bigint AND provider_id=adiona.actor_id())),'Operation not authorized')), changed AS (
         INSERT INTO adiona.item_content(item_id,provider_id,lang_code,item_name,item_header,item_desc,item_address1,item_address2,item_slug) SELECT (j->>'item_id')::bigint,(SELECT provider_id FROM adiona.items WHERE item_id=(j->>'item_id')::bigint),(j->>'lang_code')::text,(j->>'item_name')::text,(j->>'item_header')::text,(j->>'item_desc')::text,(j->>'item_address1')::text,(j->>'item_address2')::text,(j->>'item_slug')::text FROM checked
         ON CONFLICT(item_id,lang_code) DO UPDATE SET provider_id=EXCLUDED.provider_id,item_name=EXCLUDED.item_name,item_header=EXCLUDED.item_header,item_desc=EXCLUDED.item_desc,item_address1=EXCLUDED.item_address1,item_address2=EXCLUDED.item_address2,item_slug=EXCLUDED.item_slug RETURNING *
        ) SELECT to_jsonb(result_row) AS result FROM (SELECT * FROM changed) result_row;
