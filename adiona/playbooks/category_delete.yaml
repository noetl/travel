apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_category_delete
  path: adiona/v1/category_delete
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j), changed AS (DELETE FROM adiona.categories USING p WHERE category_id=(j->>'category_id')::bigint RETURNING category_id) SELECT to_jsonb(result_row) AS result FROM (SELECT * FROM changed) result_row;
