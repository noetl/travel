apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_region_list
  path: adiona/v1/region_list
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j) SELECT to_jsonb(result_row) AS result FROM (SELECT c.* FROM adiona.categories_lookup c CROSS JOIN p WHERE category_type IN ('region','country') AND lang_code=COALESCE(j->>'lang','en') ORDER BY category_id) result_row;
