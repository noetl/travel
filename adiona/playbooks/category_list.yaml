apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_category_list
  path: adiona/v1/category_list
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j) SELECT to_jsonb(result_row) AS result FROM (SELECT c.* FROM adiona.categories_lookup c CROSS JOIN p WHERE c.lang_code=COALESCE(j->>'lang','en') AND ((j->>'type') IS NULL OR c.category_type=j->>'type') ORDER BY c.category_id LIMIT 100) result_row;
