apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_language_upsert
  path: adiona/v1/language_upsert
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j), checked AS MATERIALIZED (SELECT j FROM p WHERE adiona.require(adiona.is_admin(),'Operation not authorized')), changed AS (
         INSERT INTO adiona.languages(lang_code,lang_name,supported) SELECT (j->>'lang_code')::text,(j->>'lang_name')::text,COALESCE(j->>'supported','Y') FROM checked
         ON CONFLICT(lang_code) DO UPDATE SET lang_name=EXCLUDED.lang_name,supported=EXCLUDED.supported RETURNING *
        ) SELECT to_jsonb(result_row) AS result FROM (SELECT * FROM changed) result_row;
