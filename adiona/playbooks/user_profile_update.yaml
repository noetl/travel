apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_user_profile_update
  path: adiona/v1/user_profile_update
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j), changed AS (UPDATE adiona.users SET display_name=j->>'display_name',first_name=j->>'first_name',last_name=j->>'last_name',modified_dtm=now() FROM p WHERE user_id=adiona.actor_id() RETURNING user_id,display_name,first_name,last_name,modified_dtm) SELECT to_jsonb(result_row) AS result FROM (SELECT * FROM changed) result_row;
