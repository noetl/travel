apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_user_get
  path: adiona/v1/user_get
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j) SELECT to_jsonb(result_row) AS result FROM (SELECT u.* FROM adiona.users u CROSS JOIN p WHERE u.user_id=COALESCE((j->>'user_id')::bigint,adiona.actor_id())) result_row;
