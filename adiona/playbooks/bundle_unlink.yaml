apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: adiona_bundle_unlink
  path: adiona/v1/bundle_unlink
workload:
  request: {}
workflow:
  - step: start
    tool:
      kind: postgres
      auth: adiona_actor
      params:
        - "{{ request | tojson | b64encode }}"
      command: |
        WITH p AS MATERIALIZED (SELECT convert_from(decode($1::text,'base64'),'UTF8')::jsonb AS j), changed AS (DELETE FROM adiona.items_bundle USING p WHERE bundle_id=(j->>'bundle_id')::bigint AND item_id=(j->>'item_id')::bigint RETURNING *) SELECT to_jsonb(result_row) AS result FROM (SELECT * FROM changed) result_row;
