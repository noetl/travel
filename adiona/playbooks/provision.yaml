        CREATE TABLE adiona.principals (db_role name PRIMARY KEY, user_id bigint REFERENCES adiona.users, permission text NOT NULL CHECK(permission IN ('admin','provider','customer')), CHECK(permission='admin' OR user_id IS NOT NULL));
