        CREATE SCHEMA IF NOT EXISTS adiona;
        CREATE TABLE adiona.languages (lang_code char(2) PRIMARY KEY CHECK(lang_code ~ '^[a-z]{2}$'), lang_name char(49), supported char(1) DEFAULT 'N' CHECK(supported IN ('Y','N')), is_image char(1) DEFAULT 'N', image_uri varchar(1000));
        CREATE TABLE adiona.currencies (currency_code char(3) PRIMARY KEY, exchange_rate numeric(24,10), glyph varchar(10), currency_name varchar(100), numeric_code integer, supported char(1) DEFAULT 'N', is_image char(1) DEFAULT 'N', image_uri varchar(1000));
        CREATE TABLE adiona.currency_history (currency_code char(3) REFERENCES adiona.currencies, exchange_rate numeric(24,10) NOT NULL, valid_from timestamptz NOT NULL DEFAULT now(), valid_till timestamptz, is_used smallint DEFAULT 1, PRIMARY KEY(currency_code,valid_from));
        CREATE TABLE adiona.user_type (user_type_id smallint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, user_type_name varchar(20) NOT NULL UNIQUE, comments varchar(200) NOT NULL, created_dtm timestamptz DEFAULT now(), modified_dtm timestamptz NOT NULL DEFAULT now());
        INSERT INTO adiona.user_type(user_type_name,comments) VALUES ('ADMIN','Administrator'),('SERVICE_PROVIDER','Product or service provider'),('CUSTOMER','Customer');
        CREATE TABLE adiona.users (
         user_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, user_type_id smallint NOT NULL REFERENCES adiona.user_type,
         email varchar(200) NOT NULL CHECK(email ~ '^[^@[:space:]]+@[^@[:space:]]+[.][^@[:space:]]+$'),
         primary_phone_number varchar(200), alternative_phone_numbers varchar(1000), currency char(3) REFERENCES adiona.currencies,
         display_name varchar(200) NOT NULL CHECK(length(trim(display_name))>0), first_name varchar(200) NOT NULL, last_name varchar(200) NOT NULL, middle_name varchar(200),
         language_iso_639_1 char(4) NOT NULL DEFAULT 'en', timezone varchar(200) DEFAULT 'UTC', gender varchar(1), address varchar(1000), additional_info varchar(2000), comments varchar(2000),
         created_dtm timestamptz NOT NULL DEFAULT now(), modified_dtm timestamptz NOT NULL DEFAULT now(), UNIQUE(email,user_type_id));
        CREATE TABLE adiona.user_auth (
         user_auth_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, user_id bigint NOT NULL REFERENCES adiona.users, method varchar(200) NOT NULL,
         id varchar(200) NOT NULL, credential_ref varchar(200), email varchar(200), created_dtm timestamptz NOT NULL DEFAULT now(), modified_dtm timestamptz NOT NULL DEFAULT now(),
         UNIQUE(user_id,method), UNIQUE(method,id));
        CREATE TABLE adiona.category_types (category_type_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, category_type varchar(100) NOT NULL UNIQUE, default_lang_code varchar(2) NOT NULL DEFAULT 'en' REFERENCES adiona.languages(lang_code), master_category_type_id bigint REFERENCES adiona.category_types, CHECK(master_category_type_id IS DISTINCT FROM category_type_id));
        CREATE TABLE adiona.category_type_content (category_type_content_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, category_type_id bigint NOT NULL REFERENCES adiona.category_types, category_type varchar(100) NOT NULL, lang_code varchar(2) NOT NULL DEFAULT 'en' REFERENCES adiona.languages(lang_code), UNIQUE(category_type_id,lang_code));
        CREATE TABLE adiona.categories (category_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, category_name varchar(100) NOT NULL, default_lang_code varchar(2) NOT NULL DEFAULT 'en' REFERENCES adiona.languages(lang_code), category_type_id bigint NOT NULL REFERENCES adiona.category_types, master_category_id bigint REFERENCES adiona.categories, UNIQUE(category_name,default_lang_code,category_type_id), CHECK(master_category_id IS DISTINCT FROM category_id));
        CREATE TABLE adiona.category_content (content_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, category_id bigint NOT NULL REFERENCES adiona.categories, lang_code char(2) NOT NULL DEFAULT 'en' REFERENCES adiona.languages, category varchar(100), UNIQUE(category_id,lang_code));
        CREATE TABLE adiona.category_images (category_image_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, category_id bigint NOT NULL REFERENCES adiona.categories, category_image_uri varchar(2000) NOT NULL, is_main_image varchar(1) NOT NULL DEFAULT 'N' CHECK(is_main_image IN ('Y','N')), category_image_order integer, comments varchar(2000), UNIQUE(category_id,category_image_uri));
        CREATE TABLE adiona.items (item_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, default_lang_code varchar(2) NOT NULL DEFAULT 'en' REFERENCES adiona.languages(lang_code), is_bundle smallint NOT NULL DEFAULT 0 CHECK(is_bundle IN (0,1)), item_name varchar(200) NOT NULL CHECK(length(trim(item_name))>0), provider_id bigint NOT NULL REFERENCES adiona.users, price bigint CHECK(price>=0), UNIQUE(provider_id,default_lang_code,item_name), UNIQUE(item_id,provider_id));
        CREATE TABLE adiona.bundle_type (bundle_type_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, bundle_type varchar(20) NOT NULL UNIQUE);
        CREATE TABLE adiona.items_bundle (bundle_id bigint NOT NULL REFERENCES adiona.items, item_id bigint NOT NULL REFERENCES adiona.items, bundle_type_id bigint REFERENCES adiona.bundle_type, PRIMARY KEY(bundle_id,item_id), CHECK(bundle_id<>item_id));
        CREATE TABLE adiona.item_content (item_content_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, item_id bigint NOT NULL, provider_id bigint NOT NULL, FOREIGN KEY(item_id,provider_id) REFERENCES adiona.items(item_id,provider_id), lang_code char(2) NOT NULL DEFAULT 'en' REFERENCES adiona.languages, item_name varchar(200), item_header varchar(4000), item_desc text, item_address1 varchar(1000), item_address2 varchar(1000), item_slug varchar(500), UNIQUE(item_id,lang_code));
        CREATE UNIQUE INDEX item_slug_language ON adiona.item_content(lang_code,item_slug) WHERE item_slug IS NOT NULL;
        CREATE TABLE adiona.item_category (item_id bigint NOT NULL REFERENCES adiona.items, category_id bigint NOT NULL REFERENCES adiona.categories, PRIMARY KEY(item_id,category_id));
        CREATE TABLE adiona.item_images (item_image_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, item_id bigint NOT NULL REFERENCES adiona.items, item_image_uri varchar(2000) NOT NULL, is_main_image varchar(1) NOT NULL DEFAULT 'N' CHECK(is_main_image IN ('Y','N')), item_image_order integer, comments varchar(2000), UNIQUE(item_id,item_image_uri));
        CREATE TABLE adiona.attributes (attribute_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, attribute_category_id bigint NOT NULL REFERENCES adiona.categories, attribute_name varchar(100) NOT NULL, UNIQUE(attribute_category_id,attribute_name));
        CREATE TABLE adiona.item_attributes (item_attribute_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, item_id bigint NOT NULL REFERENCES adiona.items, attribute_id bigint NOT NULL REFERENCES adiona.attributes, attribute_value bigint, has_content char(1) DEFAULT 'Y' CHECK(has_content IN ('Y','N')), UNIQUE(item_id,attribute_id));
        CREATE TABLE adiona.item_attribute_content (attribute_content_id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, item_attribute_id bigint NOT NULL REFERENCES adiona.item_attributes, lang_code char(2) NOT NULL DEFAULT 'en' REFERENCES adiona.languages, attribute_content varchar(16000), UNIQUE(item_attribute_id,lang_code));
