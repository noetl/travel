# Islands and island groups trip-intake knows without asking the model (adiona/frontend#55).
#
# Checked BEFORE the model, so the same place always gets the same answer
# ("Maui" is OGG every time) and it still works when the model is slow or down.
# Built into playbooks/trip-intake.yaml by scripts/gen_intake_places.py, which
# refuses any airport code the flight form cannot prefill (adiona's airport list).
#
# islands:  airports is the island's primary airport(s), primary first.
#             one        -> used as is
#             several    -> the traveller chooses (only where they really do)
#             []         -> the nearest airports to lat/lon are offered
# regions:  an island group; the traveller is asked which island (names below).
# Coordinates are the island's rough centre (for "nearest airport" only).

islands:
  # Hawaii
  - {name: Oahu, aliases: ["O'ahu"], country: US, airports: [HNL], lat: 21.47, lon: -157.98}
  - {name: Maui, country: US, airports: [OGG], lat: 20.80, lon: -156.33}
