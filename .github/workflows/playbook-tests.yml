name: playbook tests

# ⚠ WHY THIS WORKFLOW EXISTS
#
# `scripts/*_test.py` holds regression guards that exec a playbook's own embedded `code:`
# — the right technique, since it runs production logic with no external calls. But
# before this workflow, **nothing ran them**: a grep across the repo found 0 invocations.
#
# They rotted exactly as you would expect. Eight bindings were added to
# `itinerary-planner.yaml`'s `extract_turn` step after the harnesses were written, and
# BOTH planner guards began dying on
# `NameError: name 'llm_extraction_enabled' is not defined` — asserting nothing, while
# reporting nothing. A guard nobody runs is indistinguishable from a guard nobody wrote.
#
# The repo's other workflow (`adiona-postgres19.yml`) only triggers on `adiona/**`, so a
# change to `playbooks/**` had no PR gate at all.
#
# adiona/frontend#59.

on:
  pull_request:
    paths:
      - 'playbooks/**'
      - 'scripts/*_test.py'
      - '.github/workflows/playbook-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'playbooks/**'
      - 'scripts/*_test.py'

concurrency:
  group: playbook-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playbook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the only dependency the guards have
        run: python -m pip install --quiet pyyaml

      # Every guard is run, and the COUNT is asserted. Without the count a glob that
      # matched nothing would report a clean pass — the same failure this workflow was
      # added to end, one level up.
      - name: Run every playbook guard
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(scripts/*_test.py)
          echo "guards discovered: ${#tests[@]}"
          if [ "${#tests[@]}" -lt 4 ]; then
            echo "FAIL: found only ${#tests[@]} guard(s) under scripts/ — the glob is wrong,"
            echo "      and a run over an empty set would report success."
            exit 1
          fi
          failed=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if python "$t"; then
              echo "PASS $t"
            else
              echo "FAIL $t"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "---"
          echo "guards run: ${#tests[@]}   failed: $failed"
          [ "$failed" -eq 0 ]

      # A playbook that does not parse cannot be registered, and the error would
      # otherwise surface at deploy time rather than here.
      - name: Every playbook parses as YAML
        run: |
          python - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob("playbooks/**/*.yaml", recursive=True))
          print("playbooks discovered: %d" % len(files))
          if len(files) < 4:
              print("FAIL: only %d playbook(s) found — the glob is wrong" % len(files))
              sys.exit(1)
          bad = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  bad.append("%s: %s" % (f, str(e).split("\n")[0]))
          for b in bad:
              print("FAIL %s" % b)
          print("parsed %d, failed %d" % (len(files), len(bad)))
          sys.exit(1 if bad else 0)
          PY
