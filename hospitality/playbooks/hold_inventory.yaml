# Development adapter only. See README.md before registration.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: hospitality_hold_inventory
  path: hospitality/v0_1/hold_inventory
  description: Development starter; requires the command adapter. No live payment
    or messaging integration.
  version: 0.1.0
executor:
  profile: auto
  version: noetl-runtime/1
  requires:
    tools:
    - http
    - python
  spec:
    entry_step: start
    no_next_is_error: false
workload:
  api_base: http://127.0.0.1:8099
  property_id: ranch-demo
  request_key: REPLACE_WITH_NEW_REQUEST_KEY
  quote_id: REPLACE_WITH_QUOTE_ID
workflow:
- step: start
  desc: Explicit entry required by the Rust runtime
  tool:
    kind: python
    input:
      payload:
        status: initialized
    code: 'result = payload

      '
  next:
    spec:
      mode: exclusive
    arcs:
    - step: hold_inventory
- step: hold_inventory
  desc: Execute hold_inventory through the atomic command boundary
  tool:
    kind: http
    method: POST
    url: '{{ api_base }}/v1/holds'
    timeout_seconds: 15
    headers:
      Content-Type: application/json
      X-Demo-Principal: demo-staff
      Idempotency-Key: '{{ request_key }}:hold_inventory'
    json:
      property_id: '{{ property_id }}'
      quote_id: '{{ quote_id }}'
    spec:
      policy:
        rules:
        - when: '{{ output.data.status_code in [429, 502, 503, 504] }}'
          then:
            do: retry
            attempts: 3
            backoff: exponential
            delay: 1.0
        - when: '{{ output.status == "error" }}'
          then:
            do: fail
        - else:
            then:
              do: continue
              set:
                ctx.hold_inventory: '{{ output.data.data }}'
  next:
    spec:
      mode: exclusive
    arcs:
    - step: end
- step: end
  desc: Return the domain result; business status is separate from tool status
  tool:
    kind: python
    input:
      payload: '{{ ctx.hold_inventory }}'
    code: 'result = payload

      '
