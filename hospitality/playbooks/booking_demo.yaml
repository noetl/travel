# Development adapter only. See README.md before registration.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: hospitality_booking_demo
  path: hospitality/v0_1/booking_demo
  description: Development starter; requires the command adapter. No live payment
    or messaging integration.
  version: 0.1.0
executor:
  profile: auto
  version: noetl-runtime/1
  requires:
    tools:
    - http
    - python
  spec:
    entry_step: start
    no_next_is_error: false
workload:
  api_base: http://127.0.0.1:8099
  property_id: ranch-demo
  request_key: demo-booking-001
  room_id: room-1
  arrival: '2027-10-02'
  departure: '2027-10-04'
  guests: 2
workflow:
- step: start
  desc: Explicit entry required by the Rust runtime
  tool:
    kind: python
    input:
      payload:
        status: initialized
    code: 'result = payload

      '
  next:
    spec:
      mode: exclusive
    arcs:
    - step: quote
- step: quote
  desc: Execute quote through the atomic command boundary
  tool:
    kind: http
    method: POST
    url: '{{ api_base }}/v1/quotes'
    timeout_seconds: 15
    headers:
      Content-Type: application/json
      X-Demo-Principal: demo-staff
      Idempotency-Key: '{{ request_key }}:quote'
    json:
      property_id: '{{ property_id }}'
      room_id: '{{ room_id }}'
      arrival: '{{ arrival }}'
      departure: '{{ departure }}'
      guests: '{{ guests }}'
    spec:
      policy:
        rules:
        - when: '{{ output.data.status_code in [429, 502, 503, 504] }}'
          then:
            do: retry
            attempts: 3
            backoff: exponential
            delay: 1.0
        - when: '{{ output.status == "error" }}'
          then:
            do: fail
        - else:
            then:
              do: continue
              set:
                ctx.quote: '{{ output.data.data }}'
  next:
    spec:
      mode: exclusive
    arcs:
    - step: hold
- step: hold
  desc: Execute hold through the atomic command boundary
  tool:
    kind: http
    method: POST
    url: '{{ api_base }}/v1/holds'
    timeout_seconds: 15
    headers:
      Content-Type: application/json
      X-Demo-Principal: demo-staff
      Idempotency-Key: '{{ request_key }}:hold'
    json:
      property_id: '{{ property_id }}'
      quote_id: '{{ ctx.quote.quote_id }}'
    spec:
      policy:
        rules:
        - when: '{{ output.data.status_code in [429, 502, 503, 504] }}'
          then:
            do: retry
            attempts: 3
            backoff: exponential
            delay: 1.0
        - when: '{{ output.status == "error" }}'
          then:
            do: fail
        - else:
            then:
              do: continue
              set:
                ctx.hold: '{{ output.data.data }}'
  next:
    spec:
      mode: exclusive
    arcs:
    - step: payment
- step: payment
  desc: Execute payment through the atomic command boundary
  tool:
    kind: http
    method: POST
    url: '{{ api_base }}/v1/test/payments'
    timeout_seconds: 15
    headers:
      Content-Type: application/json
      X-Demo-Principal: demo-worker
      Idempotency-Key: '{{ request_key }}:payment'
    json:
      property_id: '{{ property_id }}'
      reservation_id: '{{ ctx.hold.reservation_id }}'
      outcome: captured
    spec:
      policy:
        rules:
        - when: '{{ output.data.status_code in [429, 502, 503, 504] }}'
          then:
            do: retry
            attempts: 3
            backoff: exponential
            delay: 1.0
        - when: '{{ output.status == "error" }}'
          then:
            do: fail
        - else:
            then:
              do: continue
              set:
                ctx.payment: '{{ output.data.data }}'
  next:
    spec:
      mode: exclusive
    arcs:
    - step: confirm
- step: confirm
  desc: Execute confirm through the atomic command boundary
  tool:
    kind: http
    method: POST
    url: '{{ api_base }}/v1/confirmations'
    timeout_seconds: 15
    headers:
      Content-Type: application/json
      X-Demo-Principal: demo-worker
      Idempotency-Key: '{{ request_key }}:confirm'
    json:
      property_id: '{{ property_id }}'
      reservation_id: '{{ ctx.hold.reservation_id }}'
      payment_id: '{{ ctx.payment.payment_id }}'
    spec:
      policy:
        rules:
        - when: '{{ output.data.status_code in [429, 502, 503, 504] }}'
          then:
            do: retry
            attempts: 3
            backoff: exponential
            delay: 1.0
        - when: '{{ output.status == "error" }}'
          then:
            do: fail
        - else:
            then:
              do: continue
              set:
                ctx.confirm: '{{ output.data.data }}'
  next:
    spec:
      mode: exclusive
    arcs:
    - step: end
- step: end
  desc: Return the domain result; business status is separate from tool status
  tool:
    kind: python
    input:
      payload: '{{ ctx.confirm }}'
    code: 'result = payload

      '
