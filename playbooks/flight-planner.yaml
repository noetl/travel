apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: flight_planner
  path: muno/playbooks/flight-planner
  description: |
    Muno flight planner agent.

    Processes one chat-thread input event per invocation. The thread is
    event-sourced in Firestore through mcp/firestore.append_event, state is
    projected into chat_threads/{thread_id}/slot_state, and tool calls route
    through the existing MCP playbooks.

    Provenance: restored from catalog muno/playbooks/itinerary-planner v41
    and renamed.  It is NOT a fork of the live planner (v67) — that lineage
    keeps its own path and continues to serve the full itinerary flow.  This
    playbook is the flight-focused slice: destinations (Google Places) and
    flights (Duffel test env), through order creation.

    v41's hotel branch called mcp/amadeus.search_hotels.  Amadeus dropped
    developer-API support and the live planner removed that path; the branch
    is deleted here rather than left unreachable, because a dead branch that
    still reports success is the silent-failure mode recorded in
    noetl/ai-meta#234.  Hotels belong to the itinerary planner and to
    muno/playbooks/hotel-cards, both on HotelBeds.
  version: "1.0"
  agent: true
  tags: [muno, flights, trip-planner, event-sourced, widgets]
  terminal:
    visible: true
    workspace: muno
    scopes: [/muno/flights, /mcp/firestore, /mcp/duffel, /mcp/google-places]
  capabilities: [mcp:firestore, mcp:duffel, mcp:google-places, ai:openai, ai:anthropic, ai:vertex-ai, ai:ollama]

workload:
  pg_auth: pg_k8s
  gcp_auth: google_oauth
  # Firestore + Google Places live in noetl-demo-19700101 and MUST stay
  # there: shastaratech-noetl-prod does not have the firestore, places or
  # aiplatform APIs at all (noetl/ai-meta#234).  This key selects which
  # Firestore database holds the thread data, so repointing it splits the
  # data rather than moving it.
  gcp_project: noetl-demo-19700101
  ai_provider: openai
  llm_extraction_model: gpt-4o
  llm_chat_model: gpt-4o-mini
  # ⚠ These two stay on project 1014428265962 — which IS
  # noetl-demo-19700101, named by NUMBER (a search for the project ID does
  # not find these lines; that is why they were missed in earlier sweeps).
  #
  # "Secret reads repoint to prod" (noetl/ai-meta#234) is right in general —
  # it repaired four MCP providers — but it is WRONG for these two, and the
  # failure is silent.  Tested against prod 2026-08-14: pointing them at
  # projects/shastaratech-noetl-prod returns
  #   HTTP 403 Permission 'secretmanager.versions.access' denied
  # because the worker GSA has no grant on prod's copies.  The playbook then
  # completes anyway with llm_contract.fallback_used=true — the heuristic
  # extractor runs instead of the LLM and the execution still reports
  # COMPLETED, so nothing surfaces the downgrade.
  #
  # The grants are per-secret: the LLM secrets were granted cross-project
  # while the provider secrets were not.  Moving these to prod needs the IAM
  # grant first (a human carve-out), not a config edit.
  openai_secret_path: projects/1014428265962/secrets/openai-api-key/versions/1
  anthropic_secret_path: projects/1014428265962/secrets/anthropic-api-key/versions/1
  thread_id: ""
  user_uid: guest
  request_id: ""
  gateway_url: ""
  event_type: user_message
  event_payload: {}
  firestore_database: "(default)"
  duffel_env: test
  flight_provider: duffel
  enrich_with_google_places: true
  replay: false
  replay_thread_id: ""

keychain:
  # Existing provider secrets only. Keychain expressions use bare workload
  # references per the playbook authoring guide.
  - name: openai_token
    kind: secrets
    provider: gcp
    scope: global
    auth: "{{ gcp_auth }}"
    map:
      api_key: "{{ openai_secret_path }}"

  - name: anthropic_token
    kind: secrets
    provider: gcp
    scope: global
    auth: "{{ gcp_auth }}"
    map:
      api_key: "{{ anthropic_secret_path }}"

workflow:
  - step: start
    desc: Entry point — the Rust runtime requires a step named `start`; routes to normalize_input
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: normalize_input

  - step: normalize_input
    desc: Normalize caller input and generate a thread id when needed
    tool:
      kind: python
      input:
        thread_id: "{{ workload.thread_id }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
        event_type: "{{ workload.event_type | default('user_message') }}"
        event_payload: "{{ workload.event_payload | default({}) }}"
        replay: "{{ workload.replay | default(false) }}"
        replay_thread_id: "{{ workload.replay_thread_id | default('') }}"
      code: |
        import json
        import time
        import uuid

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        tid = str(replay_thread_id or thread_id or "").strip()
        if not tid:
            tid = f"chat_threads/_smoke-{uuid.uuid4().hex[:10]}"
        elif not tid.startswith("chat_threads/"):
            tid = f"chat_threads/{tid.strip('/')}"

        payload = _as_dict(event_payload)
        event = {
            "type": str(event_type or "user_message"),
            "payload": payload,
            "actor": {"kind": "user", "uid": user_uid or "guest"},
            "created_at_ms": int(time.time() * 1000),
            "source": "muno.itinerary_planner",
        }
        result = {
            "thread_path": tid,
            "thread_id": tid.split("/", 1)[1] if "/" in tid else tid,
            "event_type": event["type"],
            "event_payload": payload,
            "input_event": event,
            "replay": bool(replay),
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: load_slot_state

  - step: load_slot_state
    desc: Load current slot projection from Firestore
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      # noetl/ai-meta#136 — block for the child playbook's real result so
      # `load_slot_state` carries the provider payload rather than the
      # async-start envelope.
      return_result: true
      result_step: firestore_dispatch
      timeout: 90
      payload:
        method: tools/call
        tool: get_doc
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          path: "{{ normalize_input.thread_path }}/slot_state/current"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: extract_turn

  - step: extract_turn
    desc: JSON-mode extraction of slot updates, tool requests, and render intent
    tool:
      kind: python
      input:
        thread_path: "{{ normalize_input.thread_path }}"
        event_type: "{{ workload.event_type | default('user_message') }}"
        event_payload: "{{ workload.event_payload | default({}) }}"
        input_event: "{{ normalize_input.input_event }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
        loaded_slot_state: "{{ load_slot_state.data | default({}) }}"
        ai_provider: "{{ workload.ai_provider | default('openai') }}"
        llm_extraction_model: "{{ workload.llm_extraction_model }}"
        openai_api_key: "{{ keychain.openai_token.api_key | default('') }}"
        anthropic_api_key: "{{ keychain.anthropic_token.api_key | default('') }}"
        flight_provider: "{{ workload.flight_provider | default('duffel') }}"
        duffel_env: "{{ workload.duffel_env | default('test') }}"
      code: |
        import copy
        import json
        import re
        import uuid
        from datetime import date, datetime, timezone, timedelta

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        def _text_from_event(payload):
            payload = _as_dict(payload)
            return str(payload.get("text") or payload.get("message") or payload.get("label") or "").strip()

        def _slot_from_loaded(value):
            item = _as_dict(value)
            data = item.get("data")
            if isinstance(data, dict):
                return copy.deepcopy(data)
            document = item.get("document")
            if isinstance(document, dict):
                document_data = document.get("data")
                if isinstance(document_data, dict):
                    return copy.deepcopy(document_data)
            if any(key in item for key in ("region", "region_label", "check_in_date", "party", "places_seen")):
                return copy.deepcopy(item)
            return {}

        def _city_hint(text):
            lowered = text.lower()
            known = {
                "miami": ("Miami", "MIA", "US"),
                "paris": ("Paris", "PAR", "FR"),
                "boston": ("Boston", "BOS", "US"),
                "new york": ("New York", "NYC", "US"),
                "nyc": ("New York", "NYC", "US"),
                "london": ("London", "LON", "GB"),
            }
            for key, item in known.items():
                if key in lowered:
                    label, code, country = item
                    return {"label": label, "city_code": code, "country_code": country, "kind": "city"}
            return None

        def _date_hint(text):
            lowered = text.lower()
            today = date.today()
            if "next month" in lowered:
                first = (today.replace(day=1) + timedelta(days=32)).replace(day=12)
                return first.isoformat(), (first + timedelta(days=4)).isoformat()
            match = re.search(r"(20\d\d-\d\d-\d\d)(?:\s*(?:to|-|through)\s*(20\d\d-\d\d-\d\d))?", text)
            if match:
                start = match.group(1)
                end = match.group(2) or (date.fromisoformat(start) + timedelta(days=4)).isoformat()
                return start, end
            return None, None

        def _party_hint(text):
            lowered = text.lower()
            adults = 2 if "couple" in lowered else None
            match = re.search(r"(\d+)\s+(?:adult|adults|traveller|travelers|people)", lowered)
            if match:
                adults = int(match.group(1))
            return {"rooms": 1, "adults": adults or 1, "children": []} if adults else None

        def _deep_merge(base, patch):
            out = copy.deepcopy(base) if isinstance(base, dict) else {}
            for key, value in _as_dict(patch).items():
                if isinstance(value, dict) and isinstance(out.get(key), dict):
                    out[key] = _deep_merge(out[key], value)
                else:
                    out[key] = value
            return out

        def _normalise_region_fields(state):
            state = state if isinstance(state, dict) else {}
            region = state.get("region") if isinstance(state.get("region"), dict) else {}
            if not region and state.get("region_label"):
                region = {
                    "label": state.get("region_label"),
                    "city_code": state.get("region_city_code") or "",
                    "country_code": state.get("region_country_code") or "",
                    "kind": state.get("region_kind") or "city",
                }
                state["region"] = region
            if region:
                state["region_label"] = region.get("label") or state.get("region_label") or ""
                state["region_city_code"] = region.get("city_code") or state.get("region_city_code") or ""
                state["region_country_code"] = region.get("country_code") or state.get("region_country_code") or ""
                state["region_kind"] = region.get("kind") or state.get("region_kind") or "city"
            return state

        globals().update({
            "copy": copy,
            "json": json,
            "re": re,
            "uuid": uuid,
            "date": date,
            "datetime": datetime,
            "timezone": timezone,
            "timedelta": timedelta,
            "_as_dict": _as_dict,
            "_text_from_event": _text_from_event,
            "_slot_from_loaded": _slot_from_loaded,
            "_city_hint": _city_hint,
            "_date_hint": _date_hint,
            "_party_hint": _party_hint,
            "_deep_merge": _deep_merge,
            "_normalise_region_fields": _normalise_region_fields,
        })

        slot_state = _normalise_region_fields(_slot_from_loaded(loaded_slot_state))
        text = _text_from_event(event_payload)
        updates = {}
        region = _city_hint(text)
        if region:
            updates["region"] = region
        start, end = _date_hint(text)
        if start:
            updates["check_in_date"] = start
            updates["check_out_date"] = end
            try:
                updates["nights"] = max(1, (date.fromisoformat(end) - date.fromisoformat(start)).days)
            except Exception:
                updates["nights"] = None
        party = _party_hint(text)
        if party:
            updates["party"] = party

        payload = _as_dict(event_payload)
        input_event = _as_dict(input_event)
        if not input_event:
            input_event = {
                "type": str(event_type or "user_message"),
                "payload": payload,
                "actor": {"kind": "user", "uid": user_uid or "guest"},
                "created_at_ms": int(datetime.now(timezone.utc).timestamp() * 1000),
                "source": "muno.itinerary_planner",
            }
        lowered_text = text.lower()
        globals().update({"lowered_text": lowered_text})
        book_flight_now = False
        view_flight_now = False
        view_order_now = False
        if event_type in ("user_widget_submit", "user_widget_cta_click"):
            submitted = _as_dict(payload.get("submitted_value") or payload.get("value"))
            action_id = str(payload.get("action_id") or submitted.get("action_id") or "").strip()
            if "date" in action_id or ("from" in submitted and "to" in submitted):
                updates["check_in_date"] = submitted.get("from")
                updates["check_out_date"] = submitted.get("to")
                updates["nights"] = submitted.get("nights")
            if "party" in action_id or "adults" in submitted:
                updates["party"] = {
                    "rooms": submitted.get("rooms", 1),
                    "adults": submitted.get("adults", 1),
                    "children": submitted.get("children", []),
                }
            if "place" in action_id or submitted.get("kind") in ("airport", "city", "landmark"):
                label = str(submitted.get("label") or submitted.get("name") or submitted.get("id") or "").strip()
                place_id = str(submitted.get("id") or action_id.replace("add_place:", "")).strip()
                if label:
                    updates["region"] = _city_hint(label) or {
                        "label": label,
                        "city_code": place_id if submitted.get("kind") == "airport" else "",
                        "country_code": "",
                        "kind": submitted.get("kind") or "city",
                    }
                if place_id:
                    updates["picked_place_id"] = place_id
                    updates["places_seen"] = [place_id]
            if action_id.startswith(("book_offer:", "pick_offer:")) or submitted.get("offer_id"):
                offer_id_from_action = action_id.split(":", 1)[1] if ":" in action_id else action_id
                updates["picked_flight_offer_id"] = submitted.get("offer_id") or offer_id_from_action
                # Back-compat: earlier flight cards labelled the CTA "Book This"
                # but emitted pick_offer:<id>. Treat those clicks as booking.
                book_flight_now = True
            elif action_id.startswith("view_offer:"):
                updates["picked_flight_offer_id"] = action_id.split(":", 1)[1] if ":" in action_id else action_id
                view_flight_now = True
            elif action_id.startswith("order:"):
                # OrderConfirmation "View full order" CTA emits order:<order_id>;
                # render the saved last_order without retriggering downstream
                # search/booking branches.
                view_order_now = True
            if "hotel" in action_id or submitted.get("hotel_id"):
                updates["picked_hotel_id"] = submitted.get("hotel_id") or action_id.replace("pick_hotel:", "")

        wants_calendar = "show" in lowered_text and ("schedule" in lowered_text or "calendar" in lowered_text)
        wants_order = book_flight_now or any(word in lowered_text for word in ("order", "book", "booking", "confirm", "purchase"))

        if any(word in lowered_text for word in ("meeting", "appointment", "reminder", "note")) and "add" in lowered_text:
            updates["pending_calendar_events"] = [{
                "event_id": f"note_{uuid.uuid4().hex[:10]}",
                "type": "user_note",
                "start_at": f"{(date.today() + timedelta(days=7)).isoformat()}T15:00:00-04:00",
                "end_at": None,
                "timezone": "America/New_York",
                "title": text[:80] or "Trip note",
                "location": "",
                "notes": text,
                "source_order_id": None,
                "source_hotel_id": None,
                "google_calendar_event_id": None,
            }]

        next_state = _normalise_region_fields(_deep_merge(slot_state, updates))
        region_ready = isinstance(next_state.get("region"), dict)
        dates_ready = bool(next_state.get("check_in_date") and next_state.get("check_out_date"))
        party_ready = isinstance(next_state.get("party"), dict)
        picked_flight = bool(next_state.get("picked_flight_offer_id"))
        # INERT BY DESIGN in this playbook: read from slot_state so a thread
        # shared with the itinerary planner still round-trips the value, but
        # no extract branch here consumes it (the hotel branch was removed).
        picked_hotel = bool(next_state.get("picked_hotel_id"))

        def _test_passengers(party):
            party = party if isinstance(party, dict) else {}
            adults = max(1, int(party.get("adults") or 1))
            children = party.get("children") if isinstance(party.get("children"), list) else []
            adult_given_names = ["Alex", "Jordan", "Morgan", "Casey", "Taylor", "Riley", "Avery", "Jamie"]
            child_given_names = ["Sam", "Robin", "Quinn", "Skyler", "Rowan", "Reese", "Elliot", "Harper"]
            passengers = []
            for idx in range(adults):
                passengers.append({
                    "given_name": adult_given_names[idx % len(adult_given_names)],
                    "family_name": "Traveler",
                    "born_on": "1988-01-01",
                    "gender": "m" if idx % 2 == 0 else "f",
                    "email": "test@example.com",
                    "phone_number": "+442080168000",
                })
            for idx, child in enumerate(children):
                age = child.get("age") if isinstance(child, dict) else None
                try:
                    birth_year = date.today().year - int(age or 8)
                except Exception:
                    birth_year = date.today().year - 8
                passengers.append({
                    "given_name": child_given_names[idx % len(child_given_names)],
                    "family_name": "Traveler",
                    "born_on": f"{birth_year}-01-01",
                    "gender": "f" if idx % 2 == 0 else "m",
                    "email": "test@example.com",
                    "phone_number": "+442080168000",
                })
            return passengers

        tool_requests = []
        render_intent = {"kind": "collect_missing", "missing": []}
        if not region_ready:
            render_intent["missing"].append("region")
        if not dates_ready:
            render_intent["missing"].append("dates")
        if not party_ready:
            render_intent["missing"].append("party")

        if wants_calendar:
            render_intent = {"kind": "calendar_live"}
        elif region_ready and "places_seen" not in next_state:
            tool_requests.append({
                "tool": "mcp/google-places.search_text",
                "arguments": {"query": next_state["region"].get("label", ""), "max_results": 5},
            })
            render_intent = {"kind": "show_places"}
        elif region_ready and dates_ready and party_ready and not next_state.get("flight_search_results"):
            tool_requests.append({
                "tool": "mcp/duffel.search_offers",
                "arguments": {
                    "origin": "SFO",
                    "destination": next_state["region"].get("city_code") or "MIA",
                    "departure_date": next_state.get("check_in_date"),
                    "adults": next_state.get("party", {}).get("adults", 1),
                    "cabin_class": "economy",
                },
            })
            render_intent = {"kind": "show_flights"}
        elif picked_flight and view_flight_now:
            render_intent = {"kind": "flight_detail"}
        elif picked_flight and view_order_now and next_state.get("order_id"):
            render_intent = {"kind": "order_detail"}
        elif picked_flight and wants_order and not next_state.get("order_id"):
            tool_requests.append({
                "tool": "mcp/duffel.create_order",
                "arguments": {
                    "offer_id": next_state.get("picked_flight_offer_id"),
                    "passengers": _test_passengers(next_state.get("party")),
                    "duffel_env": "test",
                },
            })
            render_intent = {"kind": "order_confirmation"}
        # v41 searched hotels here via mcp/amadeus.search_hotels.  That
        # branch is removed (see metadata.description): this playbook plans
        # flights, and once a flight is picked the turn summarises rather
        # than chaining into a hotel search.
        elif picked_flight:
            render_intent = {"kind": "summary"}
        elif next_state.get("pending_calendar_events"):
            render_intent = {"kind": "calendar_live"}

        # Defense: if no branch above fired but all core slots are present,
        # "collect_missing" with an empty missing list is contradictory.
        # A fully-populated thread whose user sent a restatement (e.g.
        # "trip to paris") hits this path when flight/hotel results already
        # exist but none of the action branches matched.  Emit "summarize"
        # so render_widget_chat selects itinerary_summary instead of bot_text.
        if (
            render_intent.get("kind") == "collect_missing"
            and not render_intent.get("missing")
            and region_ready and dates_ready and party_ready
        ):
            render_intent = {"kind": "summarize"}

        first_tool = tool_requests[0] if tool_requests else {}
        call_id = f"call_{uuid.uuid4().hex[:12]}"
        llm_contract = {
            "provider": ai_provider,
            "model": llm_extraction_model,
            "temperature": 0,
            "response_format": "json_object",
            "fallback_used": True,
        }
        turn_events = [
            {"thread_path": thread_path, "event": input_event},
            {
                "thread_path": thread_path,
                "event": {
                    "type": "agent_slot_update",
                    "payload": {
                        "changes": updates,
                        "slot_state": next_state,
                        "llm_contract": llm_contract,
                    },
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            },
        ]
        if first_tool.get("tool"):
            turn_events.append({
                "thread_path": thread_path,
                "event": {
                    "type": "agent_tool_call",
                    "payload": {
                        "call_id": call_id,
                        "tool": first_tool.get("tool", ""),
                        "arguments": first_tool.get("arguments", {}),
                    },
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            })

        result = {
            "thread_path": thread_path,
            "slot_updates": updates,
            "slot_state": next_state,
            "captured_changes": updates,
            "captured_slots": next_state,
            "tool_requests": tool_requests,
            "first_tool": first_tool.get("tool", ""),
            "first_tool_arguments": first_tool.get("arguments", {}),
            "render_intent": render_intent,
            "llm_contract": llm_contract,
            "call_id": call_id,
            "turn_docs": [{
                "path": f"{thread_path}/slot_state/current",
                "doc": next_state,
                "merge": False,
            }],
            "turn_events": turn_events,
            "json_str": json.dumps({"slot_updates": updates, "tool_requests": tool_requests, "render_intent": render_intent}, separators=(",", ":")),
        }
        globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: persist_turn_docs_atomically

  - step: persist_turn_docs_atomically
    desc: Persist projected slot state in one batched Firestore MCP call
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      payload:
        method: tools/call
        tool: batch_set_docs
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          items: "{{ extract_turn.turn_docs }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: append_turn_events_atomically

  - step: append_turn_events_atomically
    desc: Append input, slot update, and optional tool-call events in one batched Firestore MCP call
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      payload:
        method: tools/call
        tool: batch_append_events
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          items: "{{ extract_turn.turn_events }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: call_google_places
          when: "{{ extract_turn.first_tool == 'mcp/google-places.search_text' }}"
        - step: call_duffel_offers
          when: "{{ extract_turn.first_tool == 'mcp/duffel.search_offers' }}"
        - step: call_duffel_create_order
          when: "{{ extract_turn.first_tool == 'mcp/duffel.create_order' }}"
        - step: skip_tool_dispatch
          when: "{{ extract_turn.first_tool == '' }}"

  - step: skip_tool_dispatch
    desc: >
      No-tool turn (extract_turn.first_tool == ''). The Rust orchestrator skips
      non-selected exclusive-arc targets TERMINALLY, so render_widget_chat must
      not be a direct arc of append_turn_events — if it were, a tool-dispatch
      turn would mark it skipped at the branch and it could never be entered
      afterwards via normalize_tool_response. This noop carries the no-tool
      branch into normalize_tool_response, keeping that the single convergence
      point into render.
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: normalize_tool_response

  - step: call_google_places
    desc: Dispatch a Google Places text search through the MCP playbook
    tool:
      kind: playbook
      path: automation/agents/mcp/google-places
      # noetl/ai-meta#136 — block for the child playbook's real result so
      # `call_google_places` carries the provider payload rather than the
      # async-start envelope.
      return_result: true
      result_step: google_places_dispatch
      timeout: 120
      payload:
        method: tools/call
        tool: search_text
        arguments: "{{ extract_turn.first_tool_arguments }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: normalize_tool_response

  - step: call_duffel_offers
    desc: Dispatch Duffel test-environment flight offers search
    tool:
      kind: playbook
      path: automation/agents/mcp/duffel
      # noetl/ai-meta#136 — block for the child playbook's real result so
      # `call_duffel_offers` carries the provider payload rather than the
      # async-start envelope.
      return_result: true
      result_step: duffel_dispatch
      timeout: 120
      payload:
        method: tools/call
        tool: search_offers
        duffel_env: test
        arguments: "{{ extract_turn.first_tool_arguments }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: normalize_tool_response

  - step: call_duffel_create_order
    desc: Dispatch Duffel test-environment wallet order creation
    tool:
      kind: playbook
      path: automation/agents/mcp/duffel
      # noetl/ai-meta#136 — block for the child playbook's real result so
      # `call_duffel_create_order` carries the provider payload rather than the
      # async-start envelope.
      return_result: true
      result_step: duffel_dispatch
      timeout: 120
      payload:
        method: tools/call
        tool: create_order
        duffel_env: test
        arguments: "{{ extract_turn.first_tool_arguments }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: normalize_tool_response

  - step: normalize_tool_response
    desc: Normalize whichever MCP branch ran and update slot state hints
    tool:
      kind: python
      input:
        first_tool: "{{ extract_turn.first_tool }}"
        call_id: "{{ extract_turn.call_id }}"
        slot_state: "{{ extract_turn.captured_slots }}"
        thread_path: "{{ normalize_input.thread_path }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
        places_result: "{{ call_google_places | default({}) }}"
        offers_result: "{{ call_duffel_offers | default({}) }}"
        order_result: "{{ call_duffel_create_order | default({}) }}"
      code: |
        import copy
        import json

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        def _as_list(value):
            return value if isinstance(value, list) else []

        def _display_name(place):
            display = place.get("displayName") if isinstance(place, dict) else {}
            if isinstance(display, dict):
                return display.get("text") or ""
            return str(display or place.get("name") or "")

        def _city_hint(text):
            lowered = str(text or "").lower()
            known = {
                "miami": ("Miami", "MIA", "US"),
                "paris": ("Paris", "PAR", "FR"),
                "boston": ("Boston", "BOS", "US"),
                "new york": ("New York", "NYC", "US"),
                "nyc": ("New York", "NYC", "US"),
                "london": ("London", "LON", "GB"),
            }
            for key, item in known.items():
                if key in lowered:
                    label, code, country = item
                    return {"label": label, "city_code": code, "country_code": country, "kind": "city"}
            return None

        def _place_photo(place):
            google = _as_dict(place.get("_google")) if isinstance(place, dict) else {}
            for key in ("image_url", "maps_static_url", "photo_url"):
                if google.get(key):
                    return google.get(key)
            photos = place.get("photos") if isinstance(place, dict) else []
            if isinstance(photos, list):
                for photo in photos:
                    if isinstance(photo, str) and photo.startswith("http"):
                        return photo
                    if isinstance(photo, dict):
                        for key in ("url", "image_url", "maps_static_url"):
                            if photo.get(key):
                                return photo.get(key)
            return None

        def _place_card(place):
            google = _as_dict(place.get("_google")) if isinstance(place, dict) else {}
            photo = _place_photo(place)
            card = {
                "place_id": str(google.get("place_id") or place.get("id") or place.get("place_id") or ""),
                "name": google.get("name") or _display_name(place) or "Place",
                "types": place.get("types") if isinstance(place.get("types"), list) else google.get("types", ["destination"]),
                "photos": [photo] if photo else [],
                "address": google.get("address") or place.get("formattedAddress") or place.get("address") or "Suggested destination",
                "ctas": ["add_to_itinerary"],
            }
            rating = google.get("rating") if google.get("rating") is not None else place.get("rating")
            rating_count = (
                google.get("user_rating_count")
                if google.get("user_rating_count") is not None
                else place.get("userRatingCount") if place.get("userRatingCount") is not None else place.get("rating_count")
            )
            if isinstance(rating, (int, float)):
                card["rating"] = rating
            if isinstance(rating_count, int):
                card["rating_count"] = rating_count
            return card

        def _hotel_photos(hotel):
            photos = []
            for key in ("photos", "media"):
                values = hotel.get(key) if isinstance(hotel, dict) else []
                if isinstance(values, list):
                    for item in values:
                        if isinstance(item, str) and item.startswith("http"):
                            photos.append(item)
                        elif isinstance(item, dict):
                            url = item.get("uri") or item.get("url") or item.get("href") or item.get("image_url")
                            if url:
                                photos.append(url)
            return photos[:8]

        def _hotel_card(hotel):
            hotel_id = hotel.get("hotel_id") or hotel.get("hotelId") or hotel.get("id") or hotel.get("name") or "hotel"
            address = hotel.get("address")
            if isinstance(address, dict):
                address = ", ".join(str(address.get(key)) for key in ("lines", "cityName", "countryName") if address.get(key))
            geo = hotel.get("geoCode") if isinstance(hotel.get("geoCode"), dict) else hotel.get("location") if isinstance(hotel.get("location"), dict) else {}
            location = {
                "city": hotel.get("city") or hotel.get("cityName") or (address if isinstance(address, str) else ""),
            }
            if isinstance(geo, dict):
                lat = geo.get("latitude") or geo.get("lat")
                lng = geo.get("longitude") or geo.get("lng")
                if lat is not None:
                    location["lat"] = lat
                if lng is not None:
                    location["lng"] = lng
            return {
                "hotel_id": str(hotel_id),
                "name": hotel.get("name") or "Hotel",
                "location": location,
                "star_rating": hotel.get("rating") or hotel.get("star_rating"),
                "score": hotel.get("score") or hotel.get("rating") or 8.0,
                "score_count": hotel.get("score_count") or hotel.get("reviews_count"),
                "photos": _hotel_photos(hotel),
                "amenities": hotel.get("amenities") if isinstance(hotel.get("amenities"), list) else [],
                "price_per_night": hotel.get("price_per_night") or hotel.get("price"),
                "currency": hotel.get("currency") or "USD",
                "address": address if isinstance(address, str) else "",
                "rooms_matching": hotel.get("rooms_matching") or hotel.get("available_rooms"),
                "ctas": ["watch_in_detail", "show_numbers"],
            }

        def _airport_iata(value):
            value = value if isinstance(value, dict) else {}
            return str(value.get("iata") or value.get("iataCode") or value.get("iata_code") or value.get("code") or "").strip()

        def _segment_card(segment):
            segment = segment if isinstance(segment, dict) else {}
            departure = segment.get("departure") if isinstance(segment.get("departure"), dict) else {}
            arrival = segment.get("arrival") if isinstance(segment.get("arrival"), dict) else {}
            carrier = str(segment.get("carrier") or segment.get("carrierCode") or segment.get("carrier_code") or "").strip()
            return {
                "departure": {
                    "iata": _airport_iata(departure),
                    "at": str(departure.get("at") or departure.get("time") or departure.get("datetime") or ""),
                },
                "arrival": {
                    "iata": _airport_iata(arrival),
                    "at": str(arrival.get("at") or arrival.get("time") or arrival.get("datetime") or ""),
                },
                "carrier": carrier or "DU",
                "flight_number": str(segment.get("flight_number") or segment.get("number") or ""),
                "duration": str(segment.get("duration") or "PT0H"),
                "stops": int(segment.get("stops") if segment.get("stops") is not None else segment.get("numberOfStops") if segment.get("numberOfStops") is not None else 0),
            }

        def _itinerary_card(itinerary):
            itinerary = itinerary if isinstance(itinerary, dict) else {}
            segments = itinerary.get("segments") if isinstance(itinerary.get("segments"), list) else []
            return {
                "duration": str(itinerary.get("duration") or "PT0H"),
                "segments": [_segment_card(segment) for segment in segments],
            }

        def _offer_card(offer):
            itineraries = [_itinerary_card(item) for item in offer.get("itineraries", [])] if isinstance(offer.get("itineraries"), list) else []
            carriers = offer.get("carriers") if isinstance(offer.get("carriers"), list) else offer.get("validatingAirlineCodes") if isinstance(offer.get("validatingAirlineCodes"), list) else []
            if not carriers:
                for itinerary in itineraries:
                    for segment in itinerary.get("segments", []):
                        carrier = segment.get("carrier")
                        if carrier and carrier not in carriers:
                            carriers.append(carrier)
            stops = 0
            if itineraries:
                stops = max(0, sum(len(itinerary.get("segments", [])) for itinerary in itineraries) - len(itineraries))
            return {
                "offer_id": offer.get("offer_id") or offer.get("id") or "offer",
                "price": offer.get("price") if isinstance(offer.get("price"), dict) else {"total": str(offer.get("total_amount") or "0"), "currency": offer.get("total_currency") or "USD"},
                "itineraries": itineraries or [{"duration": "PT0H", "segments": []}],
                "carriers": [str(carrier) for carrier in carriers],
                "duration": str(offer.get("duration") or (itineraries[0].get("duration") if itineraries else "PT0H")),
                "stops": int(offer.get("stops") if offer.get("stops") is not None else stops),
                "validating_airline": str(offer.get("validating_airline") or (carriers[0] if carriers else "DU")),
                "ctas": ["view_details", "book_this"],
            }

        def _order_payload(order):
            return {
                "order_id": str(order.get("id") or order.get("order_id") or ""),
                "booking_reference": str(order.get("booking_reference") or order.get("bookingReference") or order.get("id") or ""),
                "total_amount": str(order.get("total_amount") or order.get("base_amount") or "0.00"),
                "total_currency": str(order.get("total_currency") or order.get("base_currency") or "USD"),
                "passengers": order.get("passengers") if isinstance(order.get("passengers"), list) else [],
                "slices": order.get("slices") if isinstance(order.get("slices"), list) else [],
                "documents": order.get("documents") if isinstance(order.get("documents"), list) else [],
                "ctas": ["view_full", "new_search"],
            }

        def _normalise_region_fields(state):
            state = state if isinstance(state, dict) else {}
            region = state.get("region") if isinstance(state.get("region"), dict) else {}
            if not region and state.get("region_label"):
                region = {
                    "label": state.get("region_label"),
                    "city_code": state.get("region_city_code") or "",
                    "country_code": state.get("region_country_code") or "",
                    "kind": state.get("region_kind") or "city",
                }
                state["region"] = region
            if region:
                state["region_label"] = region.get("label") or state.get("region_label") or ""
                state["region_city_code"] = region.get("city_code") or state.get("region_city_code") or ""
                state["region_country_code"] = region.get("country_code") or state.get("region_country_code") or ""
                state["region_kind"] = region.get("kind") or state.get("region_kind") or "city"
            return state

        globals().update({
            "_as_dict": _as_dict,
            "_as_list": _as_list,
            "_display_name": _display_name,
            "_city_hint": _city_hint,
            "_place_photo": _place_photo,
            "_place_card": _place_card,
            "_hotel_photos": _hotel_photos,
            "_hotel_card": _hotel_card,
            "_airport_iata": _airport_iata,
            "_segment_card": _segment_card,
            "_itinerary_card": _itinerary_card,
            "_offer_card": _offer_card,
            "_order_payload": _order_payload,
            "_normalise_region_fields": _normalise_region_fields,
        })

        by_tool = {
            "mcp/google-places.search_text": places_result,
            "mcp/duffel.search_offers": offers_result,
            "mcp/duffel.create_order": order_result,
        }
        envelope = _as_dict(by_tool.get(first_tool))
        data = _as_dict(envelope.get("data") if isinstance(envelope.get("data"), dict) else envelope)
        inner = _as_dict(data.get("data") if isinstance(data.get("data"), dict) else data)
        ok = bool(inner.get("ok", data.get("ok", not envelope.get("isError"))))
        next_state = _normalise_region_fields(copy.deepcopy(_as_dict(slot_state)))
        if first_tool == "mcp/google-places.search_text":
            places = _as_list(inner.get("places") or inner.get("items") or inner.get("results"))
            normalised_places = [_place_card(place) for place in places[:5] if isinstance(place, dict)]
            places_seen = []
            for place in places[:5]:
                if isinstance(place, dict):
                    places_seen.append(place.get("place_id") or place.get("id"))
            next_state["places_seen"] = places_seen
            next_state["total_results_seen"] = len(places)
            if not isinstance(next_state.get("region"), dict) and normalised_places:
                first_place = normalised_places[0]
                next_state["region"] = _city_hint(first_place.get("name", "")) or {
                    "label": first_place.get("name", "Destination"),
                    "city_code": "",
                    "country_code": "",
                    "kind": "city" if "locality" in first_place.get("types", []) else "landmark",
                }
                _normalise_region_fields(next_state)
        elif first_tool == "mcp/duffel.search_offers":
            offers = _as_list(inner.get("offers") or inner.get("items") or inner.get("data"))
            normalised_offers = [_offer_card(offer) for offer in offers[:10] if isinstance(offer, dict)]
            offer_ids = []
            for offer in offers[:10]:
                if isinstance(offer, dict):
                    offer_ids.append(offer.get("id") or offer.get("offer_id"))
            next_state["flight_search_results"] = offer_ids
            next_state["flight_offers"] = normalised_offers
            next_state["total_results_seen"] = len(offers)
        elif first_tool == "mcp/duffel.create_order":
            order = _as_dict(inner.get("order") or inner)
            normalised_order = _order_payload(order)
            next_state["order_id"] = order.get("id")
            next_state["booking_reference"] = order.get("booking_reference") or order.get("bookingReference")
            # Cache the normalised order so the OrderConfirmation
            # "View full order" CTA can re-render without refetching.
            next_state["last_order"] = normalised_order

        summary = {
            "call_id": call_id,
            "tool": first_tool,
            "ok": ok,
            "isError": bool(envelope.get("isError")) or not ok,
            "response_summary": envelope.get("summary") or envelope.get("text") or f"{first_tool} response",
            "response_excerpt": json.dumps(inner, default=str)[:1200],
        }
        if first_tool == "mcp/google-places.search_text":
            summary["places"] = normalised_places
        elif first_tool == "mcp/duffel.search_offers":
            summary["offers"] = normalised_offers
        elif first_tool == "mcp/duffel.create_order":
            summary["order"] = normalised_order
        summary["raw_response"] = envelope
        result = {"summary": summary, "slot_state": next_state, "raw": envelope}
        globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: render_widget_chat

  - step: render_widget_chat
    desc: Emit one validated widget envelope plus optional bot text for the turn
    tool:
      kind: python
      input:
        thread_path: "{{ normalize_input.thread_path }}"
        event_type: "{{ normalize_input.event_type }}"
        event_payload: "{{ normalize_input.event_payload }}"
        extraction_context: "{{ extract_turn }}"
        render_intent: "{{ extract_turn.render_intent }}"
        extraction_json: "{{ extract_turn.json_str | default('{}') }}"
        slot_state_pre_tool: "{{ extract_turn.captured_slots }}"
        slot_state_post_tool: "{{ normalize_tool_response.slot_state | default({}) }}"
        tool_summary: "{{ normalize_tool_response.summary | default({}) }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
      code: |
        import json
        import uuid
        from datetime import date, datetime, timezone, timedelta

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        def _env(widget_type, variant, payload):
            return {"schema_version": 1, "widget_type": widget_type, "variant": variant, "payload": payload}

        def _bot(text):
            return _env("bot_text", "default", {"text": text, "markdown": True})

        globals().update({
            "json": json,
            "uuid": uuid,
            "date": date,
            "datetime": datetime,
            "timezone": timezone,
            "timedelta": timedelta,
            "_as_dict": _as_dict,
            "_env": _env,
            "_bot": _bot,
        })

        extraction_context = _as_dict(extraction_context)
        extraction = _as_dict(extraction_json) or _as_dict(extraction_context.get("json_str"))
        if not extraction.get("slot_updates"):
            extraction = {
                **extraction,
                "slot_updates": _as_dict(extraction_context.get("slot_updates")),
            }
        slot_state = {
            **_as_dict(slot_state_pre_tool),
            **_as_dict(slot_state_post_tool),
            **_as_dict(extraction.get("slot_updates")),
        }
        render_intent = (
            _as_dict(render_intent)
            or _as_dict(extraction_context.get("render_intent"))
            or _as_dict(extraction.get("render_intent"))
        )
        intent = render_intent.get("kind") or "collect_missing"
        tool_summary = _as_dict(tool_summary)
        tool = tool_summary.get("tool", "")
        ok = not tool_summary.get("isError", False)
        tomorrow = date.today() + timedelta(days=30)
        default_from = slot_state.get("check_in_date") or tomorrow.isoformat()
        default_to = slot_state.get("check_out_date") or (tomorrow + timedelta(days=4)).isoformat()
        trip_id = slot_state.get("trip_id") or f"trip_{str(thread_path).split('/')[-1]}"
        if user_uid and user_uid != "guest":
            events_path = f"users/{user_uid}/trips/{trip_id}/events"
        else:
            events_path = f"{thread_path}/trip/current/events"
        globals().update({
            "slot_state": slot_state,
            "default_from": default_from,
            "default_to": default_to,
        })

        def _calendar_events():
            region = slot_state.get("region", {}) if isinstance(slot_state.get("region"), dict) else {}
            destination = region.get("label", "Destination")
            city_code = region.get("city_code", "MIA")
            start = slot_state.get("check_in_date") or default_from
            end = slot_state.get("check_out_date") or default_to
            order_id = slot_state.get("order_id")
            hotel_id = slot_state.get("picked_hotel_id")
            now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
            events = []
            if order_id or slot_state.get("picked_flight_offer_id"):
                events.extend([
                    {
                        "event_id": f"flight_depart_{uuid.uuid4().hex[:8]}",
                        "type": "flight_depart",
                        "start_at": f"{start}T08:00:00-07:00",
                        "end_at": None,
                        "timezone": "America/Los_Angeles",
                        "title": "Depart SFO",
                        "location": "SFO",
                        "notes": "Duffel test-mode flight segment",
                        "source_order_id": order_id,
                        "source_hotel_id": None,
                        "created_at": now,
                        "updated_at": now,
                        "google_calendar_event_id": None,
                    },
                    {
                        "event_id": f"flight_arrive_{uuid.uuid4().hex[:8]}",
                        "type": "flight_arrive",
                        "start_at": f"{start}T16:00:00-04:00",
                        "end_at": None,
                        "timezone": "America/New_York",
                        "title": f"Arrive {city_code}",
                        "location": city_code,
                        "notes": "Duffel test-mode flight segment",
                        "source_order_id": order_id,
                        "source_hotel_id": None,
                        "created_at": now,
                        "updated_at": now,
                        "google_calendar_event_id": None,
                    },
                ])
            if hotel_id:
                events.extend([
                    {
                        "event_id": f"check_in_{uuid.uuid4().hex[:8]}",
                        "type": "check_in",
                        "start_at": f"{start}T15:00:00-04:00",
                        "end_at": None,
                        "timezone": "America/New_York",
                        "title": f"Check in at {destination}",
                        "location": destination,
                        "notes": "Default hotel check-in time",
                        "source_order_id": None,
                        "source_hotel_id": hotel_id,
                        "created_at": now,
                        "updated_at": now,
                        "google_calendar_event_id": None,
                    },
                    {
                        "event_id": f"check_out_{uuid.uuid4().hex[:8]}",
                        "type": "check_out",
                        "start_at": f"{end}T11:00:00-04:00",
                        "end_at": None,
                        "timezone": "America/New_York",
                        "title": f"Check out from {destination}",
                        "location": destination,
                        "notes": "Default hotel check-out time",
                        "source_order_id": None,
                        "source_hotel_id": hotel_id,
                        "created_at": now,
                        "updated_at": now,
                        "google_calendar_event_id": None,
                    },
                ])
            events.extend(slot_state.get("pending_calendar_events") or [])
            return events

        widgets = []
        bot_message = ""
        if not ok and tool:
            widgets.append(_env("error_card", "default", {
                "title": "I could not complete that search",
                "description": _as_dict(tool_summary).get("response_summary", "The provider returned an error. You can retry or continue without this step."),
                "retry_action_id": f"retry:{tool}",
                "contact_support": False,
            }))
            bot_message = "That provider hiccuped, but the itinerary thread is still intact."
        elif intent == "show_places":
            places = tool_summary.get("places") if isinstance(tool_summary.get("places"), list) else []
            widgets.append(_env("place_list", "default", {
                "title": "Places to start from",
                "items": places[:5] or [{
                    "place_id": "synthetic-miami",
                    "name": slot_state.get("region", {}).get("label", "Miami"),
                    "types": ["city", "destination"],
                    "photos": [],
                    "rating": 4.6,
                    "rating_count": 1200,
                    "address": "Suggested destination",
                    "ctas": ["add_to_itinerary"],
                }],
            }))
            bot_message = "I found a destination anchor. Next I need dates and travellers."
        elif intent == "show_flights":
            offers = tool_summary.get("offers") if isinstance(tool_summary.get("offers"), list) else []
            widgets.append(_env("flight_list", "default", {
                "title": "Flight options",
                "items": offers[:10] or [{
                    "offer_id": "synthetic-offer-1",
                    "price": {"total": "220.00", "currency": "USD"},
                    "itineraries": [{"duration": "PT5H30M", "segments": [{
                        "departure": {"iata": "SFO", "at": f"{slot_state.get('check_in_date', default_from)}T08:00:00"},
                        "arrival": {"iata": slot_state.get("region", {}).get("city_code", "MIA"), "at": f"{slot_state.get('check_in_date', default_from)}T16:00:00"},
                        "carrier": "DU", "flight_number": "100", "duration": "PT5H30M", "stops": 0,
                    }]}],
                    "carriers": ["DU"],
                    "duration": "PT5H30M",
                    "stops": 0,
                    "validating_airline": "DU",
                    "ctas": ["view_details", "book_this"],
                }],
                "emphasis_offer_id": "synthetic-offer-1",
                "total_count": 1,
                "currency": "USD",
            }))
            bot_message = "Here is the first flight batch. Book one to create a Duffel test order."
        elif intent == "flight_detail":
            offers = slot_state.get("flight_offers") if isinstance(slot_state.get("flight_offers"), list) else []
            picked_offer_id = str(slot_state.get("picked_flight_offer_id") or "")
            offer = None
            for item in offers:
                if isinstance(item, dict) and str(item.get("offer_id")) == picked_offer_id:
                    offer = item
                    break
            if not offer:
                offer = {
                    "offer_id": picked_offer_id or "selected-offer",
                    "price": {"total": "0.00", "currency": "USD"},
                    "itineraries": [{"duration": "PT0H", "segments": []}],
                    "carriers": ["DU"],
                    "duration": "PT0H",
                    "stops": 0,
                    "validating_airline": "DU",
                    "ctas": ["book_this"],
                }
            widgets.append(_env("flight_card", "full", offer))
            bot_message = "Here are the flight details."
        # UNREACHABLE BY DESIGN in this playbook: no extract branch emits a
        # show_hotels intent since the Amadeus hotel search was removed.  Kept
        # (rather than deleted) so a replayed thread carrying a historical
        # show_hotels turn still renders instead of falling through to error.
        elif intent == "show_hotels":
            hotels = tool_summary.get("hotels") if isinstance(tool_summary.get("hotels"), list) else []
            widgets.append(_env("hotel_list", "default", {
                "title": "Hotels matching the trip",
                "items": hotels[:10] or [{
                    "hotel_id": "synthetic-hotel-1",
                    "name": "Adiona Central Stay",
                    "location": {"city": slot_state.get("region", {}).get("label", "Miami"), "lat": 25.7617, "lng": -80.1918},
                    "star_rating": 4,
                    "score": 8.7,
                    "score_count": 540,
                    "photos": [],
                    "amenities": ["wifi", "breakfast", "pool"],
                    "price_per_night": 185,
                    "currency": "USD",
                    "rooms_matching": 12,
                    "ctas": ["watch_in_detail", "show_numbers"],
                }],
                "total_count": 1,
                "filter_summary": "4 star, central, available for selected dates",
            }))
            bot_message = "Hotel options are ready."
        elif intent == "order_confirmation":
            order = _as_dict(tool_summary.get("order"))
            widgets.append(_env("order_confirmation", "default", {
                "order_id": order.get("order_id") or slot_state.get("order_id") or "order-pending",
                "booking_reference": order.get("booking_reference") or slot_state.get("booking_reference") or "pending",
                "total_amount": order.get("total_amount") or "0.00",
                "total_currency": order.get("total_currency") or "USD",
                "passengers": order.get("passengers") if isinstance(order.get("passengers"), list) else [],
                "slices": order.get("slices") if isinstance(order.get("slices"), list) else [],
                "documents": order.get("documents") if isinstance(order.get("documents"), list) else [],
                "ctas": ["view_full", "new_search"],
            }))
            bot_message = "Your Duffel test order is confirmed."
        elif intent == "order_detail":
            # Back-compat: re-render the cached order without refetching from
            # Duffel. Newer travel UI handles View full order as a client-side
            # expand on the original widget, so this path mainly exists for
            # clients that still emit the order:<id> CTA event.
            order = _as_dict(slot_state.get("last_order"))
            widgets.append(_env("order_confirmation", "default", {
                "order_id": order.get("order_id") or slot_state.get("order_id") or "order-pending",
                "booking_reference": order.get("booking_reference") or slot_state.get("booking_reference") or "pending",
                "total_amount": order.get("total_amount") or "0.00",
                "total_currency": order.get("total_currency") or "USD",
                "passengers": order.get("passengers") if isinstance(order.get("passengers"), list) else [],
                "slices": order.get("slices") if isinstance(order.get("slices"), list) else [],
                "documents": order.get("documents") if isinstance(order.get("documents"), list) else [],
                "ctas": ["new_search"],
            }))
            bot_message = "Here are the booking details."
        elif intent == "summary":
            calendar_events = _calendar_events()
            widgets.append(_env("itinerary_summary", "default", {
                "destination": slot_state.get("region", {}).get("label", "Destination"),
                "dates": {"from": default_from, "to": default_to},
                "traveller_party": slot_state.get("party", {"rooms": 1, "adults": 1, "children": []}),
                "total_cost": {"amount": 960, "currency": "USD"},
                "notes": "Test-mode itinerary. Duffel orders use wallet balance only.",
                "ctas": ["confirm", "edit"],
            }))
            widgets.append(_env("calendar_view", "compact", {
                "trip_id": trip_id,
                "events_path": events_path,
                "display_events": calendar_events,
                "editable": False,
                "empty_state_text": "No events yet. Confirm a flight or hotel to populate the schedule.",
            }))
            bot_message = "The itinerary is ready to review."
        elif intent == "calendar_live":
            calendar_events = _calendar_events()
            calendar_payload = {
                "trip_id": trip_id,
                "events_path": events_path,
                "editable": True,
                "empty_state_text": "No events yet. Confirm a flight or hotel to populate the schedule.",
            }
            if calendar_events:
                calendar_payload["display_events"] = calendar_events
            widgets.append(_env("calendar_view", "full", calendar_payload))
            bot_message = "Here is the current trip schedule."
        elif intent == "summarize":
            # User restated their intent on an already-populated thread.
            # Render the itinerary_summary so they see their current state
            # rather than a generic bot_text fallback.
            calendar_events = _calendar_events()
            region = slot_state.get("region", {}) if isinstance(slot_state.get("region"), dict) else {}
            widgets.append(_env("itinerary_summary", "default", {
                "destination": region.get("label", "Destination"),
                "dates": {"from": default_from, "to": default_to},
                "traveller_party": slot_state.get("party", {"rooms": 1, "adults": 1, "children": []}),
                "total_cost": {"amount": 0, "currency": "USD"},
                "notes": "Current itinerary state. Add more details to refine.",
                "ctas": ["confirm", "edit"],
            }))
            bot_message = "Here is the current itinerary state."
        else:
            missing = _as_dict(render_intent).get("missing") or []
            # Defense-in-depth: if the render_intent was contradictory
            # (collect_missing with an empty missing list) but all core slots
            # are present, treat it as "summarize" rather than emitting bot_text.
            core_slots_present = bool(
                slot_state.get("region")
                and slot_state.get("check_in_date")
                and slot_state.get("check_out_date")
                and slot_state.get("party")
            )
            if not missing and core_slots_present:
                region = slot_state.get("region", {}) if isinstance(slot_state.get("region"), dict) else {}
                widgets.append(_env("itinerary_summary", "default", {
                    "destination": region.get("label", "Destination"),
                    "dates": {"from": default_from, "to": default_to},
                    "traveller_party": slot_state.get("party", {"rooms": 1, "adults": 1, "children": []}),
                    "total_cost": {"amount": 0, "currency": "USD"},
                    "notes": "Current itinerary state.",
                    "ctas": ["confirm", "edit"],
                }))
                bot_message = "Here is the current itinerary state."
            elif "region" in missing:
                widgets.append(_env("place_autocomplete_input", "default", {
                    "placeholder": "Where do you want to go?",
                    "suggestions": [{"label": "Miami", "id": "MIA", "kind": "city"}],
                    "submit_on_select": True,
                }))
                bot_message = "Where should we plan the trip?"
            elif "dates" in missing:
                widgets.append(_env("date_range_picker", "compact", {
                    "min_date": date.today().isoformat(),
                    "max_date": (date.today() + timedelta(days=365)).isoformat(),
                    "default_from": default_from,
                    "default_to": default_to,
                    "locale": "en",
                    "submit": "submit",
                }))
                bot_message = "Pick the travel dates."
            elif "party" in missing:
                widgets.append(_env("party_picker", "default", {
                    "rooms_max": 4,
                    "adults_max": 6,
                    "children_max": 4,
                    "allow_child_ages": True,
                }))
                bot_message = "How many travellers and rooms?"
            else:
                widgets.append(_bot("Tell me the destination, dates, and traveller count, and I will build the itinerary."))
                bot_message = "I can help plan the trip from here."

        # Minimal hard gate: every envelope must include the closed-contract
        # fields. Full schema validation is done by the renderer and smoke
        # harness; invalid generated widgets are swapped to bot_text here.
        safe_widgets = []
        for item in widgets:
            if not isinstance(item, dict) or item.get("schema_version") != 1 or not item.get("widget_type") or not isinstance(item.get("payload"), dict):
                safe_widgets.append(_bot("I prepared a response, but the widget shape was invalid."))
            else:
                safe_widgets.append(item)
        calendar_events = _calendar_events()
        post_docs = []
        if isinstance(tool_summary, dict) and tool_summary.get("tool"):
            post_docs.extend([
                {"path": f"{thread_path}/slot_state/current", "doc": slot_state, "merge": False},
                {
                    "path": f"{thread_path}/api_calls/{tool_summary.get('call_id')}",
                    "doc": {
                        "call_id": tool_summary.get("call_id"),
                        "tool": tool_summary.get("tool"),
                        "arguments": extraction_context.get("first_tool_arguments") if isinstance(extraction_context, dict) else {},
                        "response": tool_summary.get("raw_response", {}),
                    },
                    "merge": False,
                },
            ])
        for event in calendar_events:
            if isinstance(event, dict) and event.get("event_id"):
                post_docs.append({
                    "path": f"{events_path}/{event.get('event_id')}",
                    "doc": event,
                    "merge": False,
                })

        post_events = []
        if isinstance(tool_summary, dict) and tool_summary.get("tool"):
            post_events.append({
                "thread_path": thread_path,
                "event": {
                    "type": "agent_tool_response",
                    "payload": tool_summary,
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            })
        if safe_widgets:
            post_events.append({
                "thread_path": thread_path,
                "event": {
                    "type": "agent_widget_emit",
                    "payload": {"envelope": safe_widgets[0]},
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            })
        if len(safe_widgets) > 1:
            post_events.append({
                "thread_path": thread_path,
                "event": {
                    "type": "agent_widget_emit",
                    "payload": {"envelope": safe_widgets[1]},
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            })
        post_events.append({
            "thread_path": thread_path,
            "event": {
                "type": "agent_chat",
                "payload": {"text": bot_message},
                "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
            },
        })

        result = {
            "thread_path": thread_path,
            "bot_message": bot_message,
            "final_slot_state": slot_state,
            "widgets": safe_widgets,
            "first_widget": safe_widgets[0] if safe_widgets else _bot(bot_message or "Ready."),
            "second_widget": safe_widgets[1] if len(safe_widgets) > 1 else {},
            "has_second_widget": len(safe_widgets) > 1,
            "calendar_events_path": events_path,
            "calendar_events": calendar_events,
            "first_calendar_event": calendar_events[0] if calendar_events else {},
            "second_calendar_event": calendar_events[1] if len(calendar_events) > 1 else {},
            "third_calendar_event": calendar_events[2] if len(calendar_events) > 2 else {},
            "fourth_calendar_event": calendar_events[3] if len(calendar_events) > 3 else {},
            "post_docs": post_docs,
            "post_events": post_events,
        }
        globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: persist_render_docs_atomically
          when: "{{ render_widget_chat.post_docs | length > 0 }}"
          set:
            ctx.first_widget: "{{ render_widget_chat.first_widget }}"
            ctx.second_widget: "{{ render_widget_chat.second_widget }}"
            ctx.has_second_widget: "{{ render_widget_chat.has_second_widget | default(false) }}"
            ctx.bot_message: "{{ render_widget_chat.bot_message }}"
            ctx.final_slot_state: "{{ render_widget_chat.final_slot_state }}"
            ctx.post_docs: "{{ render_widget_chat.post_docs }}"
            ctx.post_events: "{{ render_widget_chat.post_events }}"
        - step: append_render_events_atomically
          when: "{{ render_widget_chat.post_docs | length == 0 }}"
          set:
            ctx.first_widget: "{{ render_widget_chat.first_widget }}"
            ctx.second_widget: "{{ render_widget_chat.second_widget }}"
            ctx.has_second_widget: "{{ render_widget_chat.has_second_widget | default(false) }}"
            ctx.bot_message: "{{ render_widget_chat.bot_message }}"
            ctx.final_slot_state: "{{ render_widget_chat.final_slot_state }}"
            ctx.post_events: "{{ render_widget_chat.post_events }}"

  - step: persist_render_docs_atomically
    desc: Persist tool replay docs, final slot state, and calendar event docs in one batched Firestore MCP call
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      payload:
        method: tools/call
        tool: batch_set_docs
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          items: "{{ ctx.post_docs }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: append_render_events_atomically

  - step: append_render_events_atomically
    desc: Append tool response, widget, optional companion widget, and chat events in one batched Firestore MCP call
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      payload:
        method: tools/call
        tool: batch_append_events
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          items: "{{ ctx.post_events }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: final_result

  - step: final_result
    desc: Return the execution-level result for the caller
    tool:
      kind: python
      input:
        thread_path: "{{ normalize_input.thread_path }}"
        slot_state: "{{ ctx.final_slot_state }}"
        extraction: "{{ extract_turn }}"
        widget: "{{ ctx.first_widget }}"
        bot_message: "{{ ctx.bot_message }}"
        request_id: "{{ workload.request_id | default('') }}"
        gateway_url: "{{ workload.gateway_url | default('') }}"
      code: |
        import json
        import urllib.request

        result = {
            "status": "completed",
            "thread_id": thread_path.split("/", 1)[1] if "/" in str(thread_path) else thread_path,
            "thread_path": thread_path,
            "final_slot_state": slot_state,
            "emitted_widget_types": [widget.get("widget_type")] if isinstance(widget, dict) else [],
            "render": widget,
            "bot_message": bot_message,
            "llm_contract": extraction.get("llm_contract") if isinstance(extraction, dict) else {},
            "replay": {
                "supported": True,
                "tool_responses_path": f"{thread_path}/api_calls",
                "drift_policy": "slot_updates and widget_type sequence are stable; chat wording drift is tolerated",
            },
        }

        if request_id and gateway_url:
            try:
                callback_url = gateway_url.rstrip("/") + "/api/internal/callback/async"
                body = json.dumps({
                    "request_id": request_id,
                    "status": "COMPLETED",
                    "data": result,
                }).encode("utf-8")
                req = urllib.request.Request(
                    callback_url,
                    data=body,
                    headers={"Content-Type": "application/json"},
                    method="POST",
                )
                with urllib.request.urlopen(req, timeout=5) as response:
                    result["gateway_callback"] = {
                        "delivered": 200 <= response.status < 300,
                        "status_code": response.status,
                    }
            except Exception as exc:
                result["gateway_callback"] = {
                    "delivered": False,
                    "error": str(exc)[:300],
                }
