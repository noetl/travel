apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: muno_itinerary_planner
  path: muno/playbooks/itinerary-planner
  description: |
    Muno itinerary planner agent.

    Processes one chat-thread input event per invocation. The thread is
    event-sourced in Firestore through mcp/firestore.append_event, state is
    projected into chat_threads/{thread_id}/slot_state, and tool calls route
    through the existing MCP playbooks. Providers wired into natural-language
    routing: destinations (Google Places, OIDC/Workload-Identity), flights
    (Duffel test env), hotels / activities / transfers (HotelBeds APITUDE,
    SHA256 signature auth — each its own GSM secret). Hotel search via Amadeus
    was removed (Amadeus dropped developer-API support); the mcp/amadeus
    playbook and its GSM secret are left in place but unreferenced.

    Every provider is reachable as a direct first-turn intent: "flights from
    NYC to Paris" parses origin/destination and reaches Duffel in one turn,
    "hotels in Paris" / "things to do in Paris" / "airport transfer from CDG"
    each land on their HotelBeds provider, and a bare destination shows Places.
    Flight intent fills origin/destination/dates/party (defaulting dates
    forward, party to one adult, origin to the home metro) so a follow-up is
    asked only when the destination is truly absent.

    Hotels are bookable end-to-end (noetl/ai-meta#162), mirroring the Duffel
    flight pattern: a "Book" CTA on a hotel card sets picked_hotel_id + a book
    intent, the planner carries the hotel's rate_key (captured from search) to
    mcp/hotelbeds.book_hotel (checkRate→bookings, TEST/SANDBOX only), and a
    hotel_confirmation widget renders the real booking reference.
  version: "1.7"
  agent: true
  tags: [muno, itinerary, trip-planner, event-sourced, widgets]
  terminal:
    visible: true
    workspace: muno
    scopes: [/muno/itinerary, /mcp/firestore, /mcp/duffel, /mcp/google-places, /mcp/hotelbeds, /mcp/hotelbeds-activities, /mcp/hotelbeds-transfers]
  capabilities: [mcp:firestore, mcp:duffel, mcp:google-places, mcp:hotelbeds, mcp:hotelbeds-activities, mcp:hotelbeds-transfers, ai:openai, ai:anthropic, ai:vertex-ai, ai:ollama]

workload:
  pg_auth: pg_k8s
  gcp_auth: google_oauth
  gcp_project: noetl-demo-19700101
  ai_provider: openai
  llm_extraction_model: gpt-4o
  llm_chat_model: gpt-4o-mini
  openai_secret_path: projects/1014428265962/secrets/openai-api-key/versions/1
  anthropic_secret_path: projects/1014428265962/secrets/anthropic-api-key/versions/1
  thread_id: ""
  user_uid: guest
  request_id: ""
  gateway_url: ""
  event_type: user_message
  event_payload: {}
  firestore_database: "(default)"
  duffel_env: test
  flight_provider: duffel
  enrich_with_google_places: true
  replay: false
  replay_thread_id: ""
  # ── SLM shadow rollout (RFC docs/rfc/travel-slm-shadow-rollout.md, Option A) ──
  # Runs the v3 travel SLM ALONGSIDE the live deterministic path for comparison.
  # Default OFF → the shadow branch never fires and this playbook is byte-identical
  # to today.  The SLM output is logged only; it NEVER reaches the user response
  # (the response chain reads extract_turn / render_widget_chat exclusively, never
  # the shadow steps).  Any SLM error/timeout is recorded as fell_back and is a
  # no-op for the served turn.  Flip enabled=true + set endpoint to turn shadow on.
  slm_shadow:
    enabled: false
    endpoint: ""                 # slm_serve URL, e.g. http://host.containers.internal:8099
    model_urn: "registry://muno/travel/model/travel_slm_multitask/3"
    timeout_ms: 60000            # generous for the MLX pilot (1.5B ~2-5s/pass); a no-op on timeout
    compare_render: true

keychain:
  # Existing provider secrets only. Keychain expressions use bare workload
  # references per the playbook authoring guide.
  - name: openai_token
    kind: secrets
    provider: gcp
    scope: global
    auth: "{{ gcp_auth }}"
    map:
      api_key: "{{ openai_secret_path }}"

  - name: anthropic_token
    kind: secrets
    provider: gcp
    scope: global
    auth: "{{ gcp_auth }}"
    map:
      api_key: "{{ anthropic_secret_path }}"

workflow:
  - step: start
    desc: Entry point — the Rust runtime requires a step named `start`; routes to normalize_input
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: normalize_input

  - step: normalize_input
    desc: Normalize caller input and generate a thread id when needed
    tool:
      kind: python
      input:
        thread_id: "{{ workload.thread_id }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
        event_type: "{{ workload.event_type | default('user_message') }}"
        event_payload: "{{ workload.event_payload | default({}) }}"
        replay: "{{ workload.replay | default(false) }}"
        replay_thread_id: "{{ workload.replay_thread_id | default('') }}"
      code: |
        import json
        import time
        import uuid

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        tid = str(replay_thread_id or thread_id or "").strip()
        if not tid:
            tid = f"chat_threads/_smoke-{uuid.uuid4().hex[:10]}"
        elif not tid.startswith("chat_threads/"):
            tid = f"chat_threads/{tid.strip('/')}"

        payload = _as_dict(event_payload)
        event = {
            "type": str(event_type or "user_message"),
            "payload": payload,
            "actor": {"kind": "user", "uid": user_uid or "guest"},
            "created_at_ms": int(time.time() * 1000),
            "source": "muno.itinerary_planner",
        }
        result = {
            "thread_path": tid,
            "thread_id": tid.split("/", 1)[1] if "/" in tid else tid,
            "event_type": event["type"],
            "event_payload": payload,
            "input_event": event,
            "replay": bool(replay),
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: load_slot_state

  - step: load_slot_state
    desc: Load current slot projection from Firestore
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      # noetl/ai-meta#136 — block for the child's real result so
      # `load_slot_state.data` carries the actual Firestore projection
      # instead of the async-start envelope.
      return_result: true
      result_step: firestore_dispatch
      timeout: 90
      payload:
        method: tools/call
        tool: get_doc
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          path: "{{ normalize_input.thread_path }}/slot_state/current"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: extract_turn

  - step: extract_turn
    desc: JSON-mode extraction of slot updates, tool requests, and render intent
    tool:
      kind: python
      input:
        thread_path: "{{ normalize_input.thread_path }}"
        event_type: "{{ workload.event_type | default('user_message') }}"
        event_payload: "{{ workload.event_payload | default({}) }}"
        input_event: "{{ normalize_input.input_event }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
        loaded_slot_state: "{{ load_slot_state.data | default({}) }}"
        ai_provider: "{{ workload.ai_provider | default('openai') }}"
        llm_extraction_model: "{{ workload.llm_extraction_model }}"
        openai_api_key: "{{ keychain.openai_token.api_key | default('') }}"
        anthropic_api_key: "{{ keychain.anthropic_token.api_key | default('') }}"
        flight_provider: "{{ workload.flight_provider | default('duffel') }}"
        duffel_env: "{{ workload.duffel_env | default('test') }}"
      code: |
        import copy
        import json
        import re
        import uuid
        from datetime import date, datetime, timezone, timedelta

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        def _text_from_event(payload):
            payload = _as_dict(payload)
            return str(payload.get("text") or payload.get("message") or payload.get("label") or "").strip()

        def _slot_from_loaded(value):
            item = _as_dict(value)
            data = item.get("data")
            if isinstance(data, dict):
                return copy.deepcopy(data)
            document = item.get("document")
            if isinstance(document, dict):
                document_data = document.get("data")
                if isinstance(document_data, dict):
                    return copy.deepcopy(document_data)
            if any(key in item for key in ("region", "region_label", "check_in_date", "party", "places_seen")):
                return copy.deepcopy(item)
            return {}

        def _city_hint(text):
            lowered = text.lower()
            known = {
                "miami": ("Miami", "MIA", "US"),
                "paris": ("Paris", "PAR", "FR"),
                "boston": ("Boston", "BOS", "US"),
                "new york": ("New York", "NYC", "US"),
                "nyc": ("New York", "NYC", "US"),
                "london": ("London", "LON", "GB"),
                "san francisco": ("San Francisco", "SFO", "US"),
                "los angeles": ("Los Angeles", "LAX", "US"),
            }
            for key, item in known.items():
                if key in lowered:
                    label, code, country = item
                    return {"label": label, "city_code": code, "country_code": country, "kind": "city"}
            # Airport-code fallback (word-boundary). Lets an airport-only query
            # like "airport transfer from CDG" resolve the destination region
            # so the transfers / flights branches can fire in one turn. The
            # short codes only match as whole words to avoid substring false
            # positives ("relax" must not match LAX).
            airport_codes = {
                "cdg": ("Paris", "PAR", "FR"), "ory": ("Paris", "PAR", "FR"), "orly": ("Paris", "PAR", "FR"),
                "jfk": ("New York", "NYC", "US"), "ewr": ("New York", "NYC", "US"), "lga": ("New York", "NYC", "US"),
                "lhr": ("London", "LON", "GB"), "lgw": ("London", "LON", "GB"), "heathrow": ("London", "LON", "GB"),
                "mia": ("Miami", "MIA", "US"),
                "bos": ("Boston", "BOS", "US"),
                "lax": ("Los Angeles", "LAX", "US"),
                "sfo": ("San Francisco", "SFO", "US"),
            }
            for code_key, item in airport_codes.items():
                if re.search(r"\b" + code_key + r"\b", lowered):
                    label, code, country = item
                    return {"label": label, "city_code": code, "country_code": country, "kind": "city"}
            return None

        # Combined city-name + airport-code -> (IATA code, label, country) map
        # for parsing flight routes. Duffel test env accepts both metro city
        # codes (NYC, PAR, LON) and specific airport codes (JFK, CDG, LHR).
        _PLACE_CODES = {
            "new york": ("NYC", "New York", "US"), "nyc": ("NYC", "New York", "US"),
            "jfk": ("JFK", "New York", "US"), "newark": ("EWR", "New York", "US"),
            "ewr": ("EWR", "New York", "US"), "lga": ("LGA", "New York", "US"),
            "paris": ("PAR", "Paris", "FR"), "par": ("PAR", "Paris", "FR"),
            "cdg": ("CDG", "Paris", "FR"), "orly": ("ORY", "Paris", "FR"), "ory": ("ORY", "Paris", "FR"),
            "miami": ("MIA", "Miami", "US"), "mia": ("MIA", "Miami", "US"),
            "london": ("LON", "London", "GB"), "lon": ("LON", "London", "GB"),
            "lhr": ("LHR", "London", "GB"), "heathrow": ("LHR", "London", "GB"),
            "gatwick": ("LGW", "London", "GB"), "lgw": ("LGW", "London", "GB"),
            "boston": ("BOS", "Boston", "US"), "bos": ("BOS", "Boston", "US"),
            "san francisco": ("SFO", "San Francisco", "US"), "sfo": ("SFO", "San Francisco", "US"),
            "los angeles": ("LAX", "Los Angeles", "US"), "lax": ("LAX", "Los Angeles", "US"),
        }

        def _resolve_place(token):
            token = re.sub(r"[^a-z ]", " ", str(token or "").lower()).strip()
            if not token:
                return None
            if token in _PLACE_CODES:
                return _PLACE_CODES[token]
            # Longest known key that appears as a whole word inside the phrase,
            # so "from new york city" -> NYC and "from CDG airport" -> CDG.
            for key in sorted(_PLACE_CODES, key=len, reverse=True):
                if re.search(r"\b" + re.escape(key) + r"\b", token):
                    return _PLACE_CODES[key]
            return None

        def _flight_route(text):
            # Parse origin / destination from natural language like
            # "flights from NYC to Paris". Returns (origin_meta, dest_meta),
            # each (code, label, country) or None. Falls back to standalone
            # "from X" / "to Y" when only one endpoint is stated.
            lowered = " " + str(text or "").lower() + " "
            origin = dest = None
            m = re.search(r"\bfrom\s+(.+?)\s+to\s+(.+?)(?:[,.;]| on | next | in | for | departing| leaving|$)", lowered)
            if m:
                origin = _resolve_place(m.group(1))
                dest = _resolve_place(m.group(2))
            if origin is None:
                mo = re.search(r"\bfrom\s+([a-z][a-z ]*?)(?:[,.;]| to | on | next | in | for |$)", lowered)
                if mo:
                    origin = _resolve_place(mo.group(1))
            if dest is None:
                mt = re.search(r"\bto\s+([a-z][a-z ]*?)(?:[,.;]| from | on | next | in | for |$)", lowered)
                if mt:
                    dest = _resolve_place(mt.group(1))
            return origin, dest

        def _date_hint(text):
            lowered = text.lower()
            today = date.today()
            if "next month" in lowered:
                first = (today.replace(day=1) + timedelta(days=32)).replace(day=12)
                return first.isoformat(), (first + timedelta(days=4)).isoformat()
            match = re.search(r"(20\d\d-\d\d-\d\d)(?:\s*(?:to|-|through)\s*(20\d\d-\d\d-\d\d))?", text)
            if match:
                start = match.group(1)
                end = match.group(2) or (date.fromisoformat(start) + timedelta(days=4)).isoformat()
                return start, end
            return None, None

        def _party_hint(text):
            lowered = text.lower()
            adults = 2 if "couple" in lowered else None
            match = re.search(r"(\d+)\s+(?:adult|adults|traveller|travelers|people)", lowered)
            if match:
                adults = int(match.group(1))
            return {"rooms": 1, "adults": adults or 1, "children": []} if adults else None

        def _deep_merge(base, patch):
            out = copy.deepcopy(base) if isinstance(base, dict) else {}
            for key, value in _as_dict(patch).items():
                if isinstance(value, dict) and isinstance(out.get(key), dict):
                    out[key] = _deep_merge(out[key], value)
                else:
                    out[key] = value
            return out

        def _normalise_region_fields(state):
            state = state if isinstance(state, dict) else {}
            region = state.get("region") if isinstance(state.get("region"), dict) else {}
            if not region and state.get("region_label"):
                region = {
                    "label": state.get("region_label"),
                    "city_code": state.get("region_city_code") or "",
                    "country_code": state.get("region_country_code") or "",
                    "kind": state.get("region_kind") or "city",
                }
                state["region"] = region
            if region:
                state["region_label"] = region.get("label") or state.get("region_label") or ""
                state["region_city_code"] = region.get("city_code") or state.get("region_city_code") or ""
                state["region_country_code"] = region.get("country_code") or state.get("region_country_code") or ""
                state["region_kind"] = region.get("kind") or state.get("region_kind") or "city"
            return state

        def _city_geo(region):
            # Coordinates + primary airport for the known-city set the planner
            # recognises via _city_hint. Transfers need a GPS to_code in
            # latitude,longitude order (verified HotelBeds behaviour, see
            # noetl/ai-meta#138); activities reuse the city_code as the
            # destination filter, so only transfers consult this map.
            region = region if isinstance(region, dict) else {}
            code = str(region.get("city_code") or "").upper()
            label = str(region.get("label") or "").lower()
            geo = {
                "PAR": {"lat": 48.8566, "lng": 2.3522, "airport": "CDG"},
                "MIA": {"lat": 25.7617, "lng": -80.1918, "airport": "MIA"},
                "NYC": {"lat": 40.7128, "lng": -74.0060, "airport": "JFK"},
                "LON": {"lat": 51.5074, "lng": -0.1278, "airport": "LHR"},
                "BOS": {"lat": 42.3601, "lng": -71.0589, "airport": "BOS"},
            }
            if code in geo:
                return geo[code]
            for key_label, key_code in (("paris", "PAR"), ("miami", "MIA"), ("new york", "NYC"), ("nyc", "NYC"), ("london", "LON"), ("boston", "BOS")):
                if key_label in label:
                    return geo[key_code]
            return {}

        globals().update({
            "copy": copy,
            "json": json,
            "re": re,
            "uuid": uuid,
            "date": date,
            "datetime": datetime,
            "timezone": timezone,
            "timedelta": timedelta,
            "_as_dict": _as_dict,
            "_text_from_event": _text_from_event,
            "_slot_from_loaded": _slot_from_loaded,
            "_city_hint": _city_hint,
            "_date_hint": _date_hint,
            "_party_hint": _party_hint,
            "_deep_merge": _deep_merge,
            "_normalise_region_fields": _normalise_region_fields,
            "_city_geo": _city_geo,
            "_PLACE_CODES": _PLACE_CODES,
            "_resolve_place": _resolve_place,
            "_flight_route": _flight_route,
        })

        slot_state = _normalise_region_fields(_slot_from_loaded(loaded_slot_state))
        text = _text_from_event(event_payload)
        updates = {}
        region = _city_hint(text)
        if region:
            updates["region"] = region
        start, end = _date_hint(text)
        if start:
            updates["check_in_date"] = start
            updates["check_out_date"] = end
            try:
                updates["nights"] = max(1, (date.fromisoformat(end) - date.fromisoformat(start)).days)
            except Exception:
                updates["nights"] = None
        party = _party_hint(text)
        if party:
            updates["party"] = party

        payload = _as_dict(event_payload)
        input_event = _as_dict(input_event)
        if not input_event:
            input_event = {
                "type": str(event_type or "user_message"),
                "payload": payload,
                "actor": {"kind": "user", "uid": user_uid or "guest"},
                "created_at_ms": int(datetime.now(timezone.utc).timestamp() * 1000),
                "source": "muno.itinerary_planner",
            }
        lowered_text = text.lower()
        globals().update({"lowered_text": lowered_text})
        book_flight_now = False
        view_flight_now = False
        view_order_now = False
        book_hotel_now = False
        if event_type in ("user_widget_submit", "user_widget_cta_click"):
            submitted = _as_dict(payload.get("submitted_value") or payload.get("value"))
            action_id = str(payload.get("action_id") or submitted.get("action_id") or "").strip()
            if "date" in action_id or ("from" in submitted and "to" in submitted):
                updates["check_in_date"] = submitted.get("from")
                updates["check_out_date"] = submitted.get("to")
                updates["nights"] = submitted.get("nights")
            if "party" in action_id or "adults" in submitted:
                updates["party"] = {
                    "rooms": submitted.get("rooms", 1),
                    "adults": submitted.get("adults", 1),
                    "children": submitted.get("children", []),
                }
            if "place" in action_id or submitted.get("kind") in ("airport", "city", "landmark"):
                label = str(submitted.get("label") or submitted.get("name") or submitted.get("id") or "").strip()
                place_id = str(submitted.get("id") or action_id.replace("add_place:", "")).strip()
                if label:
                    updates["region"] = _city_hint(label) or {
                        "label": label,
                        "city_code": place_id if submitted.get("kind") == "airport" else "",
                        "country_code": "",
                        "kind": submitted.get("kind") or "city",
                    }
                if place_id:
                    updates["picked_place_id"] = place_id
                    updates["places_seen"] = [place_id]
            if action_id.startswith(("book_offer:", "pick_offer:")) or submitted.get("offer_id"):
                offer_id_from_action = action_id.split(":", 1)[1] if ":" in action_id else action_id
                updates["picked_flight_offer_id"] = submitted.get("offer_id") or offer_id_from_action
                # Back-compat: earlier flight cards labelled the CTA "Book This"
                # but emitted pick_offer:<id>. Treat those clicks as booking.
                book_flight_now = True
            elif action_id.startswith("view_offer:"):
                updates["picked_flight_offer_id"] = action_id.split(":", 1)[1] if ":" in action_id else action_id
                view_flight_now = True
            elif action_id.startswith("order:"):
                # OrderConfirmation "View full order" CTA emits order:<order_id>;
                # render the saved last_order without retriggering downstream
                # search/booking branches.
                view_order_now = True
            if "hotel" in action_id or submitted.get("hotel_id"):
                # action ids: view_hotel:<id> (details), pick_hotel:<id>
                # (numbers), book_hotel:<id> (booking). Parse the id cleanly
                # rather than stripping a single prefix so view/book carry the
                # bare hotel_id.
                hotel_id_from_action = action_id.split(":", 1)[1] if ":" in action_id else action_id
                updates["picked_hotel_id"] = submitted.get("hotel_id") or hotel_id_from_action
                # noetl/ai-meta#162 — a Book CTA carries the booking intent (the
                # Duffel book_offer analogue). The rate_key is normally looked
                # up from the picked hotel_offer card below, but honour an
                # explicit one on the submit payload too.
                if action_id.startswith("book_hotel:"):
                    book_hotel_now = True
                if submitted.get("rate_key"):
                    updates["picked_hotel_rate_key"] = str(submitted.get("rate_key"))
            # noetl/ai-meta#165 — the itinerary_summary "Confirm" CTA finalizes
            # the trip (renders the trip map) instead of dead-ending on a
            # re-rendered summary; "Edit" drops back to the editable summary.
            if action_id == "confirm":
                updates["trip_confirmed"] = True
            elif action_id == "edit":
                updates["trip_confirmed"] = False

        wants_calendar = "show" in lowered_text and ("schedule" in lowered_text or "calendar" in lowered_text)
        wants_order = book_flight_now or book_hotel_now or any(word in lowered_text for word in ("order", "book", "booking", "confirm", "purchase"))
        # HotelBeds replaces the removed Amadeus hotels path. A hotel-intent
        # query (e.g. "hotels in Paris") routes to mcp/hotelbeds.search_hotels.
        wants_hotel = any(word in lowered_text for word in ("hotel", "accommodation", "lodging", "place to stay", "where to stay"))
        # HotelBeds Activities — "things to do", tours, excursions, sightseeing.
        wants_activities = any(phrase in lowered_text for phrase in ("things to do", "activities", "activity", "tours", "tour", "what to do", "excursion", "sightseeing", "attractions"))
        # HotelBeds Transfers — airport transfer / ride / shuttle / pickup.
        # Note: no bare airport-code trigger here ("from cdg" etc.) — that
        # collided with explicit flight intent ("fly from CDG to JFK"). The
        # real transfer phrasings below ("transfer", "shuttle", "airport
        # pickup") already cover "airport transfer from CDG".
        wants_transfers = any(phrase in lowered_text for phrase in ("transfer", "airport pickup", "airport pick-up", "ride from", "ride to", "shuttle", "from the airport", "to the airport"))
        # Duffel Flights — explicit flight intent. "transfer" already routes to
        # HotelBeds, so flight words are checked independently; the elif chain
        # below gives hotels/transfers/activities priority when both appear.
        wants_flight = any(word in lowered_text for word in ("flight", "flights", "fly", "flying", "airfare", "airline", "plane", "air ticket"))

        # Resolve a flight route ("from NYC to Paris") so a direct flight
        # request fills origin + destination + region in one turn. The parsed
        # destination overrides region (it is the true endpoint — _city_hint
        # otherwise returns whichever known city appears first in the text).
        if wants_flight:
            origin_meta, dest_meta = _flight_route(text)
            if dest_meta:
                # region carries the metro city (PAR), flight_destination the
                # parsed IATA (CDG or PAR — Duffel test env accepts both).
                updates["region"] = _city_hint(dest_meta[1]) or {"label": dest_meta[1], "city_code": dest_meta[0], "country_code": dest_meta[2], "kind": "city"}
                updates["flight_destination"] = dest_meta[0]
            if origin_meta:
                updates["flight_origin"] = origin_meta[0]

        if any(word in lowered_text for word in ("meeting", "appointment", "reminder", "note")) and "add" in lowered_text:
            updates["pending_calendar_events"] = [{
                "event_id": f"note_{uuid.uuid4().hex[:10]}",
                "type": "user_note",
                "start_at": f"{(date.today() + timedelta(days=7)).isoformat()}T15:00:00-04:00",
                "end_at": None,
                "timezone": "America/New_York",
                "title": text[:80] or "Trip note",
                "location": "",
                "notes": text,
                "source_order_id": None,
                "source_hotel_id": None,
                "google_calendar_event_id": None,
            }]

        # A destination (re)statement in a free-text user_message starts a
        # fresh place lookup for that region.  Without this, a thread that has
        # already shown places (places_seen populated) never re-shows them when
        # the user restates the SAME city, and — worse — never shows the NEW
        # city's places when they CHANGE destination ("Trip to London" on a
        # Paris thread).  Drop the prior place ids so show_places fires again
        # and normalize_tool_response replaces places_seen with the new city's
        # results instead of leaving stale Paris ids behind.  Scope strictly to
        # user_message: a user_widget_submit place-pick also writes
        # updates["region"] (above) but must advance the flow, not re-search.
        region_restated = ("region" in updates) and event_type == "user_message"
        if region_restated:
            updates["places_seen"] = []
            updates["total_results_seen"] = 0
            # noetl/ai-meta#165 — a fresh destination after a finalized trip
            # starts a new plan, so drop the terminal trip_map lock.
            updates["trip_confirmed"] = False

        next_state = _normalise_region_fields(_deep_merge(slot_state, updates))
        region_ready = isinstance(next_state.get("region"), dict)
        dates_ready = bool(next_state.get("check_in_date") and next_state.get("check_out_date"))
        party_ready = isinstance(next_state.get("party"), dict)
        picked_flight = bool(next_state.get("picked_flight_offer_id"))
        picked_hotel = bool(next_state.get("picked_hotel_id"))
        trip_confirmed = bool(next_state.get("trip_confirmed"))

        # noetl/ai-meta#162 — resolve the bookable rate_key for the picked
        # hotel. Prefer an explicit one carried on the submit; otherwise look it
        # up from the hotel_offers cards captured at search time (mirrors how a
        # picked flight offer id is already in slot_state). Also grab the hotel
        # name/price for the confirmation summary.
        picked_hotel_rate_key = str(next_state.get("picked_hotel_rate_key") or "")
        picked_hotel_card = {}
        if picked_hotel:
            for _card in (next_state.get("hotel_offers") if isinstance(next_state.get("hotel_offers"), list) else []):
                if isinstance(_card, dict) and str(_card.get("hotel_id")) == str(next_state.get("picked_hotel_id")):
                    picked_hotel_card = _card
                    if not picked_hotel_rate_key:
                        picked_hotel_rate_key = str(_card.get("rate_key") or "")
                    break
        if picked_hotel_rate_key:
            next_state["picked_hotel_rate_key"] = picked_hotel_rate_key

        def _test_passengers(party):
            party = party if isinstance(party, dict) else {}
            adults = max(1, int(party.get("adults") or 1))
            children = party.get("children") if isinstance(party.get("children"), list) else []
            adult_given_names = ["Alex", "Jordan", "Morgan", "Casey", "Taylor", "Riley", "Avery", "Jamie"]
            child_given_names = ["Sam", "Robin", "Quinn", "Skyler", "Rowan", "Reese", "Elliot", "Harper"]
            passengers = []
            for idx in range(adults):
                passengers.append({
                    "given_name": adult_given_names[idx % len(adult_given_names)],
                    "family_name": "Traveler",
                    "born_on": "1988-01-01",
                    "gender": "m" if idx % 2 == 0 else "f",
                    "email": "test@example.com",
                    "phone_number": "+442080168000",
                })
            for idx, child in enumerate(children):
                age = child.get("age") if isinstance(child, dict) else None
                try:
                    birth_year = date.today().year - int(age or 8)
                except Exception:
                    birth_year = date.today().year - 8
                passengers.append({
                    "given_name": child_given_names[idx % len(child_given_names)],
                    "family_name": "Traveler",
                    "born_on": f"{birth_year}-01-01",
                    "gender": "f" if idx % 2 == 0 else "m",
                    "email": "test@example.com",
                    "phone_number": "+442080168000",
                })
            return passengers

        tool_requests = []
        render_intent = {"kind": "collect_missing", "missing": []}
        if not region_ready:
            render_intent["missing"].append("region")
        if not dates_ready:
            render_intent["missing"].append("dates")
        if not party_ready:
            render_intent["missing"].append("party")

        if trip_confirmed:
            # noetl/ai-meta#165 — the user tapped Confirm on the summary: the
            # trip is finalized. Render the trip on a map (the terminal view)
            # instead of dead-ending on a re-rendered summary. "Edit" clears
            # trip_confirmed and drops back to the editable summary.
            render_intent = {"kind": "trip_map"}
        elif wants_hotel and region_ready:
            # HotelBeds availability search (the slot Amadeus hotels vacated).
            # Geolocation is resolved provider-side from the city/coords; stay
            # dates default forward when the user hasn't pinned them yet.
            hotel_region = next_state.get("region") if isinstance(next_state.get("region"), dict) else {}
            hotel_check_in = next_state.get("check_in_date") or (date.today() + timedelta(days=30)).isoformat()
            try:
                hotel_check_out = next_state.get("check_out_date") or (date.fromisoformat(hotel_check_in) + timedelta(days=4)).isoformat()
            except Exception:
                hotel_check_out = (date.today() + timedelta(days=34)).isoformat()
            hotel_party = next_state.get("party") if isinstance(next_state.get("party"), dict) else {}
            tool_requests.append({
                "tool": "mcp/hotelbeds.search_hotels",
                "arguments": {
                    "city": hotel_region.get("label", ""),
                    "city_code": hotel_region.get("city_code", ""),
                    "check_in": hotel_check_in,
                    "check_out": hotel_check_out,
                    "adults": int(hotel_party.get("adults") or 1),
                    "rooms": int(hotel_party.get("rooms") or 1),
                    "children": len(hotel_party.get("children") or []),
                    "radius": 20,
                },
            })
            render_intent = {"kind": "show_hotels"}
        elif wants_transfers and region_ready:
            # HotelBeds Transfers availability. Airport (IATA) -> city centre
            # (GPS to_code in latitude,longitude order, per the verified API
            # behaviour in noetl/ai-meta#138). Coords + airport come from the
            # known-city geo map; outbound defaults forward when undated.
            xf_region = next_state.get("region") if isinstance(next_state.get("region"), dict) else {}
            xf_geo = _city_geo(xf_region)
            xf_party = next_state.get("party") if isinstance(next_state.get("party"), dict) else {}
            xf_out_date = next_state.get("check_in_date") or (date.today() + timedelta(days=30)).isoformat()
            xf_to_code = f"{xf_geo.get('lat')},{xf_geo.get('lng')}" if xf_geo.get("lat") is not None else ""
            tool_requests.append({
                "tool": "mcp/hotelbeds-transfers.search_transfers",
                "arguments": {
                    "from_type": "IATA",
                    "from_code": xf_geo.get("airport") or (xf_region.get("city_code") or "").upper(),
                    "to_type": "GPS",
                    "to_code": xf_to_code,
                    "outbound": f"{xf_out_date}T10:00:00",
                    "adults": int(xf_party.get("adults") or 1),
                    "children": len(xf_party.get("children") or []),
                    "language": "en",
                },
            })
            render_intent = {"kind": "show_transfers"}
        elif wants_activities and region_ready:
            # HotelBeds Activities availability. Destination filter reuses the
            # city_code the planner already extracts; from/to default forward
            # when the user hasn't pinned travel dates yet.
            act_region = next_state.get("region") if isinstance(next_state.get("region"), dict) else {}
            act_from = next_state.get("check_in_date") or (date.today() + timedelta(days=30)).isoformat()
            try:
                act_to = next_state.get("check_out_date") or (date.fromisoformat(act_from) + timedelta(days=4)).isoformat()
            except Exception:
                act_to = (date.today() + timedelta(days=34)).isoformat()
            act_party = next_state.get("party") if isinstance(next_state.get("party"), dict) else {}
            tool_requests.append({
                "tool": "mcp/hotelbeds-activities.search_activities",
                "arguments": {
                    "destination": (act_region.get("city_code") or "").upper(),
                    "from": act_from,
                    "to": act_to,
                    "adults": int(act_party.get("adults") or 1),
                    "language": "en",
                },
            })
            render_intent = {"kind": "show_activities"}
        elif wants_flight and region_ready:
            # Duffel flight search on explicit intent ("flights from NYC to
            # Paris"). Origin / destination come from the parsed route; dates
            # default forward and party defaults to one adult so a direct
            # request reaches Duffel in one turn (follow-ups only when the
            # destination is truly absent — handled by the collect_missing
            # path when region_ready is False). This branch sits above the
            # places default so an explicit flight ask is never shown places.
            fl_region = next_state.get("region") if isinstance(next_state.get("region"), dict) else {}
            fl_party = next_state.get("party") if isinstance(next_state.get("party"), dict) else {}
            fl_departure = next_state.get("check_in_date") or (date.today() + timedelta(days=30)).isoformat()
            fl_destination = next_state.get("flight_destination") or fl_region.get("city_code") or "PAR"
            fl_origin = next_state.get("flight_origin") or "NYC"
            tool_requests.append({
                "tool": "mcp/duffel.search_offers",
                "arguments": {
                    "origin": fl_origin,
                    "destination": fl_destination,
                    "departure_date": fl_departure,
                    "adults": int(fl_party.get("adults") or 1),
                    "cabin_class": "economy",
                },
            })
            render_intent = {"kind": "show_flights"}
        elif picked_hotel and wants_order and picked_hotel_rate_key and not next_state.get("hotel_booking_ref"):
            # noetl/ai-meta#162 — hotel booking, mirroring the Duffel
            # create_order branch. The rate_key captured at search time drives
            # mcp/hotelbeds.book_hotel (checkRate→bookings, TEST/SANDBOX only).
            # Positioned above the places + guided-flow-flights branches so a
            # Book click on a hotel-only thread books instead of re-searching.
            hb_party = next_state.get("party") if isinstance(next_state.get("party"), dict) else {}
            tool_requests.append({
                "tool": "mcp/hotelbeds.book_hotel",
                "arguments": {
                    "rate_key": picked_hotel_rate_key,
                    "holder_name": "Alex",
                    "holder_surname": "Traveler",
                    "rooms": int(hb_party.get("rooms") or 1),
                    "adults": int(hb_party.get("adults") or 1),
                    "children": len(hb_party.get("children") or []),
                },
            })
            render_intent = {"kind": "hotel_confirmation"}
        elif wants_calendar:
            render_intent = {"kind": "calendar_live"}
        elif region_ready and ("places_seen" not in next_state or region_restated):
            # Fire on first sight of a region (no places_seen yet), and again
            # whenever the user restates/changes the destination in a
            # user_message (region_restated, which already cleared places_seen
            # above so this is the new city's lookup, not a stale repeat).
            tool_requests.append({
                "tool": "mcp/google-places.search_text",
                "arguments": {"query": next_state["region"].get("label", ""), "max_results": 5},
            })
            render_intent = {"kind": "show_places"}
        elif region_ready and dates_ready and party_ready and not next_state.get("flight_search_results"):
            # Guided-flow flights: all core slots are filled (region, dates,
            # party) and no offers yet. Honor a previously-parsed origin /
            # destination when present, else fall back to the home-metro
            # default (SFO) and the region city code.
            tool_requests.append({
                "tool": "mcp/duffel.search_offers",
                "arguments": {
                    "origin": next_state.get("flight_origin") or "SFO",
                    "destination": next_state.get("flight_destination") or next_state["region"].get("city_code") or "MIA",
                    "departure_date": next_state.get("check_in_date"),
                    "adults": next_state.get("party", {}).get("adults", 1),
                    "cabin_class": "economy",
                },
            })
            render_intent = {"kind": "show_flights"}
        elif picked_flight and view_flight_now:
            render_intent = {"kind": "flight_detail"}
        elif picked_flight and view_order_now and next_state.get("order_id"):
            render_intent = {"kind": "order_detail"}
        elif picked_flight and wants_order and not next_state.get("order_id"):
            tool_requests.append({
                "tool": "mcp/duffel.create_order",
                "arguments": {
                    "offer_id": next_state.get("picked_flight_offer_id"),
                    "passengers": _test_passengers(next_state.get("party")),
                    "duffel_env": "test",
                },
            })
            render_intent = {"kind": "order_confirmation"}
        elif picked_flight and next_state.get("order_id") and not next_state.get("hotel_search_results"):
            # noetl/ai-meta#165 — guided booking sequence. Once the flight is
            # booked, walk the user through the remaining stages (hotels →
            # activities → transfers → summary) instead of dead-ending on the
            # summary after flights. Each stage fires its search once (guarded
            # by the stage's *_search_results marker), so the next tap advances
            # to the following stage; the summary is reached only after
            # transfers. Explicit asks ("hotels", "activities", …) are handled
            # by the wants_* branches above and still work at any point.
            hp = next_state.get("party") if isinstance(next_state.get("party"), dict) else {}
            g_check_in = next_state.get("check_in_date") or (date.today() + timedelta(days=30)).isoformat()
            try:
                g_check_out = next_state.get("check_out_date") or (date.fromisoformat(g_check_in) + timedelta(days=4)).isoformat()
            except Exception:
                g_check_out = (date.today() + timedelta(days=34)).isoformat()
            g_region = next_state.get("region") if isinstance(next_state.get("region"), dict) else {}
            tool_requests.append({
                "tool": "mcp/hotelbeds.search_hotels",
                "arguments": {
                    "city": g_region.get("label", ""),
                    "city_code": g_region.get("city_code", ""),
                    "check_in": g_check_in,
                    "check_out": g_check_out,
                    "adults": int(hp.get("adults") or 1),
                    "rooms": int(hp.get("rooms") or 1),
                    "children": len(hp.get("children") or []),
                    "radius": 20,
                },
            })
            render_intent = {"kind": "show_hotels"}
        elif picked_flight and next_state.get("hotel_search_results") and not next_state.get("activity_search_results"):
            ap = next_state.get("party") if isinstance(next_state.get("party"), dict) else {}
            a_region = next_state.get("region") if isinstance(next_state.get("region"), dict) else {}
            a_from = next_state.get("check_in_date") or (date.today() + timedelta(days=30)).isoformat()
            try:
                a_to = next_state.get("check_out_date") or (date.fromisoformat(a_from) + timedelta(days=4)).isoformat()
            except Exception:
                a_to = (date.today() + timedelta(days=34)).isoformat()
            tool_requests.append({
                "tool": "mcp/hotelbeds-activities.search_activities",
                "arguments": {
                    "destination": (a_region.get("city_code") or "").upper(),
                    "from": a_from,
                    "to": a_to,
                    "adults": int(ap.get("adults") or 1),
                    "language": "en",
                },
            })
            render_intent = {"kind": "show_activities"}
        elif picked_flight and next_state.get("activity_search_results") and not next_state.get("transfer_search_results"):
            xp = next_state.get("party") if isinstance(next_state.get("party"), dict) else {}
            x_region = next_state.get("region") if isinstance(next_state.get("region"), dict) else {}
            x_geo = _city_geo(x_region)
            x_out_date = next_state.get("check_in_date") or (date.today() + timedelta(days=30)).isoformat()
            x_to_code = f"{x_geo.get('lat')},{x_geo.get('lng')}" if x_geo.get("lat") is not None else ""
            tool_requests.append({
                "tool": "mcp/hotelbeds-transfers.search_transfers",
                "arguments": {
                    "from_type": "IATA",
                    "from_code": x_geo.get("airport") or (x_region.get("city_code") or "").upper(),
                    "to_type": "GPS",
                    "to_code": x_to_code,
                    "outbound": f"{x_out_date}T10:00:00",
                    "adults": int(xp.get("adults") or 1),
                    "children": len(xp.get("children") or []),
                    "language": "en",
                },
            })
            render_intent = {"kind": "show_transfers"}
        elif picked_flight:
            # All guided stages have been offered (or skipped) — show the real
            # itinerary summary. The summary's Confirm CTA finalizes the trip
            # (trip_confirmed → trip_map above).
            render_intent = {"kind": "summary"}
        elif next_state.get("pending_calendar_events"):
            render_intent = {"kind": "calendar_live"}

        # Defense: if no branch above fired but all core slots are present,
        # "collect_missing" with an empty missing list is contradictory.
        # A fully-populated thread whose user sent a restatement (e.g.
        # "trip to paris") hits this path when flight/hotel results already
        # exist but none of the action branches matched.  Emit "summarize"
        # so render_widget_chat selects itinerary_summary instead of bot_text.
        if (
            render_intent.get("kind") == "collect_missing"
            and not render_intent.get("missing")
            and region_ready and dates_ready and party_ready
        ):
            render_intent = {"kind": "summarize"}

        first_tool = tool_requests[0] if tool_requests else {}
        call_id = f"call_{uuid.uuid4().hex[:12]}"
        llm_contract = {
            "provider": ai_provider,
            "model": llm_extraction_model,
            "temperature": 0,
            "response_format": "json_object",
            "fallback_used": True,
        }
        turn_events = [
            {"thread_path": thread_path, "event": input_event},
            {
                "thread_path": thread_path,
                "event": {
                    "type": "agent_slot_update",
                    "payload": {
                        "changes": updates,
                        "slot_state": next_state,
                        "llm_contract": llm_contract,
                    },
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            },
        ]
        if first_tool.get("tool"):
            turn_events.append({
                "thread_path": thread_path,
                "event": {
                    "type": "agent_tool_call",
                    "payload": {
                        "call_id": call_id,
                        "tool": first_tool.get("tool", ""),
                        "arguments": first_tool.get("arguments", {}),
                    },
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            })

        result = {
            "thread_path": thread_path,
            "slot_updates": updates,
            "slot_state": next_state,
            "captured_changes": updates,
            "captured_slots": next_state,
            "tool_requests": tool_requests,
            "first_tool": first_tool.get("tool", ""),
            "first_tool_arguments": first_tool.get("arguments", {}),
            "render_intent": render_intent,
            "llm_contract": llm_contract,
            "call_id": call_id,
            "turn_docs": [{
                "path": f"{thread_path}/slot_state/current",
                "doc": next_state,
                "merge": False,
            }],
            "turn_events": turn_events,
            "json_str": json.dumps({"slot_updates": updates, "tool_requests": tool_requests, "render_intent": render_intent}, separators=(",", ":")),
        }
        globals().update({"result": result})
    next:
      # FIX B (noetl/ai-meta latency): the turn-doc + turn-event firestore writes
      # are deferred to a single terminal `persist_all_atomically` step after
      # render — extract_turn now routes straight to tool dispatch, removing two
      # fire-and-forget firestore child hops from the critical path. Nothing
      # between extract_turn and final_result reads the persisted turn docs back
      # (the old persist/append steps had no return_result and fed no downstream
      # step), so deferring the write to the end is output-equivalent.
      spec: { mode: exclusive }
      arcs:
        - step: call_google_places
          when: "{{ extract_turn.first_tool == 'mcp/google-places.search_text' }}"
        - step: call_duffel_offers
          when: "{{ extract_turn.first_tool == 'mcp/duffel.search_offers' }}"
        - step: call_duffel_create_order
          when: "{{ extract_turn.first_tool == 'mcp/duffel.create_order' }}"
        - step: call_hotelbeds_hotels
          when: "{{ extract_turn.first_tool == 'mcp/hotelbeds.search_hotels' }}"
        - step: call_hotelbeds_book
          when: "{{ extract_turn.first_tool == 'mcp/hotelbeds.book_hotel' }}"
        - step: call_hotelbeds_activities
          when: "{{ extract_turn.first_tool == 'mcp/hotelbeds-activities.search_activities' }}"
        - step: call_hotelbeds_transfers
          when: "{{ extract_turn.first_tool == 'mcp/hotelbeds-transfers.search_transfers' }}"
        - step: skip_tool_dispatch
          when: "{{ extract_turn.first_tool == '' }}"

  - step: call_google_places
    desc: Dispatch a Google Places text search through the MCP playbook
    tool:
      kind: python
      input:
        method: "tools/call"
        tool: "search_text"
        arguments: "{{ extract_turn.first_tool_arguments }}"
        google_project: "noetl-demo-19700101"
        widget_key_secret: "google-maps-widget-key"
        max_enrichments: 10
      code: |
        import base64
        import json
        import time
        import urllib.error
        import urllib.parse
        import urllib.request

        SCOPE = "https://www.googleapis.com/auth/cloud-platform"
        METADATA_TOKEN_URL = (
            "http://metadata.google.internal/computeMetadata/v1/"
            "instance/service-accounts/default/token"
        )
        PLACES_SEARCH_TEXT = "https://places.googleapis.com/v1/places:searchText"
        PLACES_SEARCH_NEARBY = "https://places.googleapis.com/v1/places:searchNearby"
        DETAILS_FIELDS = ",".join([
            "id",
            "displayName",
            "formattedAddress",
            "location",
            "rating",
            "userRatingCount",
            "types",
            "photos",
            "regularOpeningHours",
            "editorialSummary",
        ])
        SEARCH_FIELDS = ",".join([
            "places.id",
            "places.displayName",
            "places.formattedAddress",
            "places.location",
            "places.rating",
            "places.userRatingCount",
            "places.types",
            "places.photos",
            "places.regularOpeningHours",
            "places.editorialSummary",
        ])

        def _as_dict(value):
            return value if isinstance(value, dict) else {}

        def _as_list(value):
            return value if isinstance(value, list) else []

        def _cap(value, default=10):
            try:
                parsed = int(value)
            except (TypeError, ValueError):
                parsed = default
            return max(1, min(parsed, 10))

        def _error(tool_name, message, detail=None, status_code=0):
            text = message if detail is None else f"{message}: {str(detail)[:500]}"
            return {
                "status": "error",
                "content": [{"type": "text", "text": text}],
                "isError": True,
                "_meta": {"backend": "google-places", "tool": tool_name, "status_code": status_code, "error": text[:2000]},
                "data": {"ok": False, "error": text[:2000], "items": []},
                "control_data": {"ok": False, "error": text[:2000], "items": []},
                "summary": text,
                "text": text,
            }

        def _ok(tool_name, data, text=None, meta=None):
            meta = meta if isinstance(meta, dict) else {}
            payload = data if isinstance(data, dict) else {"value": data}
            payload.setdefault("ok", True)
            return {
                "status": "ok",
                "content": [{"type": "text", "text": text or f"google-places {tool_name} ok"}],
                "isError": False,
                "_meta": {"backend": "google-places", "tool": tool_name, **meta},
                "data": payload,
                "control_data": payload,
                "summary": text or f"google-places {tool_name} ok",
                "text": text or f"google-places {tool_name} ok",
            }

        def _token():
            # Mint an OAuth2 access token from the GKE metadata server using the
            # worker pod's Workload Identity. No google-auth library: the metadata
            # endpoint is exactly what google.auth.default() reads under the hood on
            # GKE, so a direct urllib GET is the library-free equivalent and removes
            # the `ModuleNotFoundError: No module named 'google'` failure (noetl/ai-meta#137).
            # The token carries the bound service account's cloud-platform scope, which
            # is what the Places API (New) accepts as a bearer for backend search calls.
            req = urllib.request.Request(
                METADATA_TOKEN_URL,
                headers={"Metadata-Flavor": "Google"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=10) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    "metadata token mint failed HTTP "
                    f"{exc.code}: Workload Identity is not bound to a GCP service "
                    f"account with Places access for this worker pod ({body})"
                )
            except urllib.error.URLError as exc:
                raise RuntimeError(
                    "metadata server unreachable "
                    f"({getattr(exc, 'reason', exc)}): the worker pod has no GKE "
                    "Workload Identity metadata endpoint (expected off-cluster, e.g. kind)"
                )
            token = (payload or {}).get("access_token") if isinstance(payload, dict) else None
            if not token:
                raise RuntimeError("metadata token endpoint returned no access_token")
            return token

        def _post_google(url, payload, field_mask, project):
            req = urllib.request.Request(
                url,
                data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                headers={
                    "Authorization": f"Bearer {_token()}",
                    "X-Goog-User-Project": project,
                    "X-Goog-FieldMask": field_mask,
                    "Content-Type": "application/json",
                },
                method="POST",
            )
            try:
                with urllib.request.urlopen(req, timeout=20) as resp:
                    return resp.status, json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")
                try:
                    parsed = json.loads(body)
                except Exception:
                    parsed = {"raw": body[:2000]}
                return exc.code, parsed

        def _get_google(url, field_mask, project):
            req = urllib.request.Request(
                url,
                headers={
                    "Authorization": f"Bearer {_token()}",
                    "X-Goog-User-Project": project,
                    "X-Goog-FieldMask": field_mask,
                },
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=20) as resp:
                    return resp.status, json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")
                try:
                    parsed = json.loads(body)
                except Exception:
                    parsed = {"raw": body[:2000]}
                return exc.code, parsed

        def _secret_value(project, secret_name):
            token = _token()
            name = f"projects/{project}/secrets/{secret_name}/versions/latest:access"
            req = urllib.request.Request(
                f"https://secretmanager.googleapis.com/v1/{name}",
                headers={"Authorization": f"Bearer {token}"},
                method="GET",
            )
            with urllib.request.urlopen(req, timeout=15) as resp:
                payload = json.loads(resp.read().decode("utf-8"))
            encoded = ((payload.get("payload") or {}).get("data") or "").strip()
            if not encoded:
                return ""
            return base64.b64decode(encoded).decode("utf-8").strip()

        def _display_name(place):
            display = place.get("displayName") if isinstance(place, dict) else {}
            if isinstance(display, dict):
                return display.get("text") or ""
            return str(display or "")

        def _photo_name(place):
            photos = place.get("photos") if isinstance(place, dict) else []
            if isinstance(photos, list) and photos and isinstance(photos[0], dict):
                return photos[0].get("name") or ""
            return ""

        def _static_map_url(lat, lng, key, label=""):
            # `key` is optional: when empty the URL is keyless. Widget-bound
            # image URLs (see _google_summary) are deliberately built keyless so
            # the server's `google-maps-widget-key` secret never rides the
            # delivered payload — the response-boundary scrubber would mask a
            # keyed URL to "[REDACTED]", which is not a valid `uri` and breaks
            # the place_card render. The browser supplies its own restricted
            # `VITE_GOOGLE_MAPS_KEY` at <img> time.
            if lat is None or lng is None:
                return None
            center = urllib.parse.quote(f"{lat},{lng}", safe="")
            marker_label = urllib.parse.quote(str(label or "")[:12], safe="")
            url = (
                "https://maps.googleapis.com/maps/api/staticmap"
                f"?center={center}&zoom=13&size=400x260&scale=2"
                f"&markers=color:red%7Clabel:{marker_label}%7C{center}"
            )
            if key:
                url += f"&key={urllib.parse.quote(key, safe='')}"
            return url

        def _place_photo_url(photo_resource, key, max_width=400):
            # `key` optional — keyless when empty (see _static_map_url rationale).
            if not photo_resource:
                return None
            resource = str(photo_resource).strip().lstrip("/")
            url = f"https://places.googleapis.com/v1/{resource}/media?maxWidthPx={int(max_width)}"
            if key:
                url += f"&key={urllib.parse.quote(key, safe='')}"
            return url

        def _lat_lng_from_item(item):
            geo = item.get("geoCode") if isinstance(item, dict) else {}
            if not isinstance(geo, dict):
                geo = item.get("location") if isinstance(item, dict) and isinstance(item.get("location"), dict) else {}
            lat = geo.get("latitude") if isinstance(geo, dict) else None
            lng = geo.get("longitude") if isinstance(geo, dict) else None
            if lat is None:
                lat = geo.get("lat") if isinstance(geo, dict) else None
            if lng is None:
                lng = geo.get("lng") if isinstance(geo, dict) else None
            return lat, lng

        def _query_for_item(item, intent, fallback_query):
            if not isinstance(item, dict):
                return str(fallback_query or "")
            parts = []
            name = item.get("name") or item.get("iataCode") or item.get("hotelId") or item.get("id")
            if name:
                parts.append(str(name))
            address = item.get("address") if isinstance(item.get("address"), dict) else {}
            for key in ("cityName", "countryName"):
                if address.get(key):
                    parts.append(str(address[key]))
            if item.get("iataCode") and intent in ("locations", "hotels"):
                parts.append(str(item["iataCode"]))
            if not parts:
                parts.append(str(fallback_query or "travel"))
            if intent == "hotels":
                parts.append("hotel")
            elif intent == "activities":
                parts.append("attraction")
            return " ".join(parts)

        def _valid_widget_uri(url):
            # Widget photos are schema-validated as `format: uri` on the client;
            # only emit a syntactically valid absolute http(s) URL, else "" so
            # the place_card simply renders without a photo (never a broken/
            # invalid-URI token that fails the whole widget).
            if not isinstance(url, str) or not url:
                return ""
            try:
                parts = urllib.parse.urlsplit(url)
            except Exception:
                return ""
            return url if parts.scheme in ("http", "https") and parts.netloc else ""

        def _google_summary(place, widget_key):
            loc = place.get("location") if isinstance(place.get("location"), dict) else {}
            lat = loc.get("latitude")
            lng = loc.get("longitude")
            photo_resource = _photo_name(place)
            # Prefer the place's actual Google Places photo; fall back to a
            # static map only when the place has no photo (e.g. a locality /
            # region anchor). Keyless (widget_key intentionally NOT embedded) —
            # the browser adds its own VITE_GOOGLE_MAPS_KEY; a server-keyed URL
            # would be scrubbed to "[REDACTED]" and fail the place_card `uri`
            # contract.
            image_url = _valid_widget_uri(
                _place_photo_url(photo_resource, "")
                or _static_map_url(lat, lng, "", _display_name(place))
            )
            opening = place.get("regularOpeningHours") if isinstance(place.get("regularOpeningHours"), dict) else {}
            editorial = place.get("editorialSummary") if isinstance(place.get("editorialSummary"), dict) else {}
            return {
                "place_id": place.get("id"),
                "name": _display_name(place),
                "address": place.get("formattedAddress"),
                "rating": place.get("rating"),
                "user_rating_count": place.get("userRatingCount"),
                "types": place.get("types") if isinstance(place.get("types"), list) else [],
                "open_now": opening.get("openNow"),
                "summary": editorial.get("text"),
                "photo_resource": photo_resource,
                "image_url": image_url,
                "maps_static_url": _valid_widget_uri(_static_map_url(lat, lng, "", _display_name(place))),
            }

        def _enrich_items(args, project, widget_key, limit):
            intent = str(args.get("intent") or "").strip().lower()
            fallback_query = args.get("query") or ""
            source_items = _as_list(args.get("items"))[:limit]
            enriched = []
            calls = 0
            errors = []
            for item in source_items:
                if not isinstance(item, dict):
                    continue
                query = _query_for_item(item, intent, fallback_query)
                payload = {"textQuery": query, "maxResultCount": 1}
                lat, lng = _lat_lng_from_item(item)
                if lat is not None and lng is not None:
                    try:
                        payload["locationBias"] = {
                            "circle": {
                                "center": {"latitude": float(lat), "longitude": float(lng)},
                                "radius": 5000.0,
                            }
                        }
                    except Exception:
                        pass
                status, body = _post_google(PLACES_SEARCH_TEXT, payload, SEARCH_FIELDS, project)
                calls += 1
                merged = dict(item)
                if status == 200 and isinstance(body.get("places"), list) and body["places"]:
                    merged["_google"] = _google_summary(body["places"][0], widget_key)
                else:
                    errors.append({"query": query, "status_code": status, "body": body})
                enriched.append(merged)
            return {
                "ok": True,
                "items": enriched,
                "enriched_count": sum(1 for item in enriched if isinstance(item.get("_google"), dict)),
                "calls_made": calls,
                "errors": errors[:5],
            }

        def _search_text(args, project, widget_key, limit):
            if isinstance(args.get("items"), list):
                return _ok("search_text", _enrich_items(args, project, widget_key, limit), "google-places enriched items")
            query = str(args.get("query") or args.get("textQuery") or "").strip()
            if not query:
                return _error("search_text", "query is required")
            payload = {"textQuery": query, "maxResultCount": min(int(args.get("maxResultCount") or limit), limit)}
            lat = args.get("lat")
            lng = args.get("lng")
            radius = float(args.get("radius") or 5000)
            if lat is not None and lng is not None:
                payload["locationBias"] = {"circle": {"center": {"latitude": float(lat), "longitude": float(lng)}, "radius": radius}}
            status, body = _post_google(PLACES_SEARCH_TEXT, payload, SEARCH_FIELDS, project)
            if status != 200:
                return _error("search_text", f"Places searchText failed HTTP {status}", body, status)
            places = body.get("places") if isinstance(body.get("places"), list) else []
            items = [{**place, "_google": _google_summary(place, widget_key)} for place in places[:limit]]
            return _ok("search_text", {"items": items, "calls_made": 1, "enriched_count": len(items)}, f"{len(items)} Google place(s)")

        def _nearby_search(args, project, widget_key, limit):
            try:
                lat = float(args.get("lat") if args.get("lat") is not None else args.get("latitude"))
                lng = float(args.get("lng") if args.get("lng") is not None else args.get("longitude"))
            except Exception:
                return _error("nearby_search", "lat/lng are required")
            included_type = args.get("type")
            payload = {
                "maxResultCount": min(int(args.get("maxResultCount") or limit), limit),
                "locationRestriction": {"circle": {"center": {"latitude": lat, "longitude": lng}, "radius": float(args.get("radius") or 5000)}},
            }
            if included_type:
                payload["includedTypes"] = [str(included_type)]
            status, body = _post_google(PLACES_SEARCH_NEARBY, payload, SEARCH_FIELDS, project)
            if status != 200:
                return _error("nearby_search", f"Places nearbySearch failed HTTP {status}", body, status)
            places = body.get("places") if isinstance(body.get("places"), list) else []
            items = [{**place, "_google": _google_summary(place, widget_key)} for place in places[:limit]]
            return _ok("nearby_search", {"items": items, "calls_made": 1, "enriched_count": len(items)}, f"{len(items)} nearby Google place(s)")

        def _place_details(args, project, widget_key, limit):
            raw_ids = args.get("place_ids") or args.get("placeIds") or args.get("place_id") or args.get("placeId")
            ids = raw_ids if isinstance(raw_ids, list) else [raw_ids]
            ids = [str(value).strip() for value in ids if str(value or "").strip()][:limit]
            if not ids:
                return _error("place_details", "place_id or place_ids is required")
            details = []
            errors = []
            for place_id in ids:
                url = "https://places.googleapis.com/v1/places/" + urllib.parse.quote(place_id, safe="")
                status, body = _get_google(url, DETAILS_FIELDS, project)
                if status == 200:
                    details.append({**body, "_google": _google_summary(body, widget_key)})
                else:
                    errors.append({"place_id": place_id, "status_code": status, "body": body})
            return _ok("place_details", {"items": details, "errors": errors[:5], "calls_made": len(ids), "enriched_count": len(details)}, f"{len(details)} place detail(s)")

        def _static_map(args, project, widget_key):
            lat = args.get("lat") if args.get("lat") is not None else args.get("latitude")
            lng = args.get("lng") if args.get("lng") is not None else args.get("longitude")
            url = _static_map_url(lat, lng, widget_key, args.get("label") or "")
            return _ok("static_map_url", {"url": url, "calls_made": 0}, "static map URL built")

        def _place_photo(args, project, widget_key):
            resource = args.get("photo_resource") or args.get("photoResource") or args.get("name")
            width = args.get("maxWidthPx") or args.get("max_width") or 400
            url = _place_photo_url(resource, widget_key, int(width))
            return _ok("place_photo_url", {"url": url, "calls_made": 0}, "place photo URL built")

        globals().update({
            "base64": base64,
            "json": json,
            "time": time,
            "urllib": urllib,
            "SCOPE": SCOPE,
            "METADATA_TOKEN_URL": METADATA_TOKEN_URL,
            "PLACES_SEARCH_TEXT": PLACES_SEARCH_TEXT,
            "PLACES_SEARCH_NEARBY": PLACES_SEARCH_NEARBY,
            "DETAILS_FIELDS": DETAILS_FIELDS,
            "SEARCH_FIELDS": SEARCH_FIELDS,
            "_as_dict": _as_dict,
            "_as_list": _as_list,
            "_cap": _cap,
            "_error": _error,
            "_ok": _ok,
            "_token": _token,
            "_post_google": _post_google,
            "_get_google": _get_google,
            "_secret_value": _secret_value,
            "_display_name": _display_name,
            "_photo_name": _photo_name,
            "_static_map_url": _static_map_url,
            "_place_photo_url": _place_photo_url,
            "_lat_lng_from_item": _lat_lng_from_item,
            "_query_for_item": _query_for_item,
            "_google_summary": _google_summary,
            "_enrich_items": _enrich_items,
            "_search_text": _search_text,
            "_nearby_search": _nearby_search,
            "_place_details": _place_details,
            "_static_map": _static_map,
            "_place_photo": _place_photo,
        })

        tools = [
            {"name": "search_text", "title": "Search Google Places by text", "description": "Text search, or batch-enrich up to 10 supplied travel items.", "inputSchema": {"type": "object", "properties": {"query": {"type": "string"}, "items": {"type": "array"}, "intent": {"type": "string"}}}},
            {"name": "place_details", "title": "Google Place Details", "description": "Fetch details for one place_id or up to 10 place_ids.", "inputSchema": {"type": "object", "properties": {"place_id": {"type": "string"}, "place_ids": {"type": "array"}}}},
            {"name": "nearby_search", "title": "Search nearby Google Places", "description": "Nearby search by latitude/longitude.", "inputSchema": {"type": "object", "required": ["lat", "lng"], "properties": {"lat": {"type": "number"}, "lng": {"type": "number"}, "radius": {"type": "number"}, "type": {"type": "string"}}}},
            {"name": "static_map_url", "title": "Build Maps Static URL", "description": "Builds a browser-fetchable Maps Static URL using the restricted widget key.", "inputSchema": {"type": "object", "required": ["lat", "lng"], "properties": {"lat": {"type": "number"}, "lng": {"type": "number"}, "label": {"type": "string"}}}},
            {"name": "place_photo_url", "title": "Build Place Photo URL", "description": "Builds a browser-fetchable Place Photo media URL using the restricted widget key.", "inputSchema": {"type": "object", "required": ["photo_resource"], "properties": {"photo_resource": {"type": "string"}, "maxWidthPx": {"type": "integer"}}}},
        ]

        selected_method = str(method or "tools/list").strip().lower()
        selected_tool = str(tool or "").strip()
        args = _as_dict(arguments)
        project = str(args.get("google_project") or google_project or "noetl-demo-19700101").strip()
        secret_name = str(args.get("widget_key_secret") or widget_key_secret or "google-maps-widget-key").strip()
        limit = _cap(args.get("max_enrichments") or max_enrichments)

        if selected_method == "tools/list":
            result = _ok("tools/list", {"tools": tools}, "Google Places MCP — 5 tools available", {"tool_count": len(tools)})
        elif selected_method != "tools/call":
            result = _error("unknown_method", f"Unsupported method {selected_method!r}")
        elif selected_tool not in {tool_def["name"] for tool_def in tools}:
            result = _error("unknown_tool", f"Unsupported tool {selected_tool!r}")
        else:
            widget_key = ""
            try:
                widget_key = _secret_value(project, secret_name)
            except Exception as exc:
                # Backend enrichment still works without photos. URL builders
                # return null rather than failing the caller.
                if selected_tool in ("static_map_url", "place_photo_url"):
                    result = _ok(selected_tool, {"url": None, "calls_made": 0, "widget_key_error": f"{type(exc).__name__}: {exc}"}, f"{selected_tool} unavailable: widget key unreadable")
                else:
                    widget_key = ""
            if "result" not in locals():
                try:
                    if selected_tool == "search_text":
                        result = _search_text(args, project, widget_key, limit)
                    elif selected_tool == "nearby_search":
                        result = _nearby_search(args, project, widget_key, limit)
                    elif selected_tool == "place_details":
                        result = _place_details(args, project, widget_key, limit)
                    elif selected_tool == "static_map_url":
                        result = _static_map(args, project, widget_key)
                    elif selected_tool == "place_photo_url":
                        result = _place_photo(args, project, widget_key)
                except Exception as exc:
                    result = _error(selected_tool, "Google Places tool failed", f"{type(exc).__name__}: {exc}")
    next:
      spec: { mode: exclusive }
      arcs:
        - step: normalize_tool_response

  - step: call_duffel_offers
    desc: Dispatch Duffel test-environment flight offers search
    tool:
      kind: python
      input:
        method: "tools/call"
        tool: "search_offers"
        arguments: "{{ extract_turn.first_tool_arguments }}"
        duffel_env: "test"
        duffel_api_base: "https://api.duffel.com"
        duffel_api_version: "v2"
        google_project: "noetl-demo-19700101"
        duffel_secret_name: "duffel-api-test"
      code: |
        import base64
        import json
        from datetime import datetime, timezone
        import urllib.error
        import urllib.parse
        import urllib.request

        METADATA_TOKEN_URL = (
            "http://metadata.google.internal/computeMetadata/v1/"
            "instance/service-accounts/default/token"
        )

        def _metadata_token():
            # Mint an OAuth2 access token from the GKE metadata server using the
            # worker pod's Workload Identity. No google-auth library: this is the
            # same endpoint google.auth.default() reads under the hood on GKE, so a
            # direct urllib GET is the library-free equivalent (noetl/ai-meta#137).
            req = urllib.request.Request(
                METADATA_TOKEN_URL,
                headers={"Metadata-Flavor": "Google"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=10) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    "metadata token mint failed HTTP "
                    f"{exc.code}: Workload Identity is not bound to a GCP service "
                    f"account with Secret Manager access for this worker pod ({body})"
                )
            except urllib.error.URLError as exc:
                raise RuntimeError(
                    "metadata server unreachable "
                    f"({getattr(exc, 'reason', exc)}): the worker pod has no GKE "
                    "Workload Identity metadata endpoint (expected off-cluster, e.g. kind)"
                )
            token = (payload or {}).get("access_token") if isinstance(payload, dict) else None
            if not token:
                raise RuntimeError("metadata token endpoint returned no access_token")
            return token

        def _extract_token(raw):
            # The GSM secret `duffel-api-test` holds the full Duffel credential
            # file ({"data":{"token":…}}); tolerate a bare {"token":…} object or
            # a raw token string too, so a future `gcloud secrets versions add`
            # in any of those shapes keeps resolving without a playbook edit.
            # Never logged/printed.
            s = "" if raw is None else str(raw).strip()
            if s.startswith("{"):
                try:
                    obj = json.loads(s)
                except Exception:
                    return s
                if isinstance(obj, dict):
                    data = obj.get("data")
                    if isinstance(data, dict) and data.get("token"):
                        return str(data.get("token")).strip()
                    if obj.get("token"):
                        return str(obj.get("token")).strip()
                return s
            return s

        def _secret_bearer(project, secret_name):
            # Read the GSM secret value (the full Duffel credential file JSON)
            # using the WI metadata token and collapse it to the bare bearer.
            # Raises with a credential/permission-flavoured message so the
            # failure mode is unambiguous on kind / pre-grant prod.
            token = _metadata_token()
            name = f"projects/{project}/secrets/{secret_name}/versions/latest:access"
            req = urllib.request.Request(
                f"https://secretmanager.googleapis.com/v1/{name}",
                headers={"Authorization": f"Bearer {token}"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=15) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    f"secret manager access HTTP {exc.code} for '{secret_name}': the "
                    f"worker GSA lacks secretmanager.secretAccessor on this secret, or "
                    f"the secret is not loaded yet ({body})"
                )
            encoded = ((payload.get("payload") or {}).get("data") or "").strip()
            if not encoded:
                raise RuntimeError(f"secret '{secret_name}' has no payload data")
            raw = base64.b64decode(encoded).decode("utf-8").strip()
            bearer = _extract_token(raw)
            if not bearer:
                raise RuntimeError(f"secret '{secret_name}' payload had no Duffel token (.data.token)")
            return bearer

        def _as_dict(value):
            return value if isinstance(value, dict) else {}

        def _as_list(value):
            return value if isinstance(value, list) else []

        def _cap(value, default=10, maximum=10):
            try:
                parsed = int(value)
            except (TypeError, ValueError):
                parsed = default
            return max(1, min(parsed, maximum))

        def _text(value, default=""):
            value = default if value is None else value
            return str(value).strip()

        def _error(tool_name, message, detail=None, status_code=0, code=None):
            text = message if detail is None else f"{message}: {str(detail)[:700]}"
            payload = {"ok": False, "status": "error", "error": text[:2000], "status_code": status_code}
            if code:
                payload["code"] = code
            return {
                # Keep the NoETL step green; MCP clients read isError plus
                # control_data.status for the upstream/tool-level error.
                "status": "ok",
                "content": [{"type": "text", "text": text}],
                "isError": True,
                "_meta": {"backend": "duffel", "tool": tool_name, "duffel_env": duffel_env, "status_code": status_code, "error": text[:2000], "code": code},
                "data": payload,
                "control_data": payload,
                "summary": text,
                "text": text,
            }

        def _ok(tool_name, data, text=None, meta=None):
            meta = meta if isinstance(meta, dict) else {}
            payload = data if isinstance(data, dict) else {"value": data}
            payload.setdefault("ok", True)
            return {
                "status": "ok",
                "content": [{"type": "text", "text": text or f"Duffel {tool_name} ok"}],
                "isError": False,
                "_meta": {"backend": "duffel", "tool": tool_name, "duffel_env": duffel_env, **meta},
                "data": payload,
                "control_data": payload,
                "summary": text or f"Duffel {tool_name} ok",
                "text": text or f"Duffel {tool_name} ok",
            }

        def _request(http_method, path, payload=None, params=None):
            base = _text(duffel_api_base, "https://api.duffel.com").rstrip("/")
            url = base + path
            if params:
                url += "?" + urllib.parse.urlencode(params, doseq=True)
            headers = {
                "Authorization": f"Bearer {duffel_token}",
                "Accept": "application/json",
                "Duffel-Version": _text(duffel_api_version, "v2"),
            }
            body = None
            if payload is not None:
                headers["Content-Type"] = "application/json"
                body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
            req = urllib.request.Request(url, data=body, headers=headers, method=http_method)
            try:
                with urllib.request.urlopen(req, timeout=45) as resp:
                    raw = resp.read().decode("utf-8")
                    parsed = json.loads(raw or "{}")
                    return True, resp.status, parsed
            except urllib.error.HTTPError as exc:
                raw = exc.read().decode("utf-8", errors="replace")
                try:
                    parsed = json.loads(raw or "{}")
                except Exception:
                    parsed = {"raw": raw[:2000]}
                return False, exc.code, parsed
            except urllib.error.URLError as exc:
                return False, 0, {"error": str(getattr(exc, "reason", exc))}
            except Exception as exc:
                return False, 0, {"error": f"{type(exc).__name__}: {exc}"}

        def _duration(value):
            return _text(value, "?") or "?"

        def _iata(place):
            if isinstance(place, dict):
                return place.get("iata_code") or place.get("iataCode") or place.get("id") or "?"
            return "?"

        def _carrier(segment):
            for key in ("marketing_carrier", "operating_carrier"):
                carrier = segment.get(key)
                if isinstance(carrier, dict) and carrier.get("iata_code"):
                    return carrier.get("iata_code")
            return segment.get("marketing_carrier_iata_code") or segment.get("operating_carrier_iata_code") or "?"

        def _normalise_segment(segment):
            origin = segment.get("origin") if isinstance(segment.get("origin"), dict) else {}
            destination = segment.get("destination") if isinstance(segment.get("destination"), dict) else {}
            return {
                "departure": {"iataCode": _iata(origin), "at": segment.get("departing_at") or segment.get("departure_time") or "?"},
                "arrival": {"iataCode": _iata(destination), "at": segment.get("arriving_at") or segment.get("arrival_time") or "?"},
                "carrierCode": _carrier(segment),
                "number": _text(segment.get("marketing_carrier_flight_number") or segment.get("flight_number")),
                "duration": _duration(segment.get("duration")),
                "numberOfStops": 0,
            }

        def _normalise_offer(offer):
            slices = _as_list(offer.get("slices"))
            itineraries = []
            validating = []
            for item in slices:
                segments = [_normalise_segment(seg) for seg in _as_list(item.get("segments")) if isinstance(seg, dict)]
                for seg in segments:
                    code = seg.get("carrierCode")
                    if code and code != "?" and code not in validating:
                        validating.append(code)
                itineraries.append({
                    "duration": _duration(item.get("duration")),
                    "segments": segments,
                })
            return {
                "id": offer.get("id"),
                "source": "duffel",
                "price": {
                    "total": offer.get("total_amount") or offer.get("base_amount") or "?",
                    "currency": offer.get("total_currency") or offer.get("base_currency") or "USD",
                },
                "itineraries": itineraries,
                "validatingAirlineCodes": validating,
                "expires_at": offer.get("expires_at"),
                "live_mode": offer.get("live_mode"),
            }

        def _tools_list():
            tools = [
                {
                    "name": "search_offers",
                    "title": "Search flight offers",
                    "description": "Duffel flight offers search. Required: origin, destination, departure_date. Optional: return_date, adults, cabin_class.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["origin", "destination", "departure_date"],
                        "properties": {
                            "origin": {"type": "string", "description": "IATA airport or city code"},
                            "destination": {"type": "string", "description": "IATA airport or city code"},
                            "departure_date": {"type": "string", "description": "YYYY-MM-DD"},
                            "return_date": {"type": "string", "description": "YYYY-MM-DD"},
                            "adults": {"type": "integer", "minimum": 1, "default": 1},
                            "cabin_class": {"type": "string", "enum": ["economy", "premium_economy", "business", "first"], "default": "economy"},
                        },
                    },
                },
                {
                    "name": "get_offer",
                    "title": "Get offer",
                    "description": "Fetch one Duffel offer by id.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["offer_id"],
                        "properties": {"offer_id": {"type": "string"}},
                    },
                },
                {
                    "name": "search_places",
                    "title": "Search flight places",
                    "description": "Duffel airport/city autocomplete for flight origin and destination fields.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["query"],
                        "properties": {
                            "query": {"type": "string"},
                            "lat": {"type": "number"},
                            "lng": {"type": "number"},
                            "rad": {"type": "integer"},
                        },
                    },
                },
                {
                    "name": "get_airlines",
                    "title": "Get airlines",
                    "description": "Duffel airline reference data, first page only.",
                    "inputSchema": {
                        "type": "object",
                        "properties": {"limit": {"type": "integer", "minimum": 1, "maximum": 200, "default": 200}},
                    },
                },
                {
                    "name": "create_order",
                    "title": "Create test order",
                    "description": "Create a Duffel test-environment order for one selected offer using wallet balance payment.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["offer_id", "passengers"],
                        "properties": {
                            "offer_id": {"type": "string"},
                            "passengers": {
                                "type": "array",
                                "minItems": 1,
                                "items": {
                                    "type": "object",
                                    "required": ["given_name", "family_name", "born_on", "email", "phone_number"],
                                    "properties": {
                                        "id": {"type": "string", "description": "Duffel passenger id from the selected offer; filled by index when omitted"},
                                        "title": {"type": "string", "default": "mr"},
                                        "given_name": {"type": "string"},
                                        "family_name": {"type": "string"},
                                        "born_on": {"type": "string", "description": "YYYY-MM-DD"},
                                        "email": {"type": "string"},
                                        "phone_number": {"type": "string"},
                                        "gender": {"type": "string"},
                                    },
                                },
                            },
                            "payment_amount": {"type": "string"},
                            "payment_currency": {"type": "string"},
                        },
                    },
                },
                {
                    "name": "get_order",
                    "title": "Get order",
                    "description": "Fetch one Duffel order by id. Payment details are reduced to type, amount, and currency.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["order_id"],
                        "properties": {"order_id": {"type": "string"}},
                    },
                },
                {
                    "name": "list_orders",
                    "title": "List orders",
                    "description": "List Duffel orders, first page only. Payment details are reduced to type, amount, and currency.",
                    "inputSchema": {
                        "type": "object",
                        "properties": {
                            "limit": {"type": "integer", "minimum": 1, "maximum": 50, "default": 50},
                            "created_at_after": {"type": "string", "description": "ISO timestamp lower bound"},
                            "passenger_name": {"type": "string"},
                            "booking_reference": {"type": "string"},
                        },
                    },
                },
            ]
            return _ok("tools/list", {"tools": tools, "tool_count": len(tools)}, f"Duffel MCP - {len(tools)} tools available", {"tool_count": len(tools)})

        def _search_offers(args):
            origin = _text(args.get("origin")).upper()
            destination = _text(args.get("destination")).upper()
            departure_date = _text(args.get("departure_date") or args.get("departureDate"))
            if not origin or not destination or not departure_date:
                return _error("search_offers", "origin, destination, and departure_date are required")
            adults = _cap(args.get("adults"), default=1, maximum=9)
            cabin = _text(args.get("cabin_class") or args.get("cabin") or "economy").lower()
            if cabin == "premium-economy":
                cabin = "premium_economy"
            if cabin not in ("economy", "premium_economy", "business", "first"):
                cabin = "economy"
            slices = [{"origin": origin, "destination": destination, "departure_date": departure_date}]
            return_date = _text(args.get("return_date") or args.get("returnDate"))
            if return_date:
                slices.append({"origin": destination, "destination": origin, "departure_date": return_date})
            payload = {
                "data": {
                    "slices": slices,
                    "passengers": [{"type": "adult"} for _ in range(adults)],
                    "cabin_class": cabin,
                }
            }
            ok, status_code, body = _request("POST", "/air/offer_requests", payload=payload, params={"return_offers": "true"})
            data = body.get("data") if isinstance(body, dict) else {}
            offers = _as_list(data.get("offers") if isinstance(data, dict) else [])
            cap = _cap(args.get("max_offers"), default=10, maximum=10)
            normalised = [_normalise_offer(offer) for offer in offers[:cap] if isinstance(offer, dict)]
            if not ok:
                return _error("search_offers", "Duffel search_offers failed", body, status_code)
            currency = None
            for offer in normalised:
                currency = (offer.get("price") or {}).get("currency")
                if currency:
                    break
            return _ok(
                "search_offers",
                {
                    "source": "duffel",
                    "duffel_env": duffel_env,
                    "ok": True,
                    "status_code": status_code,
                    "offer_request_id": data.get("id") if isinstance(data, dict) else None,
                    "offers": normalised,
                    "offers_total": len(normalised),
                    "raw_offers_total": len(offers),
                    "meta": {"count": len(normalised), "source": "duffel", "currency": currency},
                },
                f"{len(normalised)} Duffel flight offer(s)",
                {"status_code": status_code, "offers_total": len(normalised)},
            )

        def _get_offer(args):
            offer_id = _text(args.get("offer_id") or args.get("id"))
            if not offer_id:
                return _error("get_offer", "offer_id is required")
            ok, status_code, body = _request("GET", f"/air/offers/{urllib.parse.quote(offer_id, safe='')}")
            if not ok:
                return _error("get_offer", "Duffel get_offer failed", body, status_code)
            return _ok("get_offer", {"source": "duffel", "status_code": status_code, "offer": body.get("data") if isinstance(body, dict) else body}, "Duffel offer fetched", {"status_code": status_code})

        def _search_places(args):
            query = _text(args.get("query"))
            if not query and not (args.get("lat") and args.get("lng")):
                return _error("search_places", "query or lat/lng is required")
            params = {}
            if query:
                params["query"] = query
            for key in ("lat", "lng", "rad"):
                if args.get(key) not in (None, ""):
                    params[key] = args.get(key)
            ok, status_code, body = _request("GET", "/places/suggestions", params=params)
            if not ok:
                return _error("search_places", "Duffel search_places failed", body, status_code)
            items = _as_list(body.get("data") if isinstance(body, dict) else [])
            return _ok("search_places", {"source": "duffel", "status_code": status_code, "places": items, "places_total": len(items)}, f"{len(items)} Duffel place suggestion(s)", {"status_code": status_code, "places_total": len(items)})

        def _get_airlines(args):
            limit = _cap(args.get("limit"), default=200, maximum=200)
            ok, status_code, body = _request("GET", "/air/airlines", params={"limit": limit})
            if not ok:
                return _error("get_airlines", "Duffel get_airlines failed", body, status_code)
            items = _as_list(body.get("data") if isinstance(body, dict) else [])
            meta = body.get("meta") if isinstance(body, dict) and isinstance(body.get("meta"), dict) else {}
            return _ok("get_airlines", {"source": "duffel", "status_code": status_code, "airlines": items, "airlines_total": len(items), "meta": meta}, f"{len(items)} Duffel airline(s)", {"status_code": status_code, "airlines_total": len(items)})

        def _parse_ts(value):
            text = _text(value)
            if not text:
                return None
            try:
                return datetime.fromisoformat(text.replace("Z", "+00:00"))
            except Exception:
                return None

        def _safe_payment(payment):
            if not isinstance(payment, dict):
                return {}
            return {
                "type": payment.get("type"),
                "amount": payment.get("amount"),
                "currency": payment.get("currency"),
            }

        def _safe_order(order):
            if not isinstance(order, dict):
                return {}
            return {
                "id": order.get("id"),
                "booking_reference": order.get("booking_reference"),
                "type": order.get("type"),
                "live_mode": order.get("live_mode"),
                "created_at": order.get("created_at"),
                "confirmed_at": order.get("confirmed_at"),
                "cancelled_at": order.get("cancelled_at"),
                "total_amount": order.get("total_amount"),
                "total_currency": order.get("total_currency"),
                "base_amount": order.get("base_amount"),
                "base_currency": order.get("base_currency"),
                "tax_amount": order.get("tax_amount"),
                "tax_currency": order.get("tax_currency"),
                "passengers": order.get("passengers") if isinstance(order.get("passengers"), list) else [],
                "slices": order.get("slices") if isinstance(order.get("slices"), list) else [],
                "payments": [_safe_payment(p) for p in _as_list(order.get("payments"))],
                # Only surface documents Duffel actually hosts. Test-environment
                # orders return electronic_ticket entries with document_url=null;
                # filter those out so downstream widget schemas that require a
                # string url never see a null and clients can simply hide the
                # download CTA when the list is empty.
                "documents": [
                    {
                        "unique_identifier": doc.get("unique_identifier"),
                        "type": doc.get("type"),
                        "document_url": doc.get("document_url"),
                    }
                    for doc in _as_list(order.get("documents"))
                    if isinstance(doc, dict) and isinstance(doc.get("document_url"), str) and doc.get("document_url")
                ],
            }

        def _offer_by_id(offer_id):
            return _request("GET", f"/air/offers/{urllib.parse.quote(offer_id, safe='')}")

        def _normalise_passengers(input_passengers, offer):
            passengers = _as_list(input_passengers)
            if not passengers:
                return None, "passengers must be a non-empty array"
            offer_passengers = _as_list(offer.get("passengers") if isinstance(offer, dict) else [])
            normalised = []
            required = ("given_name", "family_name", "born_on", "email", "phone_number")
            for idx, passenger in enumerate(passengers):
                if not isinstance(passenger, dict):
                    return None, f"passenger[{idx}] must be an object"
                missing = [key for key in required if not _text(passenger.get(key))]
                if missing:
                    return None, f"passenger[{idx}] missing required field(s): {', '.join(missing)}"
                item = {
                    "id": _text(passenger.get("id") or ((offer_passengers[idx] or {}).get("id") if idx < len(offer_passengers) and isinstance(offer_passengers[idx], dict) else "")),
                    "title": _text(passenger.get("title") or "mr").lower(),
                    "given_name": _text(passenger.get("given_name")),
                    "family_name": _text(passenger.get("family_name")),
                    "born_on": _text(passenger.get("born_on")),
                    "email": _text(passenger.get("email")),
                    "phone_number": _text(passenger.get("phone_number")),
                }
                gender = _text(passenger.get("gender")).lower()
                if gender:
                    item["gender"] = gender
                if not item["id"]:
                    return None, f"passenger[{idx}] missing Duffel passenger id and offer had no matching passenger id"
                normalised.append(item)
            return normalised, None

        def _create_order(args):
            if duffel_env != "test":
                return _error("create_order", "create_order is enabled only for duffel_env=test in this round", code="live_orders_disabled")
            offer_id = _text(args.get("offer_id") or args.get("id"))
            if not offer_id:
                return _error("create_order", "offer_id is required", code="validation_error")
            ok, status_code, offer_body = _offer_by_id(offer_id)
            if not ok:
                return _error("create_order", "Duffel get_offer failed before order creation", offer_body, status_code)
            offer = offer_body.get("data") if isinstance(offer_body, dict) and isinstance(offer_body.get("data"), dict) else {}
            expires_at = _parse_ts(offer.get("expires_at"))
            if expires_at and expires_at <= datetime.now(timezone.utc):
                return _error("create_order", f"Offer {offer_id} is expired", code="offer_expired")
            passengers, passenger_error = _normalise_passengers(args.get("passengers"), offer)
            if passenger_error:
                return _error("create_order", passenger_error, code="validation_error")
            amount = _text(args.get("payment_amount") or offer.get("total_amount"))
            currency = _text(args.get("payment_currency") or offer.get("total_currency"))
            if not amount or not currency:
                return _error("create_order", "payment amount/currency could not be determined from offer", code="validation_error")
            payload = {
                "data": {
                    "type": "instant",
                    "selected_offers": [offer_id],
                    "passengers": passengers,
                    "payments": [{"type": "balance", "amount": amount, "currency": currency}],
                }
            }
            ok, status_code, body = _request("POST", "/air/orders", payload=payload)
            if not ok:
                return _error("create_order", "Duffel create_order failed", body, status_code)
            order = body.get("data") if isinstance(body, dict) else {}
            # Duffel issues itinerary receipt documents asynchronously after
            # order creation; the create response usually has documents=[].
            # Re-fetch the order so callers (e.g. travel UI) get document_url
            # values they can link to without a second round-trip.
            order_id_for_refresh = order.get("id") if isinstance(order, dict) else None
            if order_id_for_refresh and not _as_list(order.get("documents")):
                ok2, _status2, refresh = _request(
                    "GET",
                    f"/air/orders/{urllib.parse.quote(str(order_id_for_refresh), safe='')}",
                )
                if ok2 and isinstance(refresh, dict) and isinstance(refresh.get("data"), dict):
                    order = refresh["data"]
            safe = _safe_order(order)
            return _ok(
                "create_order",
                {"source": "duffel", "status_code": status_code, "order": safe, "order_id": safe.get("id"), "booking_reference": safe.get("booking_reference")},
                f"Duffel test order created {safe.get('booking_reference') or safe.get('id')}",
                {"status_code": status_code, "order_id": safe.get("id"), "booking_reference": safe.get("booking_reference")},
            )

        def _get_order(args):
            order_id = _text(args.get("order_id") or args.get("id"))
            if not order_id:
                return _error("get_order", "order_id is required", code="validation_error")
            ok, status_code, body = _request("GET", f"/air/orders/{urllib.parse.quote(order_id, safe='')}")
            if not ok:
                return _error("get_order", "Duffel get_order failed", body, status_code)
            order = body.get("data") if isinstance(body, dict) else {}
            safe = _safe_order(order)
            return _ok("get_order", {"source": "duffel", "status_code": status_code, "order": safe, "order_id": safe.get("id"), "booking_reference": safe.get("booking_reference")}, f"Duffel order {safe.get('booking_reference') or safe.get('id')} fetched", {"status_code": status_code})

        def _list_orders(args):
            params = {"limit": _cap(args.get("limit"), default=50, maximum=50)}
            if _text(args.get("booking_reference")):
                params["booking_reference"] = _text(args.get("booking_reference"))
            if _text(args.get("created_at_after")):
                params["created_at[after]"] = _text(args.get("created_at_after"))
            if _text(args.get("passenger_name")):
                params["passenger_name[]"] = _text(args.get("passenger_name"))
            ok, status_code, body = _request("GET", "/air/orders", params=params)
            if not ok:
                return _error("list_orders", "Duffel list_orders failed", body, status_code)
            orders = [_safe_order(order) for order in _as_list(body.get("data") if isinstance(body, dict) else []) if isinstance(order, dict)]
            meta = body.get("meta") if isinstance(body, dict) and isinstance(body.get("meta"), dict) else {}
            return _ok("list_orders", {"source": "duffel", "status_code": status_code, "orders": orders, "orders_total": len(orders), "meta": meta}, f"{len(orders)} Duffel order(s)", {"status_code": status_code, "orders_total": len(orders)})

        globals().update({
            "base64": base64,
            "METADATA_TOKEN_URL": METADATA_TOKEN_URL,
            "_metadata_token": _metadata_token,
            "_extract_token": _extract_token,
            "_secret_bearer": _secret_bearer,
            "_as_dict": _as_dict,
            "_as_list": _as_list,
            "_cap": _cap,
            "_text": _text,
            "_error": _error,
            "_ok": _ok,
            "_request": _request,
            "_duration": _duration,
            "_iata": _iata,
            "_carrier": _carrier,
            "_normalise_segment": _normalise_segment,
            "_normalise_offer": _normalise_offer,
            "_tools_list": _tools_list,
            "_search_offers": _search_offers,
            "_get_offer": _get_offer,
            "_search_places": _search_places,
            "_get_airlines": _get_airlines,
            "_parse_ts": _parse_ts,
            "_safe_payment": _safe_payment,
            "_safe_order": _safe_order,
            "_offer_by_id": _offer_by_id,
            "_normalise_passengers": _normalise_passengers,
            "_create_order": _create_order,
            "_get_order": _get_order,
            "_list_orders": _list_orders,
            "json": json,
            "datetime": datetime,
            "timezone": timezone,
            "urllib": urllib,
        })

        VALID_TOOLS = ("search_offers", "get_offer", "search_places", "get_airlines", "create_order", "get_order", "list_orders")
        method_name = _text(method, "tools/list").lower()
        tool_name = _text(tool).lower()
        args = _as_dict(arguments)
        project = _text(google_project, "noetl-demo-19700101")
        secret_name = _text(duffel_secret_name, "duffel-api-test")

        if method_name == "tools/list":
            result = _tools_list()
        elif method_name != "tools/call":
            result = _error(method_name, f"Unknown MCP method: {method_name}")
        elif tool_name not in VALID_TOOLS:
            result = _error(tool_name or "unknown", f"Unknown tool: {tool_name}. Run tools/list to see the catalog.")
        else:
            # Resolve the Duffel bearer from GSM via Workload Identity. On kind
            # (no metadata server) or pre-grant prod this raises a clear
            # credential/permission error rather than a 401 from an empty bearer.
            # Promote the resolved bearer to globals so the globally-registered
            # _request helper reads it (the python tool execs helpers in globals).
            try:
                duffel_token = _secret_bearer(project, secret_name)
                globals()["duffel_token"] = duffel_token
            except Exception as exc:
                result = _error(tool_name, "Duffel credential unavailable", f"{type(exc).__name__}: {exc}", code="credential_unavailable")
            if "result" not in locals() or result is None:
                try:
                    if tool_name == "search_offers":
                        result = _search_offers(args)
                    elif tool_name == "get_offer":
                        result = _get_offer(args)
                    elif tool_name == "search_places":
                        result = _search_places(args)
                    elif tool_name == "get_airlines":
                        result = _get_airlines(args)
                    elif tool_name == "create_order":
                        result = _create_order(args)
                    elif tool_name == "get_order":
                        result = _get_order(args)
                    else:
                        result = _list_orders(args)
                except Exception as exc:
                    result = _error(tool_name, "Duffel tool failed", f"{type(exc).__name__}: {exc}")
    next:
