  - step: normalize_tool_response
    desc: Normalize whichever MCP branch ran and update slot state hints
    tool:
      kind: python
      input:
        first_tool: "{{ extract_turn.first_tool }}"
        call_id: "{{ extract_turn.call_id }}"
        slot_state: "{{ extract_turn.captured_slots }}"
        thread_path: "{{ normalize_input.thread_path }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
        places_result: "{{ call_google_places | default({}) }}"
        offers_result: "{{ call_duffel_offers | default({}) }}"
        order_result: "{{ call_duffel_create_order | default({}) }}"
        hotels_result: "{{ call_hotelbeds_hotels | default({}) }}"
        activities_result: "{{ call_hotelbeds_activities | default({}) }}"
        transfers_result: "{{ call_hotelbeds_transfers | default({}) }}"
        book_result: "{{ call_hotelbeds_book | default({}) }}"
      code: |
        import copy
        import json
        import re

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        def _as_list(value):
            return value if isinstance(value, list) else []

        def _display_name(place):
            display = place.get("displayName") if isinstance(place, dict) else {}
            if isinstance(display, dict):
                return display.get("text") or ""
            return str(display or place.get("name") or "")

        def _city_hint(text):
            lowered = str(text or "").lower()
            known = {
                "miami": ("Miami", "MIA", "US"),
                "paris": ("Paris", "PAR", "FR"),
                "boston": ("Boston", "BOS", "US"),
                "new york": ("New York", "NYC", "US"),
                "nyc": ("New York", "NYC", "US"),
                "london": ("London", "LON", "GB"),
            }
            for key, item in known.items():
                if key in lowered:
                    label, code, country = item
                    return {"label": label, "city_code": code, "country_code": country, "kind": "city"}
            return None

        def _place_photo(place):
            google = _as_dict(place.get("_google")) if isinstance(place, dict) else {}
            for key in ("image_url", "maps_static_url", "photo_url"):
                if google.get(key):
                    return google.get(key)
            photos = place.get("photos") if isinstance(place, dict) else []
            if isinstance(photos, list):
                for photo in photos:
                    if isinstance(photo, str) and photo.startswith("http"):
                        return photo
                    if isinstance(photo, dict):
                        for key in ("url", "image_url", "maps_static_url"):
                            if photo.get(key):
                                return photo.get(key)
            return None

        def _place_card(place):
            google = _as_dict(place.get("_google")) if isinstance(place, dict) else {}
            photo = _place_photo(place)
            card = {
                "place_id": str(google.get("place_id") or place.get("id") or place.get("place_id") or ""),
                "name": google.get("name") or _display_name(place) or "Place",
                "types": place.get("types") if isinstance(place.get("types"), list) else google.get("types", ["destination"]),
                "photos": [photo] if photo else [],
                "address": google.get("address") or place.get("formattedAddress") or place.get("address") or "Suggested destination",
                "ctas": ["add_to_itinerary"],
            }
            rating = google.get("rating") if google.get("rating") is not None else place.get("rating")
            rating_count = (
                google.get("user_rating_count")
                if google.get("user_rating_count") is not None
                else place.get("userRatingCount") if place.get("userRatingCount") is not None else place.get("rating_count")
            )
            if isinstance(rating, (int, float)):
                card["rating"] = rating
            if isinstance(rating_count, int):
                card["rating_count"] = rating_count
            return card

        def _airport_iata(value):
            value = value if isinstance(value, dict) else {}
            return str(value.get("iata") or value.get("iataCode") or value.get("iata_code") or value.get("code") or "").strip()

        def _segment_card(segment):
            segment = segment if isinstance(segment, dict) else {}
            departure = segment.get("departure") if isinstance(segment.get("departure"), dict) else {}
            arrival = segment.get("arrival") if isinstance(segment.get("arrival"), dict) else {}
            carrier = str(segment.get("carrier") or segment.get("carrierCode") or segment.get("carrier_code") or "").strip()
            return {
                "departure": {
                    "iata": _airport_iata(departure),
                    "at": str(departure.get("at") or departure.get("time") or departure.get("datetime") or ""),
                },
                "arrival": {
                    "iata": _airport_iata(arrival),
                    "at": str(arrival.get("at") or arrival.get("time") or arrival.get("datetime") or ""),
                },
                "carrier": carrier or "DU",
                "flight_number": str(segment.get("flight_number") or segment.get("number") or ""),
                "duration": str(segment.get("duration") or "PT0H"),
                "stops": int(segment.get("stops") if segment.get("stops") is not None else segment.get("numberOfStops") if segment.get("numberOfStops") is not None else 0),
            }

        def _itinerary_card(itinerary):
            itinerary = itinerary if isinstance(itinerary, dict) else {}
            segments = itinerary.get("segments") if isinstance(itinerary.get("segments"), list) else []
            return {
                "duration": str(itinerary.get("duration") or "PT0H"),
                "segments": [_segment_card(segment) for segment in segments],
            }

        def _offer_card(offer):
            itineraries = [_itinerary_card(item) for item in offer.get("itineraries", [])] if isinstance(offer.get("itineraries"), list) else []
            carriers = offer.get("carriers") if isinstance(offer.get("carriers"), list) else offer.get("validatingAirlineCodes") if isinstance(offer.get("validatingAirlineCodes"), list) else []
            if not carriers:
                for itinerary in itineraries:
                    for segment in itinerary.get("segments", []):
                        carrier = segment.get("carrier")
                        if carrier and carrier not in carriers:
                            carriers.append(carrier)
            stops = 0
            if itineraries:
                stops = max(0, sum(len(itinerary.get("segments", [])) for itinerary in itineraries) - len(itineraries))
            return {
                "offer_id": offer.get("offer_id") or offer.get("id") or "offer",
                "price": offer.get("price") if isinstance(offer.get("price"), dict) else {"total": str(offer.get("total_amount") or "0"), "currency": offer.get("total_currency") or "USD"},
                "itineraries": itineraries or [{"duration": "PT0H", "segments": []}],
                "carriers": [str(carrier) for carrier in carriers],
                "duration": str(offer.get("duration") or (itineraries[0].get("duration") if itineraries else "PT0H")),
                "stops": int(offer.get("stops") if offer.get("stops") is not None else stops),
                "validating_airline": str(offer.get("validating_airline") or (carriers[0] if carriers else "DU")),
                "ctas": ["view_details", "book_this"],
            }

        def _order_payload(order):
            return {
                "order_id": str(order.get("id") or order.get("order_id") or ""),
                "booking_reference": str(order.get("booking_reference") or order.get("bookingReference") or order.get("id") or ""),
                "total_amount": str(order.get("total_amount") or order.get("base_amount") or "0.00"),
                "total_currency": str(order.get("total_currency") or order.get("base_currency") or "USD"),
                "passengers": order.get("passengers") if isinstance(order.get("passengers"), list) else [],
                "slices": order.get("slices") if isinstance(order.get("slices"), list) else [],
                "documents": order.get("documents") if isinstance(order.get("documents"), list) else [],
                "ctas": ["view_full", "new_search"],
            }

        def _hotel_score(hotel):
            # HotelBeds returns reviews as [{rate, reviewCount, type}]. Surface a
            # 0-10 score for the hotel_card (schema requires `score`); default 0.
            reviews = hotel.get("reviews") if isinstance(hotel.get("reviews"), list) else []
            for review in reviews:
                if isinstance(review, dict) and review.get("rate") is not None:
                    try:
                        return float(review.get("rate")), int(review.get("reviewCount") or 0)
                    except (TypeError, ValueError):
                        continue
            return 0.0, 0

        def _hotel_card(hotel):
            hotel = hotel if isinstance(hotel, dict) else {}
            score, score_count = _hotel_score(hotel)
            try:
                star = float(hotel.get("categoryCode", "0").split("EST")[0]) if isinstance(hotel.get("categoryCode"), str) else 0.0
            except (TypeError, ValueError):
                star = 0.0
            price = None
            for key in ("minRate", "maxRate"):
                if hotel.get(key) is not None:
                    try:
                        price = float(hotel.get(key))
                        break
                    except (TypeError, ValueError):
                        continue
            # noetl/ai-meta#162 — carry the bookable rateKey from search so the
            # Book CTA can drive mcp/hotelbeds.book_hotel. Only hotels with a
            # rate_key get the "book" CTA; rate-less hotels keep the prior CTAs.
            rate_key = str(hotel.get("rateKey") or "")
            ctas = ["watch_in_detail", "show_numbers"]
            if rate_key:
                ctas.append("book")
            card = {
                "hotel_id": str(hotel.get("code") or hotel.get("hotel_id") or ""),
                "name": str(hotel.get("name") or "Hotel"),
                "score": score if 0 <= score <= 10 else 0.0,
                "photos": [],
                "amenities": [],
                "currency": str(hotel.get("currency") or "EUR"),
                "ctas": ctas,
            }
            if rate_key:
                card["rate_key"] = rate_key
            if score_count:
                card["score_count"] = score_count
            if 0 <= star <= 5 and star > 0:
                card["star_rating"] = star
            if price is not None and price >= 0:
                card["price_per_night"] = price
            lat = hotel.get("latitude")
            lng = hotel.get("longitude")
            location = {}
            try:
                if lat is not None and lng is not None:
                    location = {"lat": float(lat), "lng": float(lng)}
            except (TypeError, ValueError):
                location = {}
            city = hotel.get("destinationName") or hotel.get("zoneName")
            if city:
                location["city"] = str(city)
            if location:
                card["location"] = location
            address = hotel.get("address")
            if isinstance(address, dict):
                address = address.get("content") or address.get("street")
            if address:
                card["address"] = str(address)
            return card

        def _plain_text(value, limit):
            # HotelBeds activity descriptions arrive as multi-KB HTML blobs.
            # Strip tags + collapse whitespace so a card carries a short
            # plain-text teaser, not the raw markup. noetl/ai-meta#155 follow-up
            # (activities-trim): a 10-card activity_list with raw [:600] HTML
            # descriptions is duplicated ~6x across the render result
            # (widgets / first_widget / final_slot_state / post_docs /
            # post_events), pushing render_widget_chat to ~75 KB on a fresh
            # thread and over the 100 KB result-tier offload threshold once
            # prior-provider slot_state accumulates -> the render result is
            # offloaded to a noetl:// ref that 404s on prod and the widget
            # renders blank. Short plain text keeps every copy small.
            text = str(value or "")
            text = re.sub(r"<[^>]+>", " ", text)
            for entity, repl in (("&nbsp;", " "), ("&amp;", "&"), ("&#39;", "'"),
                                 ("&quot;", '"'), ("&lt;", "<"), ("&gt;", ">")):
                text = text.replace(entity, repl)
            text = re.sub(r"\s+", " ", text).strip()
            return text[:limit]

        def _activity_card(activity):
            # HotelBeds activities_dispatch _activity_summary shape:
            # {code, name, type, country_code, country_name, currency,
            #  amount_from, modalities_count, modalities:[{code,name,duration}],
            #  content}. Optional fields are only emitted when present so the
            # activity_list schema's minimal required set always validates.
            # Heavy fields are aggressively trimmed (see _plain_text) so the
            # card stays ~0.5 KB and the render result stays well under the
            # 100 KB offload budget even with accumulated slot_state.
            activity = activity if isinstance(activity, dict) else {}
            card = {
                "activity_code": str(activity.get("code") or activity.get("activityCode") or ""),
                "name": _plain_text(activity.get("name") or "Activity", 120) or "Activity",
                "currency": str(activity.get("currency") or "EUR"),
                "ctas": ["view_details", "add_to_itinerary"],
            }
            a_type = activity.get("type")
            if a_type:
                card["type"] = str(a_type)[:40]
            country = activity.get("country_name") or activity.get("country_code")
            if country:
                card["country"] = str(country)[:60]
            amount = activity.get("amount_from")
            try:
                if amount is not None and float(amount) >= 0:
                    card["amount_from"] = float(amount)
            except (TypeError, ValueError):
                pass
            mcount = activity.get("modalities_count")
            if isinstance(mcount, int) and mcount >= 0:
                card["modalities_count"] = mcount
            modalities = activity.get("modalities") if isinstance(activity.get("modalities"), list) else []
            norm_modalities = []
            for modality in modalities[:2]:
                if not isinstance(modality, dict):
                    continue
                entry = {}
                if modality.get("name") is not None:
                    entry["name"] = _plain_text(modality.get("name"), 60)
                if modality.get("duration") is not None:
                    entry["duration"] = modality.get("duration")
                norm_modalities.append(entry)
            if norm_modalities:
                card["modalities"] = norm_modalities
            desc = _plain_text(activity.get("content"), 160)
            if desc:
                card["description"] = desc
            return card

        def _transfer_card(service):
            # HotelBeds transfers_dispatch _transfer_summary shape:
            # {id, transferType, vehicle_code, vehicle_name, category_code,
            #  category_name, total_amount, currency, direction, rateKey,
            #  transfer_detail_info}. total_amount may arrive as a string.
            service = service if isinstance(service, dict) else {}
            card = {
                "transfer_id": str(service.get("id") or service.get("rateKey") or ""),
                "currency": str(service.get("currency") or "EUR"),
                "ctas": ["view_details", "add_to_itinerary"],
            }
            ttype = service.get("transferType")
            if ttype:
                card["transfer_type"] = str(ttype)
            vehicle = service.get("vehicle_name")
            if vehicle:
                card["vehicle_name"] = str(vehicle)
            category = service.get("category_name")
            if category:
                card["category_name"] = str(category)
            amount = service.get("total_amount")
            try:
                if amount is not None and float(amount) >= 0:
                    card["total_amount"] = float(amount)
            except (TypeError, ValueError):
                pass
            direction = service.get("direction")
            if direction:
                card["direction"] = str(direction)
            detail = service.get("transfer_detail_info")
            if detail:
                if isinstance(detail, (list, dict)):
                    detail = json.dumps(detail, default=str)
                card["detail"] = str(detail)[:600]
            return card

        def _normalise_region_fields(state):
            state = state if isinstance(state, dict) else {}
            region = state.get("region") if isinstance(state.get("region"), dict) else {}
            if not region and state.get("region_label"):
                region = {
                    "label": state.get("region_label"),
                    "city_code": state.get("region_city_code") or "",
                    "country_code": state.get("region_country_code") or "",
                    "kind": state.get("region_kind") or "city",
                }
                state["region"] = region
            if region:
                state["region_label"] = region.get("label") or state.get("region_label") or ""
                state["region_city_code"] = region.get("city_code") or state.get("region_city_code") or ""
                state["region_country_code"] = region.get("country_code") or state.get("region_country_code") or ""
                state["region_kind"] = region.get("kind") or state.get("region_kind") or "city"
            return state

        globals().update({
            "_as_dict": _as_dict,
            "_as_list": _as_list,
            "_display_name": _display_name,
            "_city_hint": _city_hint,
            "_place_photo": _place_photo,
            "_place_card": _place_card,
            "_airport_iata": _airport_iata,
            "_segment_card": _segment_card,
            "_itinerary_card": _itinerary_card,
            "_offer_card": _offer_card,
            "_order_payload": _order_payload,
            "_hotel_score": _hotel_score,
            "_hotel_card": _hotel_card,
            "_activity_card": _activity_card,
            "_transfer_card": _transfer_card,
            "_normalise_region_fields": _normalise_region_fields,
        })

        by_tool = {
            "mcp/google-places.search_text": places_result,
            "mcp/duffel.search_offers": offers_result,
            "mcp/duffel.create_order": order_result,
            "mcp/hotelbeds.search_hotels": hotels_result,
            "mcp/hotelbeds-activities.search_activities": activities_result,
            "mcp/hotelbeds-transfers.search_transfers": transfers_result,
            "mcp/hotelbeds.book_hotel": book_result,
        }
        envelope = _as_dict(by_tool.get(first_tool))
        data = _as_dict(envelope.get("data") if isinstance(envelope.get("data"), dict) else envelope)
        inner = _as_dict(data.get("data") if isinstance(data.get("data"), dict) else data)
        ok = bool(inner.get("ok", data.get("ok", not envelope.get("isError"))))
        next_state = _normalise_region_fields(copy.deepcopy(_as_dict(slot_state)))
        if first_tool == "mcp/google-places.search_text":
            places = _as_list(inner.get("places") or inner.get("items") or inner.get("results"))
            normalised_places = [_place_card(place) for place in places[:5] if isinstance(place, dict)]
            places_seen = []
            for place in places[:5]:
                if isinstance(place, dict):
                    places_seen.append(place.get("place_id") or place.get("id"))
            next_state["places_seen"] = places_seen
            next_state["total_results_seen"] = len(places)
            if not isinstance(next_state.get("region"), dict) and normalised_places:
                first_place = normalised_places[0]
                next_state["region"] = _city_hint(first_place.get("name", "")) or {
                    "label": first_place.get("name", "Destination"),
                    "city_code": "",
                    "country_code": "",
                    "kind": "city" if "locality" in first_place.get("types", []) else "landmark",
                }
                _normalise_region_fields(next_state)
        elif first_tool == "mcp/duffel.search_offers":
            offers = _as_list(inner.get("offers") or inner.get("items") or inner.get("data"))
            normalised_offers = [_offer_card(offer) for offer in offers[:10] if isinstance(offer, dict)]
            offer_ids = []
            for offer in offers[:10]:
                if isinstance(offer, dict):
                    offer_ids.append(offer.get("id") or offer.get("offer_id"))
            next_state["flight_search_results"] = offer_ids
            next_state["flight_offers"] = normalised_offers
            next_state["total_results_seen"] = len(offers)
        elif first_tool == "mcp/duffel.create_order":
            order = _as_dict(inner.get("order") or inner)
            normalised_order = _order_payload(order)
            next_state["order_id"] = order.get("id")
            next_state["booking_reference"] = order.get("booking_reference") or order.get("bookingReference")
            # Cache the normalised order so the OrderConfirmation
            # "View full order" CTA can re-render without refetching.
            next_state["last_order"] = normalised_order
        elif first_tool == "mcp/hotelbeds.search_hotels":
            hotels = _as_list(inner.get("hotels") or inner.get("items"))
            normalised_hotels = [_hotel_card(hotel) for hotel in hotels[:10] if isinstance(hotel, dict)]
            hotel_ids = [card.get("hotel_id") for card in normalised_hotels if card.get("hotel_id")]
            next_state["hotel_search_results"] = hotel_ids
            next_state["hotel_offers"] = normalised_hotels
            next_state["total_results_seen"] = len(hotels)
        elif first_tool == "mcp/hotelbeds-activities.search_activities":
            activities = _as_list(inner.get("activities") or inner.get("items"))
            normalised_activities = [_activity_card(activity) for activity in activities[:10] if isinstance(activity, dict)]
            activity_codes = [card.get("activity_code") for card in normalised_activities if card.get("activity_code")]
            next_state["activity_search_results"] = activity_codes
            next_state["activity_offers"] = normalised_activities
            next_state["total_results_seen"] = len(activities)
        elif first_tool == "mcp/hotelbeds-transfers.search_transfers":
            transfers = _as_list(inner.get("transfers") or inner.get("items"))
            normalised_transfers = [_transfer_card(service) for service in transfers[:10] if isinstance(service, dict)]
            transfer_ids = [card.get("transfer_id") for card in normalised_transfers if card.get("transfer_id")]
            next_state["transfer_search_results"] = transfer_ids
            next_state["transfer_offers"] = normalised_transfers
            next_state["total_results_seen"] = len(transfers)
        elif first_tool == "mcp/hotelbeds.book_hotel":
            # noetl/ai-meta#162 — normalise the HotelBeds booking envelope into
            # a hotel_confirmation payload (mirrors the create_order → order
            # path). Fall back to the picked hotel card / slot dates when the
            # provider omits a field so the confirmation always has a name+dates.
            booking = _as_dict(inner.get("booking") or inner)
            picked_card = {}
            for _c in (next_state.get("hotel_offers") if isinstance(next_state.get("hotel_offers"), list) else []):
                if isinstance(_c, dict) and str(_c.get("hotel_id")) == str(next_state.get("picked_hotel_id")):
                    picked_card = _c
                    break
            normalised_booking = {
                "booking_reference": str(booking.get("reference") or inner.get("booking_reference") or ""),
                "hotel_name": str(booking.get("hotel_name") or inner.get("hotel_name") or picked_card.get("name") or "Hotel"),
                "status": str(booking.get("status") or inner.get("status") or "CONFIRMED"),
                "check_in": str(booking.get("checkIn") or inner.get("checkIn") or next_state.get("check_in_date") or ""),
                "check_out": str(booking.get("checkOut") or inner.get("checkOut") or next_state.get("check_out_date") or ""),
                "total_amount": str(booking.get("totalNet") if booking.get("totalNet") is not None else (inner.get("totalNet") if inner.get("totalNet") is not None else "0.00")),
                "total_currency": str(booking.get("currency") or inner.get("currency") or picked_card.get("currency") or "EUR"),
                "destination": str(booking.get("destinationName") or booking.get("zoneName") or (next_state.get("region") or {}).get("label") or ""),
                "ctas": ["new_search"],
            }
            if ok and normalised_booking["booking_reference"]:
                next_state["hotel_booking_ref"] = normalised_booking["booking_reference"]
                next_state["last_hotel_booking"] = normalised_booking

        summary = {
            "call_id": call_id,
            "tool": first_tool,
            "ok": ok,
            "isError": bool(envelope.get("isError")) or not ok,
            "response_summary": envelope.get("summary") or envelope.get("text") or f"{first_tool} response",
            "response_excerpt": json.dumps(inner, default=str)[:1200],
        }
        if first_tool == "mcp/google-places.search_text":
            summary["places"] = normalised_places
        elif first_tool == "mcp/duffel.search_offers":
            summary["offers"] = normalised_offers
        elif first_tool == "mcp/duffel.create_order":
            summary["order"] = normalised_order
        elif first_tool == "mcp/hotelbeds.search_hotels":
            summary["hotels"] = normalised_hotels
        elif first_tool == "mcp/hotelbeds-activities.search_activities":
            summary["activities"] = normalised_activities
        elif first_tool == "mcp/hotelbeds-transfers.search_transfers":
            summary["transfers"] = normalised_transfers
        elif first_tool == "mcp/hotelbeds.book_hotel":
            summary["hotel_booking"] = normalised_booking
        # noetl/ai-meta#135 — keep this step's result under the 100 KB
        # result-tier offload threshold. A result >100 KB is offloaded to
        # object storage and the off-server state builder hands the NEXT step
        # (render_widget_chat) a placeholder instead of rehydrating it, which
        # collapsed the provider widget to its synthetic fallback. The
        # activities envelope duplicates its items under control_data AND data,
        # so carrying the full envelope twice (raw_response + an unused
        # top-level raw) pushed the result to ~118 KB; the widget cards plus a
        # lightweight envelope summary stay ~25 KB. Store only the envelope
        # metadata and drop the unused top-level raw.
        summary["raw_response"] = {
            key: envelope.get(key)
            for key in ("_meta", "isError", "status", "summary", "text")
            if key in envelope
        }
        # noetl/ai-meta#135 — the result key MUST NOT be named "summary":
        # the Rust runtime shadows a step's ".summary" accessor with an
        # auto-derived text summary, so "{{ normalize_tool_response.summary }}"
        # resolved to the response_summary STRING instead of this dict, which
        # collapsed every provider widget to its synthetic fallback. Use a
        # non-colliding key so render_widget_chat receives the real dict.
        result = {"tool_result": summary, "slot_state": next_state}
        globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: render_widget_chat

  - step: render_widget_chat
    desc: Emit one validated widget envelope plus optional bot text for the turn
    tool:
      kind: python
      input:
        thread_path: "{{ normalize_input.thread_path }}"
        event_type: "{{ normalize_input.event_type }}"
        event_payload: "{{ normalize_input.event_payload }}"
        extraction_context: "{{ extract_turn }}"
        render_intent: "{{ extract_turn.render_intent }}"
        extraction_json: "{{ extract_turn.json_str | default('{}') }}"
        slot_state_pre_tool: "{{ extract_turn.captured_slots }}"
        slot_state_post_tool: "{{ normalize_tool_response.slot_state | default({}) }}"
        tool_summary: "{{ normalize_tool_response.tool_result | default({}) }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
      code: |
        import json
        import uuid
        import re
        import copy
        from datetime import date, datetime, timezone, timedelta

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        def _env(widget_type, variant, payload):
            return {"schema_version": 1, "widget_type": widget_type, "variant": variant, "payload": payload}

        def _bot(text):
            return _env("bot_text", "default", {"text": text, "markdown": True})

        globals().update({
            "json": json,
            "uuid": uuid,
            "date": date,
            "datetime": datetime,
            "timezone": timezone,
            "timedelta": timedelta,
            "_as_dict": _as_dict,
            "_env": _env,
            "_bot": _bot,
        })

        extraction_context = _as_dict(extraction_context)
        extraction = _as_dict(extraction_json) or _as_dict(extraction_context.get("json_str"))
        if not extraction.get("slot_updates"):
            extraction = {
                **extraction,
                "slot_updates": _as_dict(extraction_context.get("slot_updates")),
            }
        slot_state = {
            **_as_dict(slot_state_pre_tool),
            **_as_dict(slot_state_post_tool),
            **_as_dict(extraction.get("slot_updates")),
        }
        render_intent = (
            _as_dict(render_intent)
            or _as_dict(extraction_context.get("render_intent"))
            or _as_dict(extraction.get("render_intent"))
        )
        intent = render_intent.get("kind") or "collect_missing"
        tool_summary = _as_dict(tool_summary)
        tool = tool_summary.get("tool", "")
        ok = not tool_summary.get("isError", False)
        tomorrow = date.today() + timedelta(days=30)
        default_from = slot_state.get("check_in_date") or tomorrow.isoformat()
        default_to = slot_state.get("check_out_date") or (tomorrow + timedelta(days=4)).isoformat()
        trip_id = slot_state.get("trip_id") or f"trip_{str(thread_path).split('/')[-1]}"
        if user_uid and user_uid != "guest":
            events_path = f"users/{user_uid}/trips/{trip_id}/events"
        else:
            events_path = f"{thread_path}/trip/current/events"
        globals().update({
            "slot_state": slot_state,
            "default_from": default_from,
            "default_to": default_to,
        })

        # noetl/ai-meta#165 — the itinerary summary + calendar must reflect the
        # REAL booked flight (PNR/price/times) and hotel (name/rate/dates/ref)
        # carried in slot_state after create_order / book_hotel, not the prior
        # hardcoded ~$960 + "Depart SFO 08:00" placeholders. These helpers pull
        # the picked offer / hotel cards and booking financials out of
        # slot_state so a partial itinerary (flight only, hotel only, neither)
        # summarises gracefully without fabricating missing pieces.
        def _money_num(value):
            try:
                return float(str(value).replace(",", "").strip())
            except (TypeError, ValueError):
                return None

        def _norm_dt(value, fallback):
            # RFC3339-valid date-time for calendar_event.start_at (the schema
            # requires format date-time + non-empty timezone). Duffel segment
            # `at` values may arrive without an offset; append Z so the string
            # validates and the FE's new Date() parse is unambiguous.
            s = str(value or "").strip()
            if not s:
                return str(fallback)
            if "T" not in s:
                s = f"{s}T12:00:00"
            timepart = s.split("T", 1)[1]
            if not re.search(r"(Z|[+-]\d{2}:?\d{2})$", timepart):
                s = s + "Z"
            return s

        def _picked_flight_card():
            # The picked Duffel offer (flight_card-shaped, built by _offer_card
            # at search time) matched by picked_flight_offer_id. CTAs are dropped
            # so the embedded summary card does not re-offer "Book this".
            offers = slot_state.get("flight_offers") if isinstance(slot_state.get("flight_offers"), list) else []
            pid = str(slot_state.get("picked_flight_offer_id") or "")
            if not pid:
                return None
            for offer in offers:
                if isinstance(offer, dict) and str(offer.get("offer_id")) == pid:
                    card = copy.deepcopy(offer)
                    card.pop("ctas", None)
                    return card
            return None

        def _picked_hotel_card():
            # The picked HotelBeds hotel (hotel_card-shaped, built by _hotel_card
            # at search time) matched by picked_hotel_id. CTAs dropped likewise.
            cards = slot_state.get("hotel_offers") if isinstance(slot_state.get("hotel_offers"), list) else []
            hid = str(slot_state.get("picked_hotel_id") or "")
            if not hid:
                return None
            for card in cards:
                if isinstance(card, dict) and str(card.get("hotel_id")) == hid:
                    out = copy.deepcopy(card)
                    out.pop("ctas", None)
                    return out
            return None

        def _summary_components():
            # Real booked/selected line items. Each: {kind, label, amount,
            # currency, detail}. amount is None when a price isn't known yet
            # (selected but not priced) — the caller renders "price pending"
            # rather than a fabricated number.
            comps = []
            order = _as_dict(slot_state.get("last_order"))
            flight_card = _picked_flight_card()
            if order or flight_card:
                amount = _money_num(order.get("total_amount"))
                currency = str(order.get("total_currency") or "USD")
                ref = str(order.get("booking_reference") or slot_state.get("booking_reference") or "")
                carrier = ""
                route = ""
                if flight_card:
                    if amount is None:
                        price = flight_card.get("price") if isinstance(flight_card.get("price"), dict) else {}
                        amount = _money_num(price.get("total"))
                        currency = str(price.get("currency") or currency)
                    carriers = flight_card.get("carriers") if isinstance(flight_card.get("carriers"), list) else []
                    carrier = str(carriers[0]) if carriers else str(flight_card.get("validating_airline") or "")
                    itins = flight_card.get("itineraries") if isinstance(flight_card.get("itineraries"), list) else []
                    segs = itins[0].get("segments") if itins and isinstance(itins[0].get("segments"), list) else []
                    if segs:
                        dep = (segs[0].get("departure") or {}).get("iata", "")
                        arr = (segs[-1].get("arrival") or {}).get("iata", "")
                        if dep or arr:
                            route = f"{dep}→{arr}"
                label = (f"Flight {carrier} {route}").strip() or "Flight"
                detail = f"PNR {ref}" if ref else ("booked" if order else "selected")
                comps.append({"kind": "flight", "label": label[:80], "amount": amount, "currency": currency, "detail": detail})
            booking = _as_dict(slot_state.get("last_hotel_booking"))
            hotel_card = _picked_hotel_card()
            if booking or hotel_card:
                amount = _money_num(booking.get("total_amount"))
                currency = str(booking.get("total_currency") or (hotel_card or {}).get("currency") or "EUR")
                ref = str(booking.get("booking_reference") or slot_state.get("hotel_booking_ref") or "")
                name = str(booking.get("hotel_name") or (hotel_card or {}).get("name") or "Hotel")
                nights = slot_state.get("nights") if isinstance(slot_state.get("nights"), int) else None
                nightly = _money_num((hotel_card or {}).get("price_per_night"))
                detail_bits = []
                if amount is not None:
                    # Real booking total is authoritative. HotelBeds minRate
                    # (price_per_night) is often the whole-stay rate, so don't
                    # assert a nightly x nights product that won't reconcile —
                    # report the real total over N nights.
                    if nights and nights > 0:
                        detail_bits.append(f"{nights} nights")
                elif nightly is not None and nights and nights > 0:
                    # Selected-not-booked: estimate the subtotal from the card.
                    amount = round(nightly * nights, 2)
                    detail_bits.append(f"est. {nightly:.2f} {currency} x {nights} nights")
                if ref:
                    detail_bits.append(f"ref {ref}")
                elif not booking:
                    detail_bits.append("selected")
                hotel_label = name if name.lower().startswith("hotel") else f"Hotel {name}"
                comps.append({"kind": "hotel", "label": hotel_label[:80], "amount": amount, "currency": currency, "detail": ", ".join(detail_bits)})
            return comps

        def _summary_financials(comps):
            # Per-currency real subtotals. The single total_cost slot reports the
            # flight's currency subtotal (else the first priced currency); mixed
            # currencies (USD flight + EUR hotel is the common Muno case) are
            # never summed into one misleading figure — the full per-currency
            # breakdown rides the notes string instead.
            subtotals = {}
            for comp in comps:
                if comp.get("amount") is not None:
                    cur = comp["currency"]
                    subtotals[cur] = round(subtotals.get(cur, 0.0) + comp["amount"], 2)
            primary = None
            for comp in comps:
                if comp.get("kind") == "flight" and comp.get("amount") is not None:
                    primary = comp["currency"]
                    break
            if primary is None:
                for comp in comps:
                    if comp.get("amount") is not None:
                        primary = comp["currency"]
                        break
            if primary is None:
                total_cost = {"amount": 0, "currency": "USD"}
            else:
                total_cost = {"amount": subtotals.get(primary, 0.0), "currency": primary}
            return total_cost, subtotals

        def _summary_notes(comps, subtotals):
            lines = []
            for comp in comps:
                amount = comp.get("amount")
                money_str = f"{amount:.2f} {comp['currency']}" if amount is not None else "price pending"
                extra = f" ({comp['detail']})" if comp.get("detail") else ""
                lines.append(f"{comp['label']} - {money_str}{extra}")
            if not lines:
                return "No bookings yet. Add a flight or hotel to build the itinerary."
            if len(subtotals) > 1:
                lines.append("Subtotals: " + " + ".join(f"{v:.2f} {k}" for k, v in subtotals.items()))
            lines.append("Test-mode itinerary — bookings use sandbox/test wallet balance only.")
            return "; ".join(lines)

        def _summary_dates():
            booking = _as_dict(slot_state.get("last_hotel_booking"))
            start = booking.get("check_in") or slot_state.get("check_in_date") or default_from
            end = booking.get("check_out") or slot_state.get("check_out_date") or default_to
            return {"from": str(start), "to": str(end)}

        def _itinerary_summary_payload():
            comps = _summary_components()
            total_cost, subtotals = _summary_financials(comps)
            region = slot_state.get("region", {}) if isinstance(slot_state.get("region"), dict) else {}
            payload = {
                "destination": region.get("label", "Destination"),
                "dates": _summary_dates(),
                "traveller_party": slot_state.get("party", {"rooms": 1, "adults": 1, "children": []}),
                "total_cost": total_cost,
                "notes": _summary_notes(comps, subtotals),
                "ctas": ["confirm", "edit"],
            }
            flight_card = _picked_flight_card()
            if flight_card:
                payload["picked_flight"] = flight_card
            hotel_card = _picked_hotel_card()
            if hotel_card:
                payload["picked_hotel"] = hotel_card
            return payload

        def _calendar_events():
            region = slot_state.get("region", {}) if isinstance(slot_state.get("region"), dict) else {}
            destination = region.get("label", "Destination")
            booking = _as_dict(slot_state.get("last_hotel_booking"))
            start = booking.get("check_in") or slot_state.get("check_in_date") or default_from
            end = booking.get("check_out") or slot_state.get("check_out_date") or default_to
            order_id = slot_state.get("order_id")
            hotel_id = slot_state.get("picked_hotel_id")
            now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
            events = []
            flight_card = _picked_flight_card()
            itineraries = flight_card.get("itineraries") if flight_card and isinstance(flight_card.get("itineraries"), list) else []
            real_legs = [it for it in itineraries if isinstance(it, dict) and it.get("segments")]
            if real_legs:
                # Real flight legs from the booked/picked offer: one depart event
                # off the first segment and one arrive event off the last segment
                # of each slice, using the offer's actual IATA codes + times.
                for itinerary in real_legs:
                    segs = [s for s in itinerary.get("segments", []) if isinstance(s, dict)]
                    if not segs:
                        continue
                    dep = segs[0].get("departure") if isinstance(segs[0].get("departure"), dict) else {}
                    arr = segs[-1].get("arrival") if isinstance(segs[-1].get("arrival"), dict) else {}
                    dep_iata = str(dep.get("iata") or "?")
                    arr_iata = str(arr.get("iata") or "?")
                    events.extend([
                        {
                            "event_id": f"flight_depart_{uuid.uuid4().hex[:8]}",
                            "type": "flight_depart",
                            "start_at": _norm_dt(dep.get("at"), f"{start}T08:00:00Z"),
                            "end_at": None,
                            "timezone": "UTC",
                            "title": f"Depart {dep_iata}"[:120],
                            "location": dep_iata[:180],
                            "notes": "Duffel test-mode flight segment",
                            "source_order_id": order_id,
                            "source_hotel_id": None,
                            "created_at": now,
                            "updated_at": now,
                            "google_calendar_event_id": None,
                        },
                        {
                            "event_id": f"flight_arrive_{uuid.uuid4().hex[:8]}",
                            "type": "flight_arrive",
                            "start_at": _norm_dt(arr.get("at"), f"{start}T16:00:00Z"),
                            "end_at": None,
                            "timezone": "UTC",
                            "title": f"Arrive {arr_iata}"[:120],
                            "location": arr_iata[:180],
                            "notes": "Duffel test-mode flight segment",
                            "source_order_id": order_id,
                            "source_hotel_id": None,
                            "created_at": now,
                            "updated_at": now,
                            "google_calendar_event_id": None,
                        },
                    ])
            elif order_id or slot_state.get("picked_flight_offer_id"):
                # Fallback: a flight is booked/picked but the offer card is no
                # longer in slot_state — keep a minimal placeholder leg so the
                # schedule isn't empty (times default to the trip start date).
                events.extend([
                    {
                        "event_id": f"flight_depart_{uuid.uuid4().hex[:8]}",
                        "type": "flight_depart",
                        "start_at": f"{start}T08:00:00Z",
                        "end_at": None,
                        "timezone": "UTC",
                        "title": "Flight departs",
                        "location": "",
                        "notes": "Duffel test-mode flight segment",
                        "source_order_id": order_id,
                        "source_hotel_id": None,
                        "created_at": now,
                        "updated_at": now,
                        "google_calendar_event_id": None,
                    },
                    {
                        "event_id": f"flight_arrive_{uuid.uuid4().hex[:8]}",
                        "type": "flight_arrive",
                        "start_at": f"{start}T16:00:00Z",
                        "end_at": None,
                        "timezone": "UTC",
                        "title": "Flight arrives",
                        "location": "",
                        "notes": "Duffel test-mode flight segment",
                        "source_order_id": order_id,
                        "source_hotel_id": None,
                        "created_at": now,
                        "updated_at": now,
                        "google_calendar_event_id": None,
                    },
                ])
            if hotel_id:
                events.extend([
                    {
                        "event_id": f"check_in_{uuid.uuid4().hex[:8]}",
                        "type": "check_in",
                        "start_at": f"{start}T15:00:00Z",
                        "end_at": None,
                        "timezone": "UTC",
                        "title": f"Check in at {destination}"[:120],
                        "location": destination[:180],
                        "notes": "Default hotel check-in time",
                        "source_order_id": None,
                        "source_hotel_id": hotel_id,
                        "created_at": now,
                        "updated_at": now,
                        "google_calendar_event_id": None,
                    },
                    {
                        "event_id": f"check_out_{uuid.uuid4().hex[:8]}",
                        "type": "check_out",
                        "start_at": f"{end}T11:00:00Z",
                        "end_at": None,
                        "timezone": "UTC",
                        "title": f"Check out from {destination}"[:120],
                        "location": destination[:180],
                        "notes": "Default hotel check-out time",
                        "source_order_id": None,
                        "source_hotel_id": hotel_id,
                        "created_at": now,
                        "updated_at": now,
                        "google_calendar_event_id": None,
                    },
                ])
            events.extend(slot_state.get("pending_calendar_events") or [])
            return events

        widgets = []
        bot_message = ""
        if not ok and tool:
            # noetl/ai-meta#155 (P4) — a failed Duffel create_order must NOT
            # retry create_order: the offer that failed (typically expired /
            # offer_no_longer_available, HTTP 422) is dead, so re-submitting the
            # same offer_id just fails again. Redirect any create_order failure
            # to a fresh flight search so the user gets live, bookable offers.
            # noetl/ai-meta#162 — same shape for a failed hotel booking: a stale
            # rateKey (checkrate_failed / booking_failed) can't be re-booked, so
            # redirect to a fresh hotel search.
            if tool == "mcp/duffel.create_order":
                retry_tool = "mcp/duffel.search_offers"
            elif tool == "mcp/hotelbeds.book_hotel":
                retry_tool = "mcp/hotelbeds.search_hotels"
            else:
                retry_tool = tool
            widgets.append(_env("error_card", "default", {
                "title": "I could not complete that search",
                "description": _as_dict(tool_summary).get("response_summary", "The provider returned an error. You can retry or continue without this step."),
                "retry_action_id": f"retry:{retry_tool}",
                "contact_support": False,
            }))
            bot_message = "That provider hiccuped, but the itinerary thread is still intact."
        elif intent == "show_places":
            places = tool_summary.get("places") if isinstance(tool_summary.get("places"), list) else []
            widgets.append(_env("place_list", "default", {
                "title": "Places to start from",
                "items": places[:5] or [{
                    "place_id": "synthetic-miami",
                    "name": slot_state.get("region", {}).get("label", "Miami"),
                    "types": ["city", "destination"],
                    "photos": [],
                    "rating": 4.6,
                    "rating_count": 1200,
                    "address": "Suggested destination",
                    "ctas": ["add_to_itinerary"],
                }],
            }))
            bot_message = "I found a destination anchor. Next I need dates and travellers."
        elif intent == "show_hotels":
            hotels = tool_summary.get("hotels") if isinstance(tool_summary.get("hotels"), list) else []
            widgets.append(_env("hotel_list", "default", {
                "title": "Hotel options",
                "items": hotels[:10] or [{
                    "hotel_id": "synthetic-hotel-1",
                    "name": f"Stay in {slot_state.get('region', {}).get('label', 'the city')}",
                    "score": 8.4,
                    "score_count": 1200,
                    "star_rating": 4,
                    "photos": [],
                    "amenities": ["wifi", "breakfast"],
                    "price_per_night": 180,
                    "currency": "EUR",
                    "address": "Suggested property",
                    "ctas": ["watch_in_detail", "show_numbers"],
                }],
                "total_count": len(hotels),
            }))
            bot_message = "Here are hotel options from HotelBeds. Pick one to add it to the itinerary."
        elif intent == "show_activities":
            activities = tool_summary.get("activities") if isinstance(tool_summary.get("activities"), list) else []
            widgets.append(_env("activity_list", "default", {
                "title": "Things to do",
                "items": activities[:10] or [{
                    "activity_code": "synthetic-activity-1",
                    "name": f"Top experience in {slot_state.get('region', {}).get('label', 'the city')}",
                    "currency": "EUR",
                    "amount_from": 45.0,
                    "ctas": ["view_details", "add_to_itinerary"],
                }],
                "total_count": len(activities),
            }))
            bot_message = "Here are activities from HotelBeds. Add one to the itinerary."
        elif intent == "show_transfers":
            transfers = tool_summary.get("transfers") if isinstance(tool_summary.get("transfers"), list) else []
            widgets.append(_env("transfer_list", "default", {
                "title": "Airport transfers",
                "items": transfers[:10] or [{
                    "transfer_id": "synthetic-transfer-1",
                    "currency": "EUR",
                    "total_amount": 44.40,
                    "vehicle_name": "Shared shuttle",
                    "category_name": "Shared",
                    "ctas": ["view_details", "add_to_itinerary"],
                }],
                "total_count": len(transfers),
            }))
            bot_message = "Here are transfer options from HotelBeds. Pick one for your trip."
        elif intent == "show_flights":
            offers = tool_summary.get("offers") if isinstance(tool_summary.get("offers"), list) else []
            flight_items = offers[:10] or [{
                "offer_id": "synthetic-offer-1",
                "price": {"total": "220.00", "currency": "USD"},
                "itineraries": [{"duration": "PT5H30M", "segments": [{
                    "departure": {"iata": "SFO", "at": f"{slot_state.get('check_in_date', default_from)}T08:00:00"},
                    "arrival": {"iata": slot_state.get("region", {}).get("city_code", "MIA"), "at": f"{slot_state.get('check_in_date', default_from)}T16:00:00"},
                    "carrier": "DU", "flight_number": "100", "duration": "PT5H30M", "stops": 0,
                }]}],
                "carriers": ["DU"],
                "duration": "PT5H30M",
                "stops": 0,
                "validating_airline": "DU",
                "ctas": ["view_details", "book_this"],
            }]
            # noetl/ai-meta#155 (P3) — total_count + emphasis must reflect the
            # real offer set, not a hardcoded 1. With 10 live Duffel offers the
            # widget previously claimed total_count=1 and emphasised a synthetic
            # offer_id. Derive both from the rendered items.
            emphasis_id = str(flight_items[0].get("offer_id") or "synthetic-offer-1")
            widgets.append(_env("flight_list", "default", {
                "title": "Flight options",
                "items": flight_items,
                "emphasis_offer_id": emphasis_id,
                "total_count": len(offers) or 1,
                "currency": "USD",
            }))
            bot_message = "Here is the first flight batch. Book one to create a Duffel test order."
        elif intent == "flight_detail":
            offers = slot_state.get("flight_offers") if isinstance(slot_state.get("flight_offers"), list) else []
            picked_offer_id = str(slot_state.get("picked_flight_offer_id") or "")
            offer = None
            for item in offers:
                if isinstance(item, dict) and str(item.get("offer_id")) == picked_offer_id:
                    offer = item
                    break
            if not offer:
                offer = {
                    "offer_id": picked_offer_id or "selected-offer",
                    "price": {"total": "0.00", "currency": "USD"},
                    "itineraries": [{"duration": "PT0H", "segments": []}],
                    "carriers": ["DU"],
                    "duration": "PT0H",
                    "stops": 0,
                    "validating_airline": "DU",
                    "ctas": ["book_this"],
                }
            widgets.append(_env("flight_card", "full", offer))
            bot_message = "Here are the flight details."
        elif intent == "order_confirmation":
            order = _as_dict(tool_summary.get("order"))
            widgets.append(_env("order_confirmation", "default", {
                "order_id": order.get("order_id") or slot_state.get("order_id") or "order-pending",
                "booking_reference": order.get("booking_reference") or slot_state.get("booking_reference") or "pending",
                "total_amount": order.get("total_amount") or "0.00",
                "total_currency": order.get("total_currency") or "USD",
                "passengers": order.get("passengers") if isinstance(order.get("passengers"), list) else [],
                "slices": order.get("slices") if isinstance(order.get("slices"), list) else [],
                "documents": order.get("documents") if isinstance(order.get("documents"), list) else [],
                "ctas": ["view_full", "new_search"],
            }))
            bot_message = "Your Duffel test order is confirmed."
        elif intent == "hotel_confirmation":
            # noetl/ai-meta#162 — render the HotelBeds TEST booking. Prefer the
            # freshly normalised booking from this turn, fall back to the cached
            # last_hotel_booking so a re-render after the fact still works.
            booking = _as_dict(tool_summary.get("hotel_booking")) or _as_dict(slot_state.get("last_hotel_booking"))
            widgets.append(_env("hotel_confirmation", "default", {
                "booking_reference": booking.get("booking_reference") or slot_state.get("hotel_booking_ref") or "pending",
                "hotel_name": booking.get("hotel_name") or "Hotel",
                "status": booking.get("status") or "CONFIRMED",
                "check_in": booking.get("check_in") or default_from,
                "check_out": booking.get("check_out") or default_to,
                "total_amount": booking.get("total_amount") or "0.00",
                "total_currency": booking.get("total_currency") or "EUR",
                "destination": booking.get("destination") or slot_state.get("region", {}).get("label", ""),
                "ctas": ["new_search"],
            }))
            bot_message = "Your HotelBeds test booking is confirmed."
        elif intent == "order_detail":
            # Back-compat: re-render the cached order without refetching from
            # Duffel. Newer travel UI handles View full order as a client-side
            # expand on the original widget, so this path mainly exists for
            # clients that still emit the order:<id> CTA event.
            order = _as_dict(slot_state.get("last_order"))
            widgets.append(_env("order_confirmation", "default", {
                "order_id": order.get("order_id") or slot_state.get("order_id") or "order-pending",
                "booking_reference": order.get("booking_reference") or slot_state.get("booking_reference") or "pending",
                "total_amount": order.get("total_amount") or "0.00",
                "total_currency": order.get("total_currency") or "USD",
                "passengers": order.get("passengers") if isinstance(order.get("passengers"), list) else [],
                "slices": order.get("slices") if isinstance(order.get("slices"), list) else [],
                "documents": order.get("documents") if isinstance(order.get("documents"), list) else [],
                "ctas": ["new_search"],
            }))
            bot_message = "Here are the booking details."
        elif intent == "trip_map":
            # noetl/ai-meta#165 — the user tapped Confirm: finalize the trip and
            # render it on a real map (map_view is a primary widget the live
            # bundle already renders via VITE_GOOGLE_MAPS_KEY). Center on the
            # destination; mark the destination and the booked/selected hotel
            # (real coords from the hotel card). map_view carries no CTA, so it
            # is a terminal view — the composer stays open for the next message.
            _geo = {
                "PAR": (48.8566, 2.3522), "MIA": (25.7617, -80.1918),
                "NYC": (40.7128, -74.0060), "LON": (51.5074, -0.1278),
                "BOS": (42.3601, -71.0589),
            }
            _region = slot_state.get("region", {}) if isinstance(slot_state.get("region"), dict) else {}
            _code = str(_region.get("city_code") or "").upper()
            _label_l = str(_region.get("label") or "").lower()
            _center = _geo.get(_code)
            if _center is None:
                for _kl, _kc in (("paris", "PAR"), ("miami", "MIA"), ("new york", "NYC"), ("london", "LON"), ("boston", "BOS")):
                    if _kl in _label_l:
                        _center = _geo[_kc]
                        break
            _center = _center or (48.8566, 2.3522)
            _clat, _clng = float(_center[0]), float(_center[1])
            markers = [{
                "lat": _clat, "lng": _clng,
                "label": str(_region.get("label") or "Destination"),
                "state": "normal",
            }]
            _hc = _picked_hotel_card()
            _loc = (_hc or {}).get("location") if isinstance((_hc or {}).get("location"), dict) else {}
            try:
                if _loc.get("lat") is not None and _loc.get("lng") is not None:
                    _hlat, _hlng = float(_loc.get("lat")), float(_loc.get("lng"))
                    markers.append({
                        "lat": _hlat, "lng": _hlng,
                        "label": str((_hc or {}).get("name") or "Hotel"),
                        "hotel_id": str((_hc or {}).get("hotel_id") or ""),
                        "state": "selected",
                    })
                    _clat, _clng = _hlat, _hlng
            except (TypeError, ValueError):
                pass
            widgets.append(_env("map_view", "default", {
                "center": {"lat": _clat, "lng": _clng},
                "zoom": 12,
                "markers": markers,
            }))
            _comps = _summary_components()
            _booked = "; ".join(c["label"] for c in _comps) or "your itinerary"
            bot_message = f"Your trip to {_region.get('label', 'your destination')} is confirmed — {_booked}. Here it is on the map."
        elif intent == "summary":
            calendar_events = _calendar_events()
            widgets.append(_env("itinerary_summary", "default", _itinerary_summary_payload()))
            widgets.append(_env("calendar_view", "compact", {
                "trip_id": trip_id,
                "display_events": calendar_events,
                "editable": False,
                "empty_state_text": "No events yet. Confirm a flight or hotel to populate the schedule.",
            }))
            bot_message = "The itinerary is ready to review."
        elif intent == "calendar_live":
            calendar_events = _calendar_events()
            calendar_payload = {
                "trip_id": trip_id,
                "editable": True,
                "empty_state_text": "No events yet. Confirm a flight or hotel to populate the schedule.",
            }
            if calendar_events:
                calendar_payload["display_events"] = calendar_events
            widgets.append(_env("calendar_view", "full", calendar_payload))
            bot_message = "Here is the current trip schedule."
        elif intent == "summarize":
            # User restated their intent on an already-populated thread.
            # Render the itinerary_summary so they see their current state
            # (real booked flight/hotel + computed total) rather than a generic
            # bot_text fallback.
            calendar_events = _calendar_events()
            widgets.append(_env("itinerary_summary", "default", _itinerary_summary_payload()))
            bot_message = "Here is the current itinerary state."
        else:
            missing = _as_dict(render_intent).get("missing") or []
            # Defense-in-depth: if the render_intent was contradictory
            # (collect_missing with an empty missing list) but all core slots
            # are present, treat it as "summarize" rather than emitting bot_text.
            core_slots_present = bool(
                slot_state.get("region")
                and slot_state.get("check_in_date")
                and slot_state.get("check_out_date")
                and slot_state.get("party")
            )
            if not missing and core_slots_present:
                widgets.append(_env("itinerary_summary", "default", _itinerary_summary_payload()))
                bot_message = "Here is the current itinerary state."
            elif "region" in missing:
                widgets.append(_env("place_autocomplete_input", "default", {
                    "placeholder": "Where do you want to go?",
                    "suggestions": [{"label": "Miami", "id": "MIA", "kind": "city"}],
                    "submit_on_select": True,
                }))
                bot_message = "Where should we plan the trip?"
            elif "dates" in missing:
                widgets.append(_env("date_range_picker", "compact", {
                    "min_date": date.today().isoformat(),
                    "max_date": (date.today() + timedelta(days=365)).isoformat(),
                    "default_from": default_from,
                    "default_to": default_to,
                    "locale": "en",
                    "submit": "submit",
                }))
                bot_message = "Pick the travel dates."
            elif "party" in missing:
                widgets.append(_env("party_picker", "default", {
                    "rooms_max": 4,
                    "adults_max": 6,
                    "children_max": 4,
                    "allow_child_ages": True,
                }))
                bot_message = "How many travellers and rooms?"
            else:
                widgets.append(_bot("Tell me the destination, dates, and traveller count, and I will build the itinerary."))
                bot_message = "I can help plan the trip from here."

        # Minimal hard gate: every envelope must include the closed-contract
        # fields. Full schema validation is done by the renderer and smoke
        # harness; invalid generated widgets are swapped to bot_text here.
        safe_widgets = []
        for item in widgets:
            if not isinstance(item, dict) or item.get("schema_version") != 1 or not item.get("widget_type") or not isinstance(item.get("payload"), dict):
                safe_widgets.append(_bot("I prepared a response, but the widget shape was invalid."))
            else:
                safe_widgets.append(item)
        calendar_events = _calendar_events()
        post_docs = []
        if isinstance(tool_summary, dict) and tool_summary.get("tool"):
            post_docs.extend([
                {"path": f"{thread_path}/slot_state/current", "doc": slot_state, "merge": False},
                {
                    "path": f"{thread_path}/api_calls/{tool_summary.get('call_id')}",
                    "doc": {
                        "call_id": tool_summary.get("call_id"),
                        "tool": tool_summary.get("tool"),
                        "arguments": extraction_context.get("first_tool_arguments") if isinstance(extraction_context, dict) else {},
                        "response": tool_summary.get("raw_response", {}),
                    },
                    "merge": False,
                },
            ])
        for event in calendar_events:
            if isinstance(event, dict) and event.get("event_id"):
                post_docs.append({
                    "path": f"{events_path}/{event.get('event_id')}",
                    "doc": event,
                    "merge": False,
                })

        post_events = []
        if isinstance(tool_summary, dict) and tool_summary.get("tool"):
            post_events.append({
                "thread_path": thread_path,
                "event": {
                    "type": "agent_tool_response",
                    "payload": tool_summary,
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            })
        if safe_widgets:
            post_events.append({
                "thread_path": thread_path,
                "event": {
                    "type": "agent_widget_emit",
                    "payload": {"envelope": safe_widgets[0]},
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            })
        if len(safe_widgets) > 1:
            post_events.append({
                "thread_path": thread_path,
                "event": {
                    "type": "agent_widget_emit",
                    "payload": {"envelope": safe_widgets[1]},
                    "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                },
            })
        post_events.append({
            "thread_path": thread_path,
            "event": {
                "type": "agent_chat",
                "payload": {"text": bot_message},
                "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
            },
        })
        # Emit one calendar.event.touched signal per calendar event written to
        # Firestore. These are appended in the same batch_append_events call
        # (append_render_events_atomically) that runs AFTER persist_render_docs_atomically
        # succeeds, so the signal is never emitted for a failed Firestore write.
        uid_for_event = user_uid if (user_uid and user_uid != "guest") else None
        for cal_evt in calendar_events:
            if isinstance(cal_evt, dict) and cal_evt.get("event_id"):
                post_events.append({
                    "thread_path": thread_path,
                    "event": {
                        "type": "calendar.event.touched",
                        "payload": {
                            "trip_id": trip_id,
                            "user_uid": uid_for_event,
                            "thread_path": thread_path,
                            "event_id": cal_evt.get("event_id"),
                            "op": "added",
                        },
                        "actor": {"kind": "agent", "name": "muno-itinerary-planner"},
                    },
                })

        result = {
            "thread_path": thread_path,
            "bot_message": bot_message,
            "final_slot_state": slot_state,
            "widgets": safe_widgets,
            "first_widget": safe_widgets[0] if safe_widgets else _bot(bot_message or "Ready."),
            "second_widget": safe_widgets[1] if len(safe_widgets) > 1 else {},
            "has_second_widget": len(safe_widgets) > 1,
            "calendar_events_path": events_path,
            "calendar_events": calendar_events,
            "first_calendar_event": calendar_events[0] if calendar_events else {},
            "second_calendar_event": calendar_events[1] if len(calendar_events) > 1 else {},
            "third_calendar_event": calendar_events[2] if len(calendar_events) > 2 else {},
            "fourth_calendar_event": calendar_events[3] if len(calendar_events) > 3 else {},
            "post_docs": post_docs,
            "post_events": post_events,
        }
        globals().update({"result": result})
    next:
      # inclusive: the two main arcs below are mutually exclusive (post_docs >0 vs
      # ==0) so exactly one fires — identical to the prior exclusive routing. The
      # third arc forks the SLM shadow branch IN PARALLEL, gated on
      # workload.slm_shadow.enabled (default false → the arc never fires and the
      # response chain is byte-identical to today). The shadow branch is a
      # dead-end leaf (shadow_slm_extract → shadow_slm_render → log_shadow_comparison)
      # that NOTHING on the response path reads.
      spec: { mode: inclusive }
      arcs:
        # FIX B (noetl/ai-meta latency): all four firestore writes — turn docs +
        # turn events from extract_turn AND render docs + render events from this
        # step — are persisted in ONE terminal batch_write child dispatch
        # (persist_all_atomically), replacing the previous four-step
        # persist_turn → append_turn → persist_render → append_render chain (four
        # kind:playbook child hops on the critical path). batch_write tolerates
        # empty set/append lists, so the old post_docs>0 / ==0 split and the
        # skip_render_persist convergence noop are gone — there is now exactly one
        # response-path arc, so no exclusive-convergence trap. Downstream steps
        # read render_widget_chat fields directly from the steps map; this arc
        # never feeds ctx.*. The shadow arc stays a gated parallel dead-end leaf.
        - step: persist_all_atomically
        - step: shadow_slm_compare
          when: "{{ workload.slm_shadow.enabled | default(false) }}"

  - step: persist_all_atomically
    desc: Persist turn + render slot docs and events in ONE batched Firestore MCP call (FIX B hop collapse)
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      payload:
        method: tools/call
        tool: batch_write
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          # Turn docs first, render docs second → render's final slot_state doc is
          # the last writer for slot_state/current (preserves the prior ordering
          # where persist_render ran after persist_turn). Each value is a
          # standalone {{ expr }} so NoETL renders it to the structured list; the
          # MCP batch_write concatenates set_docs + set_docs_extra in order.
          set_docs: "{{ extract_turn.turn_docs }}"
          set_docs_extra: "{{ render_widget_chat.post_docs }}"
          # Turn events first, render events second → monotonic seq order preserved
          # (matches the prior append_turn-then-append_render sequence).
          append_events: "{{ extract_turn.turn_events }}"
          append_events_extra: "{{ render_widget_chat.post_events }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: final_result

  - step: final_result
    desc: Return the execution-level result for the caller
    tool:
      kind: python
      input:
        thread_path: "{{ normalize_input.thread_path }}"
        slot_state: "{{ render_widget_chat.final_slot_state }}"
        extraction: "{{ extract_turn }}"
        widget: "{{ render_widget_chat.first_widget }}"
        bot_message: "{{ render_widget_chat.bot_message }}"
        request_id: "{{ workload.request_id | default('') }}"
        gateway_url: "{{ workload.gateway_url | default('') }}"
      code: |
        import json
        import urllib.request

        result = {
            "status": "completed",
            "thread_id": thread_path.split("/", 1)[1] if "/" in str(thread_path) else thread_path,
            "thread_path": thread_path,
            "final_slot_state": slot_state,
            "emitted_widget_types": [widget.get("widget_type")] if isinstance(widget, dict) else [],
            "render": widget,
            "bot_message": bot_message,
            "llm_contract": extraction.get("llm_contract") if isinstance(extraction, dict) else {},
            "replay": {
                "supported": True,
                "tool_responses_path": f"{thread_path}/api_calls",
                "drift_policy": "slot_updates and widget_type sequence are stable; chat wording drift is tolerated",
            },
        }

        if request_id and gateway_url:
            try:
                callback_url = gateway_url.rstrip("/") + "/api/internal/callback/async"
                body = json.dumps({
                    "request_id": request_id,
                    "status": "COMPLETED",
                    "data": result,
                }).encode("utf-8")
                req = urllib.request.Request(
                    callback_url,
                    data=body,
                    headers={"Content-Type": "application/json"},
                    method="POST",
                )
                with urllib.request.urlopen(req, timeout=5) as response:
                    result["gateway_callback"] = {
                        "delivered": 200 <= response.status < 300,
                        "status_code": response.status,
                    }
            except Exception as exc:
                result["gateway_callback"] = {
                    "delivered": False,
                    "error": str(exc)[:300],
                }
  # ─────────────────────────────────────────────────────────────────────────
  # SLM SHADOW LEAF (RFC docs/rfc/travel-slm-shadow-rollout.md, Option A).
  # Reached ONLY when workload.slm_shadow.enabled=true, forked in PARALLEL off
  # render_widget_chat's inclusive `next`. ONE terminal leaf — NOTHING on the
  # response path (persist_render → append_render → final_result) reads it, so the
  # served turn is provably unaffected.
  #
  # Why one step (not extract→render→log): the Rust orchestrator marks the whole
  # execution terminal the instant the main path's terminal step (final_result)
  # completes, then drives no further commands. A multi-hop parallel shadow chain
  # would have its tail hop orphaned (the slow SLM render outlives final_result).
  # A single leaf is dispatched at the fork, runs to completion in parallel, and
  # persists its result (the comparison record) in the event log even after the
  # execution goes terminal — no orphaned hop. This step IS the flywheel capture
  # point, read back by slm_replay --shadow. Any SLM error/timeout → fell_back,
  # logged; the SLM output is never served (chosen == "live").
  # ─────────────────────────────────────────────────────────────────────────
  - step: shadow_slm_compare
    desc: Shadow — v3 SLM extract+render vs the live oracle, per-field agreement (logged, never served)
    tool:
      kind: python
      input:
        event_type: "{{ workload.event_type | default('user_message') }}"
        event_payload: "{{ workload.event_payload | default({}) }}"
        slot_state: "{{ load_slot_state.data | default({}) }}"
        tool_summary: "{{ normalize_tool_response.tool_result | default({}) }}"
        live_extract_json: "{{ extract_turn.json_str | default('{}') }}"
        live_widgets: "{{ render_widget_chat.widgets | default([]) }}"
        live_bot_message: "{{ render_widget_chat.bot_message | default('') }}"
        endpoint: "{{ workload.slm_shadow.endpoint | default('') }}"
        timeout_ms: "{{ workload.slm_shadow.timeout_ms | default(60000) }}"
        compare_render: "{{ workload.slm_shadow.compare_render | default(true) }}"
      code: |
        import json
        import re
        import urllib.request

        _EMAIL = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
        _PHONE = re.compile(r"\+?[\d][\d\s\-().]{7,}\d")

        def _redact(text):
            if not isinstance(text, str) or not text:
                return text
            t = _EMAIL.sub("[REDACTED_EMAIL]", text)
            return _PHONE.sub(lambda m: "[REDACTED_PHONE]" if sum(c.isdigit() for c in m.group(0)) >= 9 else m.group(0), t)

        def _as_dict(v):
            if isinstance(v, dict):
                return v
            if isinstance(v, str):
                try:
                    p = json.loads(v)
                    return p if isinstance(p, dict) else {}
                except Exception:
                    return {}
            return {}

        def _first_tool(ex):
            reqs = (ex or {}).get("tool_requests") or []
            return reqs[0].get("tool", "") if reqs else ""

        def _first_args(ex):
            reqs = (ex or {}).get("tool_requests") or []
            return reqs[0].get("arguments", {}) if reqs else {}

        def _intent(ex):
            return ((ex or {}).get("render_intent") or {}).get("kind")

        def _wtypes(widgets):
            return [w.get("widget_type") for w in (widgets or []) if isinstance(w, dict)]

        def _post(route, body):
            req = urllib.request.Request(
                endpoint.rstrip("/") + route, data=json.dumps(body).encode("utf-8"),
                headers={"Content-Type": "application/json"}, method="POST")
            with urllib.request.urlopen(req, timeout=max(0.1, float(timeout_ms) / 1000.0)) as resp:
                return json.loads(resp.read().decode("utf-8"))

        turn = {"event_type": event_type, "event_payload": event_payload,
                "slot_state": slot_state if isinstance(slot_state, dict) else {},
                "tool_summary": tool_summary if isinstance(tool_summary, dict) else {}}

        slm_extract = slm_render = None
        ex_lat = rd_lat = None
        sv = {"extract": False, "render": False}
        fell_back = True
        error = None
        try:
            if not endpoint:
                raise RuntimeError("slm_shadow.endpoint not set")
            er = _post("/extract", {"turn": turn})
            slm_extract, ex_lat, sv["extract"] = er.get("extract"), er.get("latency_ms"), bool(er.get("schema_valid"))
            if compare_render:
                rr = _post("/render", {"turn": turn, "extraction": slm_extract or {}})
                slm_render, rd_lat, sv["render"] = rr.get("render"), rr.get("latency_ms"), bool(rr.get("schema_valid"))
            fell_back = False
        except Exception as exc:
            error = ("%s: %s" % (type(exc).__name__, exc))[:300]

        live_extract = _as_dict(live_extract_json)
        live_widgets_list = live_widgets if isinstance(live_widgets, list) else []
        slm_ex = _as_dict(slm_extract)
        slm_rd = _as_dict(slm_render)
        slm_widgets = slm_rd.get("widgets") if isinstance(slm_rd, dict) else []

        agreement = {}
        if not fell_back and slm_ex:
            agreement.update({
                "tool_match": _first_tool(live_extract) == _first_tool(slm_ex),
                "arg_match": _first_args(live_extract) == _first_args(slm_ex),
                "slot_match": live_extract.get("slot_updates") == slm_ex.get("slot_updates"),
                "render_intent_match": _intent(live_extract) == _intent(slm_ex),
            })
        if not fell_back and compare_render and slm_rd:
            agreement.update({
                "widget_type_match": _wtypes(live_widgets_list) == _wtypes(slm_widgets),
                "bot_message_match": (live_bot_message or "") == (slm_rd.get("bot_message") or ""),
            })

        red_payload = dict(_as_dict(event_payload))
        for k in ("text", "message"):
            if isinstance(red_payload.get(k), str):
                red_payload[k] = _redact(red_payload[k])

        result = {
            "kind": "slm_shadow_comparison",
            "turn": {"event_type": event_type, "event_payload": red_payload,
                     "slot_state": slot_state if isinstance(slot_state, dict) else {}},
            "live_extract": live_extract,
            "live_render": {"bot_message": live_bot_message, "widgets": live_widgets_list},
            "slm_extract": slm_ex,
            "slm_render": slm_rd,
            "chosen": "live",
            "agreement": agreement,
            "schema_valid": sv,
            "slm_extract_latency_ms": ex_lat,
            "slm_render_latency_ms": rd_lat,
            "fell_back": fell_back,
            "error": error,
            "live_widget_types": _wtypes(live_widgets_list),
            "slm_widget_types": _wtypes(slm_widgets),
        }
        globals().update({"result": result})
