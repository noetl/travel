apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: calendar_list
  path: travel/playbooks/catalog/calendar/list
  description: |
    Read playbook that returns the full calendar_view widget envelope for a
    given (user_uid, trip_id) pair by dispatching firestore_mcp.query_collection.

    Called by the SPA (Phase B cutover) whenever a calendar.event.touched
    event arrives on the NoETL SSE stream. Not exposed as an MCP or in the UI.

    Collection path logic mirrors itinerary-planner.yaml line 1066-1069:
      - user threads: users/{user_uid}/trips/{trip_id}/events
      - anonymous threads: {thread_path}/trip/current/events
  version: "1.0"
  agent: false
  exposed_in_ui: false
  tags: [calendar, read, catalog, travel]

workload:
  # Firestore auth is Workload Identity / ADC -- the worker's own service-account
  # token, minted from the GKE metadata server by the MCP child.  There is no
  # credential alias and nothing in the keychain for this path, so the former
  # `gcp_auth: google_oauth` field was inert and has been dropped.
  #
  # The project is named explicitly rather than inherited: noetl-demo-19700101 was
  # the project this file used to pin, and its Firestore data has been frozen since
  # 2026-08-09 while live reads and writes go to shastaratech-noetl-prod.  A read
  # against the wrong project returns an empty collection, not an error, so the
  # defect was invisible.
  gcp_project: shastaratech-noetl-prod
  firestore_database: "(default)"
  # Caller must supply these three fields.
  user_uid: null        # string or null for anonymous threads
  trip_id: ""           # required
  thread_path: ""       # required for anonymous threads; used when user_uid is null

workflow:
  # The Rust runtime REQUIRES a step named `start`; without it the playbook is
  # rejected at parse time with "Workflow must have a step named 'start'"
  # (server src/playbook/parser.rs:184) before any tool kind is even looked at.
  # That is why the `kind: agent` defect went unnoticed -- this check fires
  # first, so the playbook failed for a different reason than the obvious one.
  # Found by actually EXECUTING it, not by reading it.
  - step: start
    desc: Entry point required by the runtime; routes to the first real step
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: resolve_collection_path

  - step: resolve_collection_path
    desc: Derive the Firestore collection path from the workload inputs
    tool:
      kind: python
      input:
        user_uid: "{{ workload.user_uid }}"
        trip_id: "{{ workload.trip_id }}"
        thread_path: "{{ workload.thread_path }}"
      code: |
        uid = user_uid if (user_uid and str(user_uid).strip() not in ("null", "guest", "")) else None
        tid = str(trip_id or "").strip()
        tpath = str(thread_path or "").strip()

        if not tid:
            raise ValueError("trip_id is required")

        if uid:
            collection_path = f"users/{uid}/trips/{tid}/events"
        else:
            if not tpath:
                raise ValueError("thread_path is required for anonymous threads (user_uid is null)")
            collection_path = f"{tpath}/trip/current/events"

        result = {
            "collection_path": collection_path,
            "user_uid": uid,
            "trip_id": tid,
            "thread_path": tpath,
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: query_calendar_events

  - step: query_calendar_events
    desc: Read all calendar-event documents from Firestore via the Firestore MCP child
    # `kind: agent` was wrong and could never have run: the server's ToolKind enum
    # has 25 variants and `agent` is not one of them -- it sits in the explicit
    # reject list in orchestrate-core/src/playbook.rs alongside `mcp`, `provider`
    # and `result_fetch`.  An MCP provider is reached as an ordinary child
    # playbook, which is what itinerary-planner.yaml's persist_all_atomically
    # does.  See noetl/travel#134.
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      # ⚠ Without these three a `kind: playbook` child dispatch is ASYNC: the step
      # completes immediately carrying the start envelope
      #   {"async": true, "execution_id": …, "status": "started"}
      # and the next step runs before the child has produced anything. Measured on
      # execution 366308427531558912: COMPLETED, 0 failed steps, event_count 0,
      # while the child reported count: 12. `return_result` blocks for the child's
      # real result; `result_step` names the child step whose result to return
      # (the Firestore MCP's dispatch step). noetl/ai-meta#136 -- hotel-cards.yaml
      # and flights-details.yaml have carried this comment since.
      return_result: true
      result_step: firestore_dispatch
      timeout: 60
      payload:
        method: tools/call
        tool: query_collection
        gcp_project: "{{ workload.gcp_project }}"
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          collection_path: "{{ resolve_collection_path.collection_path }}"
          order_by:
            field: start_at
            direction: ASCENDING
          limit: 500
    next:
      spec: { mode: exclusive }
      arcs:
        - step: render_calendar_widget

  - step: render_calendar_widget
    desc: Assemble the calendar_view widget envelope from the Firestore documents
    tool:
      kind: python
      input:
        trip_id: "{{ resolve_collection_path.trip_id }}"
        collection_path: "{{ resolve_collection_path.collection_path }}"
        query_result: "{{ query_calendar_events | default({}) }}"
      code: |
        import json

        def _as_dict(v):
            if isinstance(v, dict):
                return v
            if isinstance(v, str):
                try:
                    return json.loads(v)
                except Exception:
                    return {}
            return {}

        def _as_list(v):
            if isinstance(v, list):
                return v
            if isinstance(v, str):
                try:
                    parsed = json.loads(v)
                    return parsed if isinstance(parsed, list) else []
                except Exception:
                    return []
            return []


        # ── the child-playbook result contract ────────────────────────────
        # A `kind: playbook` child's output is read by the BARE STEP NAME --
        # `{{ step }}`, never `{{ step.result }}`, which resolves to nothing and
        # yields a silent empty. This file used `.result` and that is why it
        # returned 0 events while the child reported count: 12.
        #
        # The value is then an MCP envelope `{isError, data, summary}`, and the
        # child dispatch may wrap it once more, so `data` is unwrapped twice
        # defensively -- the same shape hotel-cards.yaml and flights-details.yaml
        # already handle.
        #
        # A large result is EXTERNALISED: the envelope carries a
        # `noetl://execution/{id}/result/` ref that must be dereferenced, and that
        # read path can return only a `_truncated` SAMPLE. A sample returned as
        # though it were the payload is silently wrong, which is worse than empty,
        # so it is refused with a reason.
        def _find_ref(node, depth=0):
            if depth > 8:
                return None
            if isinstance(node, dict):
                r = node.get("_ref")
                if isinstance(r, str) and r.startswith("noetl://"):
                    return r
                for v in node.values():
                    got = _find_ref(v, depth + 1)
                    if got:
                        return got
            elif isinstance(node, list):
                for v in node:
                    got = _find_ref(v, depth + 1)
                    if got:
                        return got
            return None

        def _server_base():
            import os
            for key in ("NOETL_SERVER_URL", "NOETL_SERVER_RUST_SERVICE_HOST"):
                v = str(os.environ.get(key) or "").strip()
                if v.startswith("http"):
                    return v.rstrip("/")
                if v:
                    return "http://%s:8082" % v
            return "http://noetl-server-rust.noetl.svc.cluster.local:8082"

        def _truncated(node, depth=0):
            if depth > 8:
                return False
            if isinstance(node, dict):
                if node.get("_truncated"):
                    return True
                return any(_truncated(v, depth + 1) for v in node.values())
            if isinstance(node, list):
                return any(_truncated(v, depth + 1) for v in node)
            return False

        def _materialise(env):
            ref = _find_ref(env)
            if not ref:
                return env, None
            import re as _re
            import urllib.request as _ur
            m = _re.match(r"noetl://execution/(\\d+)/result/", ref)
            if not m:
                return env, "unparsable ref: %s" % str(ref)[:120]
            child = m.group(1)
            try:
                with _ur.urlopen("%s/api/executions/%s" % (_server_base(), child),
                                 timeout=45) as resp:
                    body = json.loads(resp.read().decode("utf-8") or "{}")
            except Exception as exc:
                return env, "%s: %s" % (type(exc).__name__, str(exc)[:160])
            if _truncated(body):
                return env, ("child %s result was externalised and this read path "
                             "returned only a _truncated SAMPLE; refusing it rather "
                             "than reporting a sample as the whole answer") % child
            return body, None

        def _unwrap(value):
            """Envelope -> the tool's own data dict, unwrapped at most twice."""
            env = _as_dict(value)
            d1 = _as_dict(env.get("data")) if isinstance(env.get("data"), dict) else env
            d2 = _as_dict(d1.get("data")) if isinstance(d1.get("data"), dict) else d1
            return d2

        query_result, _deref_error = _materialise(query_result)
        qr = _unwrap(query_result)
        # query_collection's data is {"collection_path": ..., "count": N, "documents": [...]}
        raw_docs = _as_list(qr.get("documents") or [])
        _provider_error = _as_dict(query_result).get("isError") or qr.get("error")

        # ⚠ The fields are NOT at the top level of each document. query_collection
        # returns `documents` as the connector's plain-doc wrapper --
        #   {"name":…, "path":…, "createTime":…, "updateTime":…, "data": {…fields…}}
        # -- built by its `_plain_doc`. The decoded Firestore fields live under
        # `data`. The previous code read `doc["event_id"]`, which is always absent,
        # so EVERY document was filtered out: measured against
        # chat_threads/chat-mtalhs7m-78hi4c, Firestore held 12 event documents and
        # this step returned event_count: 0. An empty calendar is exactly what a
        # wrong-project read looks like too, which is why it went unnoticed.
        display_events = []
        for doc in raw_docs:
            wrapper = _as_dict(doc)
            # Tolerate both shapes: the wrapper (what the connector returns) and an
            # already-flat dict, so a future connector change cannot silently empty
            # the calendar again.
            d = _as_dict(wrapper.get("data")) or wrapper
            if d.get("event_id"):
                event = dict(d)
                # Keep the document's own path; the widget does not use it today but
                # an edit path will need it, and it is free here.
                if wrapper.get("path"):
                    event.setdefault("_doc_path", wrapper["path"])
                display_events.append(event)

        # Sort by start_at (Firestore order_by may already do this, but be
        # defensive in case the MCP returns them in creation order).
        display_events.sort(key=lambda e: str(e.get("start_at") or ""))

        widget_payload = {
            "trip_id": trip_id,
            "events_path": collection_path,
            "display_events": display_events,
            "editable": True,
            "empty_state_text": "No events yet. Confirm a flight or hotel to populate the schedule.",
        }

        # Closed-contract envelope (schema_version: 1) matching the shape
        # emitted by itinerary-planner.yaml around line 1287.
        envelope = {
            "widget_type": "calendar_view",
            "variant": "full",
            "payload": widget_payload,
            "schema_version": 1,
        }

        result = {
            "envelope": envelope,
            "display_events": display_events,
            "event_count": len(display_events),
            # Both failure channels are reported, because a zero count is otherwise
            # indistinguishable from a provider error, a deref refusal, an empty
            # trip and a wrong-project read -- four different causes, one symptom.
            "deref_error": _deref_error,
            "provider_error": _provider_error,
            "documents_returned": int(qr.get("count") or len(raw_docs)),
        }
