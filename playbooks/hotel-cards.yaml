        def city_key(text):
            low = unicodedata.normalize("NFD", str(text or "")).encode("ascii", "ignore").decode("ascii").lower()
            return " ".join(re.sub(r"[^a-z0-9]+", " ", low).split())


        def _town_keys(town):
            """The names a town answers to: "Lihue, Kauai" -> "lihue kauai", "lihue", "kauai"."""
            parts = [city_key(p) for p in str(town).split(",")]
            keys = {city_key(town)} | {p for p in parts if p}
            keys |= {re.sub(r"\s+island$", "", p) for p in parts if p.endswith(" island")}
            return {k for k in keys if k}


        TOWNS = {}
        for _row in zlib.decompress(base64.b64decode("".join(CITIES_Z.split()))).decode("utf-8").splitlines():
            _town, _region, _country, _lat, _lon, _major, _large = _row.split("|")
            _airport = {"town": _town.split(",")[0].strip(), "region": _region, "country": _country,
                        "lat": float(_lat), "lon": float(_lon), "major": _major == "1", "large": _large == "1"}
            for _k in _town_keys(_town):
                TOWNS.setdefault(_k, []).append(_airport)


        def _km(a, b):
            import math
            p1, p2 = math.radians(a[0]), math.radians(b[0])
            h = (math.sin((p2 - p1) / 2) ** 2
                 + math.cos(p1) * math.cos(p2) * math.sin(math.radians(b[1] - a[1]) / 2) ** 2)
            return 6371.0 * 2 * math.asin(math.sqrt(h))


        def _places(airports):
            """Airports within 100 km of each other serve one place; farther apart are namesakes."""
            places = []
            for a in airports:
                here = next((p for p in places if _km((p[0]["lat"], p[0]["lon"]), (a["lat"], a["lon"])) <= 100), None)
                if here is None:
                    places.append([a])
                else:
                    here.append(a)
            return places


        def _pick(places, qualifier):
            q = city_key(qualifier)
            if q and len(places) > 1:
                named = [p for p in places if q in city_key(p[0]["region"]) or q in city_key(p[0]["country"])]
                if named:
                    places = named
            return max(places, key=lambda p: (any(a["major"] for a in p), sum(a["large"] for a in p), len(p)))


        def _coord(value, limit):
            try:
                v = float(str(value).strip())
            except (TypeError, ValueError):
                return None
            return v if -limit <= v <= limit else None


        def _radius(value):
            try:
                return max(1, min(int(float(str(value).strip())), 100))
            except (TypeError, ValueError):
                return 20


        def resolve_location(city, latitude, longitude, radius):
            lat, lng = _coord(latitude, 90), _coord(longitude, 180)
            town, _, qualifier = str(city or "").strip().partition(",")
            town = town.strip()
            key = city_key(town)
            asked = _radius(radius)
            if lat is not None and lng is not None:
                return {"location_ok": True, "has_coordinates": True, "latitude": lat, "longitude": lng,
                        "radius": asked, "city": town, "source": "coordinates"}
            if not key:
                return {"location_ok": False, "has_coordinates": False, "city": "", "code": "missing_location",
                        "message": "No location received: send a city or coordinates for the hotel search."}
            matched = key
            if matched in CITY_CENTRES and not qualifier.strip():
                clat, clng = CITY_CENTRES[matched]
                return {"location_ok": True, "has_coordinates": False, "latitude": clat, "longitude": clng, "radius": asked,
                        "city": town, "source": "city_centre"}
            place = _pick(_places(TOWNS.get(matched) or []), qualifier) if TOWNS.get(matched) else None
            if not place:
                return {"location_ok": False, "has_coordinates": False, "city": town, "code": "location_not_found",
                        "message": "We couldn't find a city called \"%s\". Please check the spelling and try again." % town}
            return {"location_ok": True, "has_coordinates": False,
                    "latitude": round(sum(a["lat"] for a in place) / len(place), 4),
                    "longitude": round(sum(a["lon"] for a in place) / len(place), 4),
                    "radius": max(asked, AIRPORT_RADIUS_KM),
                    "city": town, "region": place[0]["region"],
                    "country": place[0]["country"], "source": "airport_table"}


        globals().update({"result": resolve_location(city, latitude, longitude, globals().get("radius", 20))})
    next:
      spec: { mode: exclusive }
      arcs:
        - when: "{{ check_location.location_ok }}"
          step: search_hotels
        - step: no_location

  - step: no_location
    desc: No city or coordinates were sent; say so instead of searching anywhere
    tool:
      kind: python
      input:
        check_in: "{{ resolve_dates.check_in }}"
        check_out: "{{ resolve_dates.check_out }}"
        location: "{{ check_location }}"
      code: |
        result = {
            "hotels": [],
            "count": 0,
            "check_in": check_in,
            "check_out": check_out,
            "source": "hotelbeds",
            "provider_error": (location.get("message") if isinstance(location, dict) else None)
                              or "No location received: send a city or coordinates for the hotel search.",
            "provider_error_code": (location.get("code") if isinstance(location, dict) else None) or "missing_location",
            "provider_error_detail": None,
            "deref_error": None,
        }
        globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: final_result

  - step: search_hotels
    desc: HotelBeds availability through the registered MCP provider (TEST env)
    tool:
      kind: playbook
      path: automation/agents/mcp/hotelbeds
      # noetl/ai-meta#136 — block for the child's real result so
      # `search_hotels` carries the availability payload rather than the
      # async-start envelope.
      return_result: true
      result_step: hotelbeds_dispatch
      timeout: 120
      payload:
        method: tools/call
        tool: search_hotels
        arguments:
          city: "{{ check_location.city }}"
          latitude: "{{ check_location.latitude }}"
          longitude: "{{ check_location.longitude }}"
          radius: "{{ check_location.radius }}"
          check_in: "{{ resolve_dates.check_in }}"
          check_out: "{{ resolve_dates.check_out }}"
          adults: "{{ workload.adults }}"
          rooms: "{{ workload.rooms }}"
          children: "{{ workload.children }}"
          children_ages: "{{ workload.children_ages | default([]) }}"
          # adiona/frontend#22 — this line is the whole "only 10 hotels" bug.
          # The provider takes its cap from `max_hotels`, which this playbook
          # never sent, so every search silently fell back to the provider
          # workload default of 10 no matter what `limit` said.
          max_hotels: "{{ workload.limit }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: map_cards

  - step: map_cards
    desc: Map HotelBeds availability onto the Muno hotel-card contract
    tool:
      kind: python
      input:
        search_result: "{{ search_hotels | default({}) }}"
        check_in: "{{ resolve_dates.check_in }}"
        check_out: "{{ resolve_dates.check_out }}"
        adults: "{{ workload.adults }}"
        children: "{{ workload.children }}"
        max_rooms: "{{ workload.max_rooms | default(10) }}"
        price_bands: "{{ workload.price_bands | default(4) }}"
      code: |
        import json
        import re
        from datetime import date

        CURRENCY_SYMBOL = {"USD": "$", "EUR": "€", "GBP": "£"}

        # ── THE ONE PRODUCT-BLOCKED FUNCTION ──────────────────────────────
        # `ratingLabel` and `category` are product ranking/presentation
        # decisions (PRODUCT_INPUTS_REQUIRED §1; plan §5 items 9 and 10).
        # They are NOT derivable from the provider response.  The bands and
        # buckets below are a labelled stand-in chosen only so the card
        # shape is complete; they are not a product decision and must not be
        # cited as one.  Replace this function body — nothing else — when
        # product answers.
        PLACEHOLDER = True

        def _product_placeholder(rating, stars, min_rate):
            # ratingLabel: sample contract maps 8.7 -> "Excellent".
            label = ""
            if isinstance(rating, (int, float)) and rating > 0:
                if rating >= 9.0:
                    label = "Exceptional"
                elif rating >= 8.0:
                    label = "Excellent"
                elif rating >= 7.0:
                    label = "Very good"
                elif rating >= 6.0:
                    label = "Good"
                else:
                    label = "Fair"
            # category: sample contract shows "Premium".
            category = ""
            if isinstance(stars, int) and stars > 0:
                category = {5: "Luxury", 4: "Premium", 3: "Comfort"}.get(stars, "Essential")
            return label, category
        # ──────────────────────────────────────────────────────────────────

        def _as_dict(value):
            return value if isinstance(value, dict) else {}

        def _as_list(value):
            return value if isinstance(value, list) else []

        def _num(value):
            try:
                return float(value)
            except (TypeError, ValueError):
                return None

        def _money(amount, currency):
            if amount is None:
                return ""
            sym = CURRENCY_SYMBOL.get((currency or "").upper(), "")
            whole = int(round(amount))
            return f"{sym}{whole}" if sym else f"{whole} {currency or ''}".strip()

        def _nights(check_in, check_out):
            try:
                return max(1, (date.fromisoformat(check_out) - date.fromisoformat(check_in)).days)
            except (TypeError, ValueError):
                return 1

        def _stars(hotel):
            # HotelBeds categoryCode looks like "4EST" / "5EST"; categoryName
            # like "4 STARS".  Take the first integer found in either.
            for field in ("categoryCode", "categoryName"):
                m = re.search(r"(\d)", str(hotel.get(field) or ""))
                if m:
                    return int(m.group(1))
            return 0

        def _rating(hotel):
            # reviews[] entries carry {rate, reviewCount, type}. Use the first
            # with a usable rate; normalise a /5 scale to /10 so the card's
            # `rating` is always out of 10 as the contract sample shows.
            for review in _as_list(hotel.get("reviews")):
                rate = _num(_as_dict(review).get("rate"))
                if rate is None or rate <= 0:
                    continue
                return round(rate * 2, 1) if rate <= 5 else round(rate, 1)
            return None

        def _breakfast(board):
            b = str(board or "").upper()
            return "BREAKFAST" in b or b in ("BB", "DESAYUNO")

        def _amenities(hotel):
            # ONLY what the response actually attests. HotelBeds availability
            # carries no facilities list (that is the Content API), so this is
            # deliberately short rather than padded with plausible guesses.
            out = []
            if _breakfast(hotel.get("boardName")):
                out.append("Breakfast")
            return out

        def _description(hotel, stars):
            bits = []
            if stars:
                bits.append(f"{stars}-star")
            zone = hotel.get("zoneName") or hotel.get("destinationName")
            if zone:
                bits.append(f"in {zone}")
            board = hotel.get("boardName")
            if board:
                bits.append(f"— {str(board).title()} rate")
            return " ".join(bits).strip()

        def _price_bands(values, band_count):
            # Split the observed price RANGE into equal-width bands and return
            # the band index for each value.  Bands describe the rates that
            # exist; they are not product tiers and carry no name.  Fewer
            # distinct prices than bands means fewer bands — a hotel with two
            # rate prices is not padded out to four.
            # COERCE, don't trust. HotelBeds returns every money field as a
            # STRING (`"net": "548.29"`), and the provider's numeric `net_value`
            # is a convenience that not every rate row carries. A caller that
            # hands this function one un-coerced string makes `high - low` a
            # TypeError and takes the whole step down — which is exactly what
            # happened on prod the first time real rate rows ever reached this
            # code (adiona/frontend#22; the hydration bug in noetl/ai-meta#343
            # meant `hotels` was always empty, so this loop body had never once
            # run against live data).
            #
            # Coercing here as well as at the call site is deliberate: a band is
            # a presentation detail, and losing one rate to a bad value must
            # never be able to cost the caller the entire card list.
            usable = sorted({n for n in (_num(v) for v in values) if n is not None})
            if not usable:
                return {}, []
            bands = max(1, min(int(band_count or 1), len(usable)))
            low, high = usable[0], usable[-1]
            width = (high - low) / bands if high > low else 0.0
            edges = []
            for b in range(bands):
                b_low = low + width * b
                b_high = high if b == bands - 1 else low + width * (b + 1)
                edges.append({"band": b + 1, "min": round(b_low, 2), "max": round(b_high, 2)})
            index = {}
            for v in usable:
                if width <= 0:
                    index[v] = 0
                else:
                    index[v] = min(bands - 1, int((v - low) / width))
            return index, edges

        def _int_or_none(value):
            try:
                n = int(value)
            except (TypeError, ValueError):
                return None
            return n if n >= 0 else None

        def _free_cancellation_until(rate):
            if str(rate.get("rateClass") or "").upper() == "NRF":
                return None
            starts = sorted(str(_as_dict(p).get("from")) for p in _as_list(rate.get("cancellationPolicies"))
                            if _as_dict(p).get("from"))
            return starts[0] if starts else None

        def _coordinates(hotel):
            lat, lng = _num(hotel.get("latitude")), _num(hotel.get("longitude"))
            if lat is None or lng is None or not (-90 <= lat <= 90 and -180 <= lng <= 180):
                return None
            return {"lat": lat, "lng": lng}

        def _promotions(rate):
            # HotelBeds promotions: {code, name, remark}.
            out = []
            for p in _as_list(rate.get("promotions")):
                p = _as_dict(p)
                if p.get("name") or p.get("code"):
                    out.append({"code": p.get("code"), "name": p.get("name"), "remark": p.get("remark")})
            return out

        def _offers(rate):
            # HotelBeds offers: {code, name, amount}; amount is a discount, as a
            # (usually negative) string in the hotel's currency.
            out = []
            for o in _as_list(rate.get("offers")):
                o = _as_dict(o)
                if o.get("name") or o.get("code"):
                    out.append({"code": o.get("code"), "name": o.get("name"), "amount": _num(o.get("amount"))})
            return out

        def _rooms(hotel, currency, image, nights, hotel_images):
            # adiona/frontend#22 — emit up to `max_rooms` REAL bookable rates,
            # spread across price bands, instead of the single cheapest.
            #
            # The provider now returns `rates[]` — every row HotelBeds had in
            # `rooms[].rates[]`, cheapest first.  Before this, `_first_bookable_rate`
            # picked one and the rest were discarded, so a hotel with 20
            # bookable rates rendered as a one-room hotel.
            #
            # Nothing here invents inventory: a hotel with three rates returns
            # three rooms.  The spread only decides WHICH of the real rates to
            # show when there are more than `max_rooms` of them, so the list is
            # not twenty variations of the cheapest room.
            try:
                want = max(1, int(max_rooms))
            except (TypeError, ValueError):
                want = 10
            rates = _as_list(hotel.get("rates"))
            if not rates:
                # Older provider version, or a hotel with no rate rows: fall
                # back to the single bookable token the summary still carries.
                rate_key = hotel.get("rateKey")
                if not rate_key:
                    return [], []
                rates = [{
                    "rateKey": rate_key,
                    "net": hotel.get("minRate"),
                    "net_value": _num(hotel.get("minRate")),
                    "rateClass": hotel.get("rateClass"),
                    "boardName": hotel.get("boardName"),
                    "roomName": hotel.get("roomName"),
                }]

            # `net_value` is the provider's pre-parsed number and `net` is the
            # raw HotelBeds string; take the first that is present and put BOTH
            # through `_num`. The earlier form passed `net_value` straight
            # through, so a provider that supplied it as a string produced a
            # list of strings and `_price_bands` raised
            # `TypeError: unsupported operand type(s) for -: 'str' and 'str'`.
            #
            # These values are also the BUCKET KEYS below, so they have to be
            # coerced here rather than only inside `_price_bands` — otherwise
            # `band_of.get(net)` looks up a string against float keys, silently
            # misses, and every rate lands in band 0.
            nets = [_num(rate.get("net_value") if rate.get("net_value") is not None
                         else rate.get("net"))
                    for rate in rates]
            band_of, band_edges = _price_bands(nets, price_bands)

            buckets = {}
            for rate, net in zip(rates, nets):
                buckets.setdefault(band_of.get(net, 0), []).append((net, rate))
            for bucket in buckets.values():
                bucket.sort(key=lambda pair: (pair[0] is None, pair[0] if pair[0] is not None else 0.0))

            # Round-robin across the bands so the returned rates span the price
            # range rather than all landing in the cheapest band.
            picked = []
            order = sorted(buckets.keys())
            cursor = {band: 0 for band in order}
            while len(picked) < want:
                progressed = False
                for band in order:
                    if len(picked) >= want:
                        break
                    idx = cursor[band]
                    if idx < len(buckets[band]):
                        net, rate = buckets[band][idx]
                        cursor[band] = idx + 1
                        picked.append((band, net, rate))
                        progressed = True
                if not progressed:
                    break

            room_images = _as_dict(hotel.get("room_images"))
            try:
                default_sleeps = int(adults) + int(children)
            except (TypeError, ValueError):
                default_sleeps = 2

            cards = []
            for position, (band, net, rate) in enumerate(picked):
                # minRate/net is the net for the WHOLE stay. The card contract's
                # room prices sit alongside pricePerNight on the same scale
                # (sample: pricePerNight 220, rooms 180/280/240), so divide —
                # showing the stay total here reads as a nightly rate and
                # overstates it by the night count.
                per_night = round(net / nights, 2) if net is not None else None
                room_code = str(rate.get("roomCode") or "")
                imgs = [url for url in _as_list(room_images.get(room_code)) if url]
                try:
                    sleeps = int(rate.get("adults") or 0) + int(rate.get("children") or 0)
                except (TypeError, ValueError):
                    sleeps = 0
                edge = band_edges[band] if band < len(band_edges) else None
                cards.append({
                    "id": f"h{hotel.get('code')}-r{position + 1}",
                    "type": rate.get("roomName") or hotel.get("roomName") or "Standard Room",
                    "roomCode": room_code,
                    "board": rate.get("boardName") or "",
                    "breakfastIncluded": _breakfast(rate.get("boardName")),
                    "price": _money(per_night, currency),
                    "pricePerNight": per_night,
                    "totalPrice": net,
                    # adiona/frontend#62 item 4: the currency of this room's amounts.
                    "currency": currency or None,
                    "sleeps": sleeps or default_sleeps,
                    # HotelBeds rateClass "NRF" == non-refundable.
                    "refundable": str(rate.get("rateClass") or "").upper() != "NRF",
                    "cancellationPolicies": _as_list(rate.get("cancellationPolicies")),
                    # adiona/frontend#95: HotelBeds' `allotment` is the number of rooms
                    # of this type still available; null when it gave none.
                    "roomsLeft": _int_or_none(rate.get("allotment")),
                    # adiona/frontend#95: the earliest moment a cancellation charge applies
                    # (the earliest `from` of its cancellationPolicies, in the hotel's local
                    # time); before it, cancelling is free. Null for a non-refundable rate
                    # or one with no policy.
                    "freeCancellationUntil": _free_cancellation_until(rate),
                    # adiona/frontend#95: as HotelBeds gave them for this rate. paymentType
                    # is its own code (e.g. "AT_WEB": paid when booking), passed on unchanged.
                    "paymentType": rate.get("paymentType") or None,
                    "promotions": _promotions(rate),
                    "offers": _offers(rate),
                    # Room photos when the Content API attributed any to this
                    # roomCode; otherwise the hotel photo, never a room photo
                    # borrowed from a different room.
                    "image": imgs[0] if imgs else image,
                    "images": imgs,
                    "hasRoomPhotos": bool(imgs),
                    # Which slice of this hotel's own price range the rate sits
                    # in. A factual bucket, not a product tier — it has no name.
                    "priceBand": band + 1,
                    "priceBandRange": edge,
                    # carried so a downstream book step can re-price this rate
                    "rate_key": rate.get("rateKey"),
                })
            return cards, band_edges

        # ── externalised-result deref (noetl/ai-meta#343 follow-on) ────────
        # A step result over the runtime's byte budget is stored OUT OF LINE and
        # the consuming step receives
        #   {"_ref": "noetl://execution/<eid>/result/<step>/<event_id>"}
        # instead of the payload (docs/rfc/decoupled-context-event-chain.md §1).
        #
        # Hydration is normally a READ-side concern: `hydrate_result_references`
        # runs when an execution is read back through the API. A step that
        # consumes the value MID-WORKFLOW therefore gets the raw reference and
        # sees no data — silently, with `status: success` and zero hotels.
        #
        # Reading the referenced child execution back through the API is the
        # sanctioned deref, not a workaround: it is the same hydration path.
        #
        # ⚠ This playbook is exactly the shape that trips the budget — #22 made
        # the payload much larger (all Content-API images instead of 6, up to 20
        # rates per hotel, 20 hotels instead of 10). Flights stay under the floor
        # and never externalise; hotels now routinely exceed it.
        #
        # Strictly best-effort: any failure leaves the envelope untouched, which
        # degrades to the previous behaviour rather than breaking the search.
        def _server_base():
            import os
            for key in ("NOETL_SERVER_URL", "NOETL_SERVER_RUST_SERVICE_HOST"):
                v = str(os.environ.get(key) or "").strip()
                if v.startswith("http"):
                    return v.rstrip("/")
                if v:
                    return "http://%s:8082" % v
            return "http://noetl-server-rust.noetl.svc.cluster.local:8082"

        def _find_ref(node, depth=0):
            if depth > 8:
                return None
            if isinstance(node, dict):
                r = node.get("_ref")
                if isinstance(r, str) and r.startswith("noetl://"):
                    return r
                for v in node.values():
                    got = _find_ref(v, depth + 1)
                    if got:
                        return got
            elif isinstance(node, list):
                for v in node:
                    got = _find_ref(v, depth + 1)
                    if got:
                        return got
            return None

        def _hotels_in(node, depth=0):
            if depth > 10:
                return None
            if isinstance(node, dict):
                if isinstance(node.get("hotels"), list):
                    return node
                for v in node.values():
                    got = _hotels_in(v, depth + 1)
                    if got:
                        return got
            elif isinstance(node, list):
                for v in node:
                    got = _hotels_in(v, depth + 1)
                    if got:
                        return got
            return None

        def _is_truncated(node, depth=0):
            if depth > 10:
                return False
            if isinstance(node, dict):
                if node.get("_truncated"):
                    return True
                for v in node.values():
                    if _is_truncated(v, depth + 1):
                        return True
            elif isinstance(node, list):
                for v in node:
                    if _is_truncated(v, depth + 1):
                        return True
            return False

        def _ref_bytes(node, depth=0):
            if depth > 10:
                return None
            if isinstance(node, dict):
                meta = node.get("meta")
                if isinstance(meta, dict) and meta.get("bytes"):
                    return meta.get("bytes")
                for v in node.values():
                    got = _ref_bytes(v, depth + 1)
                    if got:
                        return got
            elif isinstance(node, list):
                for v in node:
                    got = _ref_bytes(v, depth + 1)
                    if got:
                        return got
            return None

        def _materialise(env):
            ref = _find_ref(env)
            if not ref:
                return env, None
            import re as _re
            import urllib.request as _ur
            m = _re.match(r"noetl://execution/(\d+)/result/", ref)
            if not m:
                return env, "unparsable ref: %s" % ref[:120]
            child = m.group(1)
            url = "%s/api/executions/%s" % (_server_base(), child)
            try:
                with _ur.urlopen(url, timeout=45) as resp:
                    body = json.loads(resp.read().decode("utf-8") or "{}")
            except Exception as exc:  # noqa: BLE001 — deref never breaks search
                return env, "%s: %s" % (type(exc).__name__, exc)
            # The API returns the reference plus `extracted` metadata, and
            # `extracted` is explicitly flagged `_truncated` -- it is a SAMPLE,
            # not the payload. Returning it would report a handful of hotels as
            # though they were the whole answer: silently wrong, which is worse
            # than empty. Refuse it and say why.
            if _is_truncated(body):
                return env, ("child %s result was externalised (%s bytes) and this read "
                             "path returned only a _truncated sample; the payload lives in "
                             "the result tier and is not hydrated here"
                             ) % (child, _ref_bytes(body) or "?")
            got = _hotels_in(body)
            if got is None:
                return env, "child %s read back without a hotels payload" % child
            return got, None

        search_result, _deref_error = _materialise(search_result)

        envelope = _as_dict(search_result)
        data = _as_dict(envelope.get("data") if isinstance(envelope.get("data"), dict) else envelope)
        inner = _as_dict(data.get("data") if isinstance(data.get("data"), dict) else data)
        hotels = _as_list(inner.get("hotels"))
        # adiona/frontend#63: the provider's refusal, as text. This used to be
        # `isError or error`, i.e. the boolean `true` for every provider failure,
        # so the UI could only say "true" and the real reason (e.g. HotelBeds'
        # "a paxes element per child") was lost. `summary` is the provider's
        # user-safe message (its raw HotelBeds body stays out of it,
        # noetl/ai-meta#175); the full diagnostic and the code ride separately.
        provider_error = None
        provider_error_code = None
        provider_error_detail = None
        if envelope.get("isError") or inner.get("error"):
            meta = _as_dict(envelope.get("_meta"))
            provider_error = str(envelope.get("summary") or envelope.get("text") or inner.get("user_message")
                                 or inner.get("error") or meta.get("error") or "hotel search failed")[:500]
            provider_error_code = inner.get("code") or meta.get("code")
            provider_error_detail = str(inner.get("error") or meta.get("error") or "")[:2000] or None

        nights = _nights(check_in, check_out)
        cards = []
        for hotel in hotels:
            hotel = _as_dict(hotel)
            currency = hotel.get("currency")
            stars = _stars(hotel)
            rating = _rating(hotel)
            total = _num(hotel.get("minRate"))
            per_night = round(total / nights, 2) if total is not None else None
            # adiona/frontend#22 — ALL hotel photos, not just the first. `image`
            # stays the single hero the card contract names; `images` is the
            # full list the provider now returns uncapped.
            images = [str(url) for url in _as_list(hotel.get("images")) if str(url or "").startswith("http")]
            image = images[0] if images else ""
            label, category = _product_placeholder(rating, stars, total)
            rooms, band_edges = _rooms(hotel, currency, image, nights, images)
            cards.append({
                "id": f"h{hotel.get('code')}",
                "name": hotel.get("name") or "",
                "stars": stars,
                "bedType": hotel.get("roomName") or "",
                "price": _money(per_night, currency),
                # adiona/frontend#62 item 4: the currency of every amount on this
                # card and its rooms, as HotelBeds stated it (ISO 4217). `price`
                # shows a symbol only for USD/EUR/GBP, so read this, not the symbol.
                "currency": currency or None,
                "breakfastIncluded": _breakfast(hotel.get("boardName")),
                "image": image,
                "images": images,
                "__renderDetailCard": True,
                "location": hotel.get("destinationName") or hotel.get("zoneName") or "",
                # adiona/frontend#95: the hotel's own coordinates and HotelBeds zone
                # (its neighbourhood or area), as HotelBeds gave them; null when absent.
                "coordinates": _coordinates(hotel),
                "neighborhood": hotel.get("zoneName") or None,
                "rating": rating,
                "ratingLabel": label,
                "pricePerNight": per_night,
                "totalPrice": total,
                "nights": nights,
                "amenities": _amenities(hotel),
                "description": _description(hotel, stars),
                "category": category,
                "rooms": rooms,
                # How many bookable rates the provider had, so a caller can
                # tell "10 shown of 20" from "10 is all there was". Falls back
                # to what was emitted when the provider predates `rates[]`.
                "roomsTotal": len(_as_list(hotel.get("rates"))) or len(rooms),
                "priceBands": band_edges,
            })

        result = {
            "hotels": cards,
            "count": len(cards),
            "nights": nights,
            "currency": inner.get("meta", {}).get("currency") if isinstance(inner.get("meta"), dict) else None,
            "check_in": check_in,
            "check_out": check_out,
            "source": "hotelbeds",
            "hotelbeds_env": inner.get("hotelbeds_env"),
            "provider_error": provider_error or None,
            "provider_error_code": provider_error_code,
            # Diagnostic only (may quote the provider's raw response): for logs
            # and support, never for display.
            "provider_error_detail": provider_error_detail,
            # Non-null means the child result was externalised and could not be
            # dereferenced — the card list is then empty for a PLUMBING reason,
            # not because HotelBeds returned nothing. Those must not look alike.
            "deref_error": _deref_error,
            # Machine-readable marker so a reader (or a test) can tell which
            # card fields are NOT product-decided yet.
            "placeholder_fields": ["ratingLabel", "category"] if PLACEHOLDER else [],
        }
        globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: final_result

  - step: final_result
    desc: Return the mapped hotel cards to the caller
    tool:
      kind: python
      input:
        mapped: "{{ map_cards | default({}) }}"
        no_location: "{{ no_location | default({}) }}"
      code: |
        # One of the two ran: the mapped cards, or the "No location received" result.
        result = mapped if isinstance(mapped, dict) and mapped else (no_location if isinstance(no_location, dict) else {})
        globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  - step: end
    desc: Terminal step — matches the `start`/`end` convention the MCP provider
      playbooks use, so the execution reaches a completed terminal node.
    tool:
      kind: noop
