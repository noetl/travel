apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: muno_hotelbeds_content_sync
  path: muno/playbooks/hotelbeds-content-sync
  description: |
    Keeps our own copy of HotelBeds hotel content (noetl/travel#166).

    HotelBeds' Content API must not be used for real-time lookups; their guide
    says to load the hotel portfolio once, keep it on our side, and refresh it
    daily with `lastUpdateTime`, or the account's credentials may be blocked
    (https://developer.hotelbeds.com/documentation/hotels/content-api/how-use-content-api/).
    Hotel search (the itinerary planner's call_hotelbeds_hotels and the
    automation/agents/mcp/hotelbeds mirror used by hotel-cards) reads this copy
    by hotel code instead of calling the Content API.

    STORAGE (Firestore, workload.firestore_database):
      hotelbeds_content/{hotel code}  code, city, countryCode, destinationCode,
                                      lastUpdate, synced_at, source_env, and
                                      `json`: the record content_record() keeps
      hotelbeds_content_sync/state    where the load stands (`json`)

    MODES (workload.mode):
      auto   continue the full load until every hotel is covered, then fetch
             only what changed since the last finished pass, at most once a
             day. What the scheduled job runs (hourly, noetl/ops CronJob
             noetl-hotelbeds-content-sync).
      full   page through the whole portfolio (resumes where it stopped).
      delta  only hotels changed since the last finished pass.
      codes  just workload.codes (testing, backfill); state is not touched.

    Each run is bounded (max_pages, max_seconds) and stops at the first
    HotelBeds refusal (e.g. a request quota) or Firestore error, saving where it
    got to; the next run continues from there. It calls no availability, booking
    or other HotelBeds API.
  version: "1"
  tags: [muno, hotelbeds, content, cache, scheduled]
  terminal:
    visible: true
    workspace: muno
    scopes: [/mcp/hotelbeds]
  capabilities: [mcp:hotelbeds]

workload:
  mode: auto
  codes: []
  # Pages of `page_size` hotels per run (HotelBeds allows up to 1,000 per page).
  max_pages: 20
  page_size: 500
  max_seconds: 240
  hotelbeds_env: test
  hotelbeds_api_base: "https://api.test.hotelbeds.com"
  google_project: "shastaratech-noetl-prod"
  hotelbeds_secret_name: "hotelbeds-hotels-test"
  firestore_database: "(default)"

workflow:
  - step: start
    desc: Entry point — the Rust runtime requires a step named `start`
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: sync

  - step: sync
    desc: Load one bounded slice of HotelBeds hotel content into Firestore and save the cursor
    tool:
      kind: python
      input:
        mode: "{{ workload.mode | default('auto') }}"
        codes: "{{ workload.codes | default([]) }}"
        max_pages: "{{ workload.max_pages | default(20) }}"
        page_size: "{{ workload.page_size | default(500) }}"
        max_seconds: "{{ workload.max_seconds | default(240) }}"
        hotelbeds_env: "{{ workload.hotelbeds_env | default('test') }}"
        hotelbeds_api_base: "{{ workload.hotelbeds_api_base }}"
        google_project: "{{ workload.google_project }}"
        hotelbeds_secret_name: "{{ workload.hotelbeds_secret_name }}"
        firestore_database: "{{ workload.firestore_database | default('(default)') }}"
      code: |
        import base64
        import gzip
        import hashlib
        import json
        import time
        import urllib.error
        import urllib.parse
        import urllib.request

        METADATA_TOKEN_URL = (
            "http://metadata.google.internal/computeMetadata/v1/"
            "instance/service-accounts/default/token"
        )


        def _as_dict(value):
            return value if isinstance(value, dict) else {}


        def _as_list(value):
            return value if isinstance(value, list) else []


        def _text(value, default=""):
            value = default if value is None else value
            return str(value).strip()


        def _metadata_token():
            # Mint an OAuth2 access token from the GKE metadata server using the
            # worker pod's Workload Identity. No google-auth library: this is the
            # same endpoint google.auth.default() reads under the hood on GKE, so a
            # direct urllib GET is the library-free equivalent (noetl/ai-meta#137).
            req = urllib.request.Request(
                METADATA_TOKEN_URL,
                headers={"Metadata-Flavor": "Google"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=10) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    "metadata token mint failed HTTP "
                    f"{exc.code}: Workload Identity is not bound to a GCP service "
                    f"account with Secret Manager access for this worker pod ({body})"
                )
            except urllib.error.URLError as exc:
                raise RuntimeError(
                    "metadata server unreachable "
                    f"({getattr(exc, 'reason', exc)}): the worker pod has no GKE "
                    "Workload Identity metadata endpoint (expected off-cluster, e.g. kind)"
                )
            token = (payload or {}).get("access_token") if isinstance(payload, dict) else None
            if not token:
                raise RuntimeError("metadata token endpoint returned no access_token")
            return token


        def _secret_json(project, secret_name):
            # Read the GSM secret value (the {"apikey","secret"} JSON) using the
            # WI metadata token. Raises with a credential/permission-flavoured
            # message so the failure mode is unambiguous on kind / pre-grant prod.
            token = _metadata_token()
            name = f"projects/{project}/secrets/{secret_name}/versions/latest:access"
            req = urllib.request.Request(
                f"https://secretmanager.googleapis.com/v1/{name}",
                headers={"Authorization": f"Bearer {token}"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=15) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    f"secret manager access HTTP {exc.code} for '{secret_name}': the "
                    f"worker GSA lacks secretmanager.secretAccessor on this secret, or "
                    f"the secret is not loaded yet ({body})"
                )
            encoded = ((payload.get("payload") or {}).get("data") or "").strip()
            if not encoded:
                raise RuntimeError(f"secret '{secret_name}' has no payload data")
            raw = base64.b64decode(encoded).decode("utf-8").strip()
            try:
                parsed = json.loads(raw)
            except Exception:
                raise RuntimeError(f"secret '{secret_name}' is not valid JSON (expected apikey/secret fields)")
            apikey = _text(parsed.get("apikey") or parsed.get("api_key") or parsed.get("key"))
            secret = _text(parsed.get("secret") or parsed.get("shared_secret"))
            if not apikey or not secret:
                raise RuntimeError(f"secret '{secret_name}' JSON is missing apikey/secret fields")
            return apikey, secret


        def _signature(apikey, secret, ts=None):
            # X-Signature = SHA256(apikey + secret + unix_seconds) hex digest.
            if ts is None:
                ts = int(time.time())
            digest = hashlib.sha256(f"{apikey}{secret}{int(ts)}".encode("utf-8")).hexdigest()
            return digest, int(ts)


        def _decode_body(resp_or_exc, raw_bytes):
            # HotelBeds honours Accept-Encoding: gzip; urllib does not auto-
            # decompress, so inflate when the response says it is gzipped.
            encoding = ""
            try:
                encoding = (resp_or_exc.headers.get("Content-Encoding") or "").lower()
            except Exception:
                encoding = ""
            if "gzip" in encoding:
                try:
                    raw_bytes = gzip.decompress(raw_bytes)
                except Exception:
                    pass
            return raw_bytes.decode("utf-8", errors="replace")


        def _request(http_method, url, apikey, secret, payload=None, params=None):
            if params:
                url += ("&" if "?" in url else "?") + urllib.parse.urlencode(params, doseq=True)
            signature, _ts = _signature(apikey, secret)
            headers = {
                "Api-key": apikey,
                "X-Signature": signature,
                "Accept": "application/json",
                "Accept-Encoding": "gzip",
            }
            body = None
            if payload is not None:
                headers["Content-Type"] = "application/json"
                body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
            req = urllib.request.Request(url, data=body, headers=headers, method=http_method)
            try:
                with urllib.request.urlopen(req, timeout=45) as resp:
                    raw = _decode_body(resp, resp.read())
                    return True, resp.status, json.loads(raw or "{}")
            except urllib.error.HTTPError as exc:
                raw = _decode_body(exc, exc.read())
                try:
                    parsed = json.loads(raw or "{}")
                except Exception:
                    parsed = {"raw": raw[:2000]}
                return False, exc.code, parsed
            except urllib.error.URLError as exc:
                return False, 0, {"error": str(getattr(exc, "reason", exc))}
            except Exception as exc:
                return False, 0, {"error": f"{type(exc).__name__}: {exc}"}

        # ── Keep our own copy of HotelBeds hotel content (noetl/travel#166) ──────
        # HotelBeds' Content API must not be called live per search; their guide
        # says to load the portfolio once, keep it, and refresh it daily with
        # `lastUpdateTime` (https://developer.hotelbeds.com/documentation/hotels/
        # content-api/how-use-content-api/). This step does that, a bounded slice
        # per run, into Firestore:
        #
        #   hotelbeds_content/{hotel code}   one document per hotel: a few plain
        #                                    fields plus `json`, the record below
        #   hotelbeds_content_sync/state     where the load stands (also `json`)
        #
        # mode "auto" (what the scheduled job runs, hourly): continue the full load
        # until it has covered every hotel, then fetch only what changed since the
        # last finished pass, at most once a day. "full" / "delta" force one; "codes" loads given codes.
        # Each run stops after max_pages pages or max_seconds, or at the first
        # HotelBeds refusal (e.g. a request quota), and saves where it got to, so
        # the next run continues from there.

        CONTENT_HOTELS_PATH = "/hotel-content-api/1.0/hotels"
        CONTENT_COLLECTION = "hotelbeds_content"
        STATE_DOC = "hotelbeds_content_sync/state"
        FIRESTORE_COMMIT_BATCH = 100
        DESCRIPTION_MAX = 2000


        def _content(value):
            """HotelBeds' {"content": "..."} text objects, or a plain string."""
            if isinstance(value, dict):
                return _text(value.get("content"))
            return _text(value)


        def _int_or_none(value):
            try:
                return int(value)
            except (TypeError, ValueError):
                return None


        def _float_or_none(value):
            try:
                return float(value)
            except (TypeError, ValueError):
                return None


        def content_record(hotel):
            """The part of a Content API hotel we keep: what search shows today
            (photos, rooms, reviews) and what adiona/frontend#62 item 3 and #95 need
            (address, city, contacts, facilities, nearby places, room occupancy)."""
            hotel = _as_dict(hotel)
            coords = _as_dict(hotel.get("coordinates"))
            lat, lng = _float_or_none(coords.get("latitude")), _float_or_none(coords.get("longitude"))
            record = {
                "code": _text(hotel.get("code")),
                "name": _content(hotel.get("name")),
                "city": _content(hotel.get("city")),
                "address": _content(hotel.get("address")),
                "postalCode": _text(hotel.get("postalCode")) or None,
                "countryCode": _text(hotel.get("countryCode")) or None,
                "stateCode": _text(hotel.get("stateCode")) or None,
                "destinationCode": _text(hotel.get("destinationCode")) or None,
                "zoneCode": _int_or_none(hotel.get("zoneCode")),
                "coordinates": {"lat": lat, "lng": lng} if lat is not None and lng is not None else None,
                "categoryCode": _text(hotel.get("categoryCode")) or None,
                "chainCode": _text(hotel.get("chainCode")) or None,
                "accommodationTypeCode": _text(hotel.get("accommodationTypeCode")) or None,
                "email": _text(hotel.get("email")) or None,
                "web": _text(hotel.get("web")) or None,
                "phones": [{"phoneNumber": _text(p.get("phoneNumber")), "phoneType": _text(p.get("phoneType")) or None}
                           for p in map(_as_dict, _as_list(hotel.get("phones"))) if _text(p.get("phoneNumber"))],
                "description": _content(hotel.get("description"))[:DESCRIPTION_MAX] or None,
                "images": [{k: img.get(k) for k in ("path", "imageTypeCode", "roomCode", "order", "visualOrder")
                            if img.get(k) not in (None, "")}
                           for img in map(_as_dict, _as_list(hotel.get("images"))) if _text(img.get("path"))],
                "reviews": [{k: r.get(k) for k in ("type", "rate", "reviewCount") if r.get(k) is not None}
                            for r in map(_as_dict, _as_list(hotel.get("reviews")))],
                "facilities": [dict({k: f.get(k) for k in ("facilityCode", "facilityGroupCode", "indYesOrNo", "indFee",
                                                           "indLogic", "number", "distance", "timeFrom", "timeTo")
                                     if f.get(k) is not None},
                                    **({"description": _content(f.get("description"))} if _content(f.get("description")) else {}))
                               for f in map(_as_dict, _as_list(hotel.get("facilities")))],
                "interestPoints": [{"poiName": _text(p.get("poiName")), "distance": _float_or_none(p.get("distance"))}
                                   for p in map(_as_dict, _as_list(hotel.get("interestPoints"))) if _text(p.get("poiName"))],
                "terminals": [{"terminalCode": _text(t.get("terminalCode")), "distance": _float_or_none(t.get("distance"))}
                              for t in map(_as_dict, _as_list(hotel.get("terminals"))) if _text(t.get("terminalCode"))],
                "rooms": [dict({k: room.get(k) for k in ("roomCode", "roomType", "characteristicCode", "minPax", "maxPax",
                                                         "maxAdults", "maxChildren")
                                if room.get(k) is not None},
                               facilities=[_content(f.get("description")) or _text(f.get("facilityCode"))
                                           for f in map(_as_dict, _as_list(room.get("roomFacilities")))
                                           if _content(f.get("description")) or _text(f.get("facilityCode"))])
                          for room in map(_as_dict, _as_list(hotel.get("rooms"))) if _text(room.get("roomCode"))],
                "lastUpdate": _text(hotel.get("lastUpdate")) or None,
            }
            return record


        def _fs_root(project, database):
            return "projects/%s/databases/%s/documents" % (project, database or "(default)")


        def _fs_call(method, url, token, body=None):
            data = json.dumps(body).encode("utf-8") if body is not None else None
            req = urllib.request.Request(url, data=data, method=method,
                                         headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
            try:
                with urllib.request.urlopen(req, timeout=30) as resp:
                    return resp.status, json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                return exc.code, {"error": exc.read().decode("utf-8", errors="replace")[:500]}


        def _fs_doc(root, path, record, extra):
            fields = {"json": {"stringValue": json.dumps(record, separators=(",", ":"), ensure_ascii=False)}}
            for key, value in extra.items():
                if value is not None:
                    fields[key] = {"stringValue": str(value)}
            return {"update": {"name": "%s/%s" % (root, path), "fields": fields}}


        def save_hotels(project, database, token, records, synced_at, source_env):
            """Write the records, FIRESTORE_COMMIT_BATCH per commit. Returns (written, error)."""
            root = _fs_root(project, database)
            written = 0
            for i in range(0, len(records), FIRESTORE_COMMIT_BATCH):
                chunk = records[i:i + FIRESTORE_COMMIT_BATCH]
                writes = [_fs_doc(root, "%s/%s" % (CONTENT_COLLECTION, r["code"]), r,
                                  {"code": r["code"], "city": r.get("city") or None, "countryCode": r.get("countryCode"),
                                   "destinationCode": r.get("destinationCode"), "lastUpdate": r.get("lastUpdate"),
                                   "synced_at": synced_at, "source_env": source_env})
                          for r in chunk if r.get("code")]
                if not writes:
                    continue
                status, body = _fs_call("POST", "https://firestore.googleapis.com/v1/%s:commit" % root, token, {"writes": writes})
                if not 200 <= status < 300:
                    return written, "firestore commit HTTP %s: %s" % (status, _text(_as_dict(body).get("error"))[:300])
                written += len(writes)
            return written, None


        def load_state(project, database, token):
            root = _fs_root(project, database)
            status, body = _fs_call("GET", "https://firestore.googleapis.com/v1/%s/%s" % (root, STATE_DOC), token)
            if status == 404:
                return {}
            if not 200 <= status < 300:
                raise RuntimeError("firestore state read HTTP %s" % status)
            raw = _as_dict(_as_dict(_as_dict(body).get("fields")).get("json")).get("stringValue")
            try:
                state = json.loads(raw) if raw else {}
            except ValueError:
                state = {}
            return state if isinstance(state, dict) else {}


        def save_state(project, database, token, state):
            root = _fs_root(project, database)
            write = _fs_doc(root, STATE_DOC, state, {"updated_at": state.get("last_run_at")})
            status, body = _fs_call("POST", "https://firestore.googleapis.com/v1/%s:commit" % root, token, {"writes": [write]})
            if not 200 <= status < 300:
                raise RuntimeError("firestore state write HTTP %s" % status)


        def run_sync(mode, state, fetch, save, today, now, codes=None, max_pages=20, page_size=500, max_seconds=240,
                     clock=None):
            """One bounded run. `fetch(params)` -> (ok, status, body) from the Content API;
            `save(records)` -> (written, error). Returns (new_state, report). Pure: no I/O
            of its own, so the tests drive it directly."""
            clock = clock or (lambda: 0.0)
            started = clock()
            state = dict(state or {})
            report = {"mode": mode, "pages": 0, "hotels": 0, "written": 0, "stopped": None, "error": None}

            if mode == "auto":
                mode = "delta" if state.get("full_completed_at") else "full"
                report["mode"] = "auto:" + mode
                # The job may run hourly so the first load finishes quickly; once
                # loaded, changes are fetched once a day, as HotelBeds asks.
                if mode == "delta" and state.get("delta_since") == today and not state.get("delta_next_from"):
                    report["stopped"], report["done"] = "already refreshed today", True
                    return state, report
            if mode == "codes":
                wanted = [c for c in (_text(c) for c in (codes or [])) if c][:1000]
                if not wanted:
                    report["error"] = "mode codes needs codes"
                    return state, report
                plan = {"key": None, "params": {"codes": ",".join(wanted)}, "from": 1}
            elif mode == "full":
                if not state.get("full_started_on"):
                    # The changes made while the full load runs are picked up by the
                    # first delta, which starts from the day the full load began.
                    state["full_started_on"] = today
                plan = {"key": "full_next_from", "params": {}, "from": int(state.get("full_next_from") or 1)}
            elif mode == "delta":
                since = state.get("delta_since") or state.get("full_started_on")
                if not since:
                    report["error"] = "no full load yet: run mode full first"
                    return state, report
                if not state.get("delta_run_on"):
                    state["delta_run_on"] = today
                plan = {"key": "delta_next_from", "params": {"lastUpdateTime": since}, "from": int(state.get("delta_next_from") or 1)}
            else:
                report["error"] = "unknown mode %r" % mode
                return state, report

            start = plan["from"]
            done = False
            while report["pages"] < max_pages:
                if clock() - started > max_seconds:
                    report["stopped"] = "time budget"
                    break
                params = dict(plan["params"], fields="all", language="ENG", useSecondaryLanguage="false",
                              **({"from": start, "to": start + page_size - 1} if mode != "codes" else {"from": 1, "to": 1000}))
                ok, status, body = fetch(params)
                if not ok:
                    report["stopped"] = "HotelBeds HTTP %s" % status
                    report["error"] = _text(_as_dict(body).get("error") or _as_dict(body).get("raw"))[:300] or None
                    break
                report["pages"] += 1
                hotels = _as_list(_as_dict(body).get("hotels"))
                records = [content_record(h) for h in hotels]
                records = [r for r in records if r["code"]]
                written, error = save(records)
                report["hotels"] += len(records)
                report["written"] += written
                if error:
                    report["stopped"], report["error"] = "firestore", error
                    break
                total = _int_or_none(_as_dict(body).get("total"))
                start += page_size
                if mode == "codes" or not hotels or (total is not None and start > total):
                    done = True
                    break
            else:
                report["stopped"] = "page budget"

            state["last_run_at"], state["last_report"] = now, dict(report)
            if plan["key"]:
                if done:
                    state.pop(plan["key"], None)
                    if mode == "full":
                        state["full_completed_at"] = now
                    else:
                        # The next delta asks for changes since this one started.
                        state["delta_since"] = state.pop("delta_run_on", today)
                else:
                    state[plan["key"]] = start
            report["done"] = done
            return state, report

        # ── The run ──────────────────────────────────────────────────────────────
        # Tests exec this code with _SYNC_LIBRARY_ONLY set and call run_sync directly.
        if not globals().get("_SYNC_LIBRARY_ONLY"):
            from datetime import datetime, timezone

            def _n(value, default, lo, hi):
                try:
                    return max(lo, min(int(value), hi))
                except (TypeError, ValueError):
                    return default

            _now = datetime.now(timezone.utc)
            _base = _text(hotelbeds_api_base).rstrip("/")
            _project, _database = _text(google_project), _text(firestore_database) or "(default)"
            _codes = codes if isinstance(codes, list) else [c for c in _text(codes).split(",") if c.strip()]
            try:
                apikey, secret = _secret_json(_project, _text(hotelbeds_secret_name))
                token = _metadata_token()
                prior = load_state(_project, _database, token)
                new_state, report = run_sync(
                    _text(mode) or "auto", prior,
                    fetch=lambda params: _request("GET", _base + CONTENT_HOTELS_PATH, apikey, secret, params=params),
                    save=lambda records: save_hotels(_project, _database, token, records, _now.isoformat(),
                                                     _text(hotelbeds_env) or "test"),
                    today=_now.date().isoformat(), now=_now.isoformat(), codes=_codes,
                    max_pages=_n(max_pages, 20, 1, 400), page_size=_n(page_size, 500, 1, 1000),
                    max_seconds=_n(max_seconds, 240, 10, 3000), clock=time.monotonic)
                if _text(mode) != "codes":
                    save_state(_project, _database, token, new_state)
                result = {"status": "ok" if not report.get("error") else "partial", "report": report,
                          "state": {k: v for k, v in new_state.items() if k != "last_report"}}
            except Exception as exc:  # noqa: BLE001 — report, never print credentials
                result = {"status": "error", "error": "%s: %s" % (type(exc).__name__, str(exc)[:300])}
            globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  - step: end
    desc: Return the run's report
    tool:
      kind: python
      input:
        sync: "{{ sync }}"
      code: |
        globals().update({"result": sync if isinstance(sync, dict) else {"status": "error", "error": "no sync result"}})
