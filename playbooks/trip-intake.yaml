                    xJeuU6iYc3RKeCKxOKZq/x9skm6R
        """

        AIRPORTS = []
        for _line in AIRPORTS_TABLE.strip().splitlines():
            _code, _name, _city, _region, _country, _lat, _lon = _line.strip().split("|")
            AIRPORTS.append({"code": _code, "name": _name, "city": _city, "region": _region, "country": _country,
                             "lat": float(_lat), "lon": float(_lon), "major": True, "large": True})
        BY_CODE = {a["code"]: a for a in AIRPORTS}
        ALL_AIRPORTS = list(AIRPORTS)
        for _line in zlib.decompress(base64.b64decode("".join(MORE_AIRPORTS_Z.split()))).decode("utf-8").splitlines():
            _code, _city, _region, _country, _lat, _lon, _size = _line.split("|")
            if _code not in BY_CODE:
                ALL_AIRPORTS.append({"code": _code, "name": _city, "city": _city, "region": _region,
                                     "country": _country, "lat": float(_lat), "lon": float(_lon), "major": False,
                                     "large": _size == "L"})
                BY_CODE[_code] = ALL_AIRPORTS[-1]
        CITY_CODES = {}
        for _a in AIRPORTS:
            CITY_CODES.setdefault(_a["city"].lower(), []).append(_a["code"])


        def _norm_place(text):
            """Lowercased, accents and punctuation folded: "São Paulo" -> "sao paulo"."""
            low = unicodedata.normalize("NFD", str(text or "")).encode("ascii", "ignore").decode("ascii").lower()
            return " ".join(re.sub(r"[-.']", " ", low).split())


        def _place_keys(city):
            """The names a municipality answers to: "Lihue, Kauai" -> lihue, kauai, lihue kauai;
            "Santorini Island" -> santorini island, santorini."""
            low = _norm_place(city)
            keys = {low, low.replace(",", "")}
            for part in low.split(","):
                part = part.strip()
                keys.add(part)
                keys.add(re.sub(r"\s+island$", "", part))
            return {k for k in keys if k}


        # Every airport by each name its city answers to (all airports, not only major),
        # and the names that are an island rather than the town: "Kauai" in "Lihue, Kauai",
        # "Santorini" in "Santorini Island".
        PLACE_CODES, ISLAND_KEYS, TOWN_KEYS = {}, set(), set()
        for _a in ALL_AIRPORTS:
            for _k in _place_keys(_a["city"]):
                PLACE_CODES.setdefault(_k, []).append(_a["code"])
            _parts = [p.strip() for p in _norm_place(_a["city"]).split(",")]
            TOWN_KEYS.add(_parts[0])
            ISLAND_KEYS.update(_parts[1:])
            ISLAND_KEYS.update(re.sub(r"\s+island$", "", p) for p in _parts if p.endswith(" island"))
        ISLAND_KEYS -= TOWN_KEYS

        # Form limits (the steppers in the two forms).
        HOTEL_MAX_ROOMS, HOTEL_MAX_ADULTS = 8, 16
        FLIGHT_MAX_ADULTS, MAX_CHILDREN, MAX_CHILD_AGE = 9, 8, 17
        # Coordinates resolve to the nearest known city within this distance; farther
        # than that we ask rather than guess.
        COORDS_CITY_KM = 50.0
        # A place with no airport of its own: offer the nearest airports within this
        # distance (large ones first), at most NEAREST_MAX of them.
        NEAREST_KM, NEAREST_MAX = 150.0, 3
        PLACE_KINDS = ("city", "hotel", "airport", "island", "region")

        INTENTS = ("hotel", "flight", "both")
        DATE_KEYS = ("start_date", "end_date", "depart_date", "return_date", "check_in", "check_out")
        STATE_KEYS = ("intent", "destination", "origin", "trip_type", "adults", "children_count",
                      "children_ages", "rooms", "latitude", "longitude", "radius", "hotel_area") + DATE_KEYS


        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str) and value.strip().startswith("{"):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except ValueError:
                    return {}
            return {}


        def _int(value, lo, hi):
            try:
                if isinstance(value, bool):
                    return None
                n = int(value)
            except (TypeError, ValueError):
                return None
            return n if lo <= n <= hi else None


        def _num(value):
            try:
                if isinstance(value, bool) or value is None:
                    return None
                n = float(value)
                return n if math.isfinite(n) else None
            except (TypeError, ValueError):
                return None


        def _iso(value):
            try:
                return date.fromisoformat(str(value)[:10]).isoformat()
            except (TypeError, ValueError):
                return None


        def _km(lat1, lon1, lat2, lon2):
            p1, p2 = math.radians(lat1), math.radians(lat2)
            dp, dl = p2 - p1, math.radians(lon2 - lon1)
            h = math.sin(dp / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(dl / 2) ** 2
            return 6371.0 * 2 * math.asin(math.sqrt(h))


        def nearest_city(lat, lon):
            best = min(AIRPORTS, key=lambda a: _km(lat, lon, a["lat"], a["lon"]))
            return best["city"] if _km(lat, lon, best["lat"], best["lon"]) <= COORDS_CITY_KM else None


        def _canonical_city(text):
            """A place the airport table knows: a major city in its own spelling, else
            (any airport's town or island) as the user wrote it."""
            codes = CITY_CODES.get(str(text or "").strip().lower())
            if codes:
                return BY_CODE[codes[0]]["city"]
            # Any airport's town or island, or a town narrowed down ("Portland, Maine").
            known = _norm_place(text) in PLACE_CODES or ("," in str(text) and len(_table_places(text)) == 1)
            return " ".join(str(text).split()) if known else None


        def _names_airport(text, code):
            """Whether `text` names airport `code` by its code or its name ("LHR",
            "Heathrow", "Heathrow Airport (LHR)"). The city alone does not: "London"
            does not pick one of London's airports."""
            a = BY_CODE.get(code) or {}
            low = str(text or "").lower()
            short = re.sub(r"\b(international|airport)\b", "", a.get("name", "").lower()).strip()
            return bool(re.search(r"\b%s\b" % code.lower(), low)) or (len(short) >= 4 and short in low)


        def airport_city(text):
            """The city of an airport named in `text` by code ("JFK", "Heathrow (LHR)") or name."""
            t = str(text or "")
            for code in re.findall(r"\b([A-Za-z]{3})\b", t):
                if code.upper() in BY_CODE:
                    return BY_CODE[code.upper()]["city"]
            low = t.lower()
            for a in AIRPORTS:
                name = a["name"].lower()
                if name in low or (name.replace(" airport", "").replace(" international", "") in low and len(name) > 8):
                    return a["city"]
            return None


        def _valid_codes(codes):
            out = []
            for c in codes if isinstance(codes, list) else []:
                c = str(c or "").strip().upper()
                if c in BY_CODE and c not in out:
                    out.append(c)
            return out


        def _majors_first(codes):
            """A city's major airports when it has any ("London" stays LHR/LGW/STN), else all."""
            major = [c for c in codes if BY_CODE[c]["major"]]
            return major or codes


        # Where the state is how people tell towns apart ("Portland, Oregon").
        BY_REGION = ("United States", "Canada", "Australia")


        def _label(a, full=False):
            """ "Portland, Oregon", "San José, Costa Rica": a town told apart from its
            namesakes (full: with both region and country, when the short ones clash)."""
            town = a["city"].split(",")[0].strip()
            if full and a["region"]:
                return "%s, %s, %s" % (town, a["region"], a["country"])
            return "%s, %s" % (town, a["region"] if a["country"] in BY_REGION and a["region"] else a["country"])


        def _same_name_places(codes):
            """The places a name's airports serve: airports within 100 km of each other
            serve one place (London's six), farther apart are namesakes (Portland, Oregon
            and Portland, Maine)."""
            places = []
            for c in codes:
                a = BY_CODE[c]
                here = next((p for p in places if _km(p["lat"], p["lon"], a["lat"], a["lon"]) <= 100), None)
                if here is None:
                    places.append({"label": _label(a), "airports": [c], "lat": a["lat"], "lon": a["lon"]})
                else:
                    here["airports"].append(c)
            for p in places:
                p["airports"] = _majors_first(p["airports"])
            # Beside a city with a major airport, only a namesake with a large airport of
            # its own is a real alternative: Portland, Maine (PWM) is; London, Ontario
            # (a regional airport) is not.
            if any(BY_CODE[c]["major"] for p in places for c in p["airports"]):
                places = [p for p in places if any(BY_CODE[c]["major"] or BY_CODE[c]["large"] for c in p["airports"])]
            labels = [p["label"] for p in places]
            for p in places:
                if labels.count(p["label"]) > 1:
                    p["label"] = _label(BY_CODE[p["airports"][0]], full=True)
            # The best-known first: a place with a major airport, then by airport count.
            places.sort(key=lambda p: (not any(BY_CODE[c]["major"] for c in p["airports"]), -len(p["airports"])))
            return places


        def _table_places(text):
            """The places the airport table knows by this name. "Portland, Maine" or
            "Portland Maine" narrows Portland to the one in Maine."""
            key = _norm_place(text)
            if key in PLACE_CODES:
                return _same_name_places(PLACE_CODES[key])
            words = key.replace(",", " ").split()
            for n in range(len(words) - 1, 0, -1):
                town, qualifier = " ".join(words[:n]), " ".join(words[n:])
                if town in PLACE_CODES:
                    places = [p for p in _same_name_places(PLACE_CODES[town])
                              if qualifier in _norm_place(p["label"].split(",", 1)[1])
                              or any(qualifier in _norm_place(BY_CODE[c]["country"]) for c in p["airports"])]
                    if places:
                        return places
            return []


        def nearest_airports(lat, lon):
            """The airports nearest a place with none of its own: large ones within
            NEAREST_KM first, then any, nearest first."""
            near = sorted((_km(lat, lon, a["lat"], a["lon"]), a["code"]) for a in ALL_AIRPORTS)
            near = [c for d, c in near if d <= NEAREST_KM]
            large = [c for c in near if BY_CODE[c]["large"]]
            return (large or near)[:NEAREST_MAX]


        def place_kind(place):
            """city | hotel | airport | island | region: the reader's word, or an island the
            airport table knows ("Kauai" in "Lihue, Kauai")."""
            place = _as_dict(place)
            kind = place.get("kind") if place.get("kind") in PLACE_KINDS else "city"
            if kind == "city" and _norm_place(place.get("text")) in ISLAND_KEYS:
                return "island"
            return kind


        def resolve_place(place):
            """What a destination or origin the user gave resolves to:

              code      one airport                       ("Munich" -> MUC, "Kauai" -> LIH)
              options   several to choose from            ("Big Island" -> KOA, ITO)
              nearest   True when options are the nearest airports to a place without one
              matches   namesakes to choose from          ("Portland" -> Oregon, Maine)
              islands   the islands of a region           ("Hawaii" -> Oahu, Maui, ...)

            and nothing at all when we don't know it (asked as "which airport?"). Codes
            are only ever those in the airport table."""
            place = _as_dict(place)
            out = {"code": None, "options": [], "nearest": False, "matches": [], "islands": []}
            text = str(place.get("text") or "").strip()

            def codes(found):
                if len(found) == 1:
                    out["code"] = found[0]
                else:
                    out["options"] = found
                return out

            if place.get("code") in BY_CODE:
                out["code"] = place["code"]
                return out
            if re.fullmatch(r"[A-Za-z]{3}", text) and text.upper() in BY_CODE \
                    and (text.isupper() or BY_CODE[text.upper()]["major"] or place.get("kind") == "airport"):
                out["code"] = text.upper()
                return out
            lat, lon = _num(place.get("lat")), _num(place.get("lon"))
            coords = lat is not None and lon is not None and -90 <= lat <= 90 and -180 <= lon <= 180
            if place.get("resolved"):
                # A namesake or island the user picked: its airports, else the nearest.
                if _valid_codes(place.get("airports")):
                    return codes(_valid_codes(place.get("airports")))
                if coords and nearest_airports(lat, lon):
                    out["nearest"] = True
                    return codes(nearest_airports(lat, lon))
            islands = [i for i in (place.get("islands") or []) if isinstance(i, dict) and i.get("name")]
            if place.get("kind") == "region" and len(islands) > 1:
                out["islands"] = islands
                return out
            table = _table_places(text)
            if len(table) > 1:
                out["matches"] = table
                return out
            model = [m for m in (place.get("matches") or []) if isinstance(m, dict) and m.get("label")
                     and (_valid_codes(m.get("airports")) or (_num(m.get("lat")) is not None and _num(m.get("lon")) is not None))]
            if not table and len(model) > 1:
                out["matches"] = [{"label": m["label"], "airports": _valid_codes(m.get("airports")),
                                   "lat": _num(m.get("lat")), "lon": _num(m.get("lon"))} for m in model]
                return out
            if table:
                return codes(table[0]["airports"])
            if _valid_codes(place.get("airports")):
                return codes(_valid_codes(place.get("airports")))
            if coords and nearest_airports(lat, lon):
                out["nearest"] = True
                return codes(nearest_airports(lat, lon))
            return out


        # ── Reading the user's words ─────────────────────────────────────────────
        # Both readers return the same patch shape; a key is present only when the
        # user said it in THIS message.
        #
        #   intent            hotel | flight | both
        #   destination       {"text", "kind": city | hotel | airport | island | region,
        #                      and, from the model only: "lat", "lon", "airports",
        #                      "islands" (a region's), "matches" (a name's namesakes)}
        #   origin            the same, without "hotel"
        #   hotel_area        {"text"}: where to stay on an island, when asked
        #   start_date/end_date                 dates given for the trip as a whole
        #   depart_date/return_date/check_in/check_out   dates given for one form
        #   trip_type         one_way | round_trip
        #   adults, children_count, children_ages, rooms, radius
        #   airport_code      the answer to "which airport?"

        LLM_SYSTEM_PROMPT = (
            "You read ONE message from a traveller who is filling in a flight and/or hotel "
            "search. Return JSON only: an object holding ONLY what this message states. "
            "Never guess, never fill defaults, never carry values over from the state you are "
            "shown. Omit every key the message does not state.\n"
            "Keys:\n"
            '  intent: "hotel" | "flight" | "both" (only if the message says what they want)\n'
            '  destination: {"text": place as written, "kind": "city" | "hotel" | "airport" | "island" | "region"} '
            '("hotel" when they name a specific property)\n'
            '  origin: {"text": place as written, "kind": "city" | "airport" | "island" | "region"}\n'
            "  For a destination or origin that is a place (not a hotel, not an airport), also add what "
            "you know about the place itself (this is knowledge, not something the message must state):\n"
            '    "lat", "lon": its approximate centre;\n'
            '    "airports": IATA code(s) of the airport(s) with scheduled passenger flights ON the island or IN '
            'the city itself; [] if it has none of its own (e.g. "Napa": [], nearby airports are found '
            "separately). Usually ONE: the primary airport. Give more than one only when travellers really "
            "choose between several airports with substantial mainline service "
            '(e.g. "Big Island": ["KOA", "ITO"]). Leave out small regional, commuter or inter-island airports '
            '(e.g. "Maui": ["OGG"], not JHM or HNM);\n'
            '    "islands": for a region or island group, its main islands as [{"name", "airports"}];\n'
            '    "matches": only when the name, as written, is used by several well-known places '
            '(e.g. "Portland": Oregon and Maine), each as {"label": "Portland, Oregon", "airports", "lat", "lon"}.\n'
            '    "corrected": the correct name of the place when the text is misspelled ("Barcelonna" -> "Barcelona");\n'
            '    "exists": false only when the text names no real place at all.\n'
            '  kind is "island" for an island ("Maui", "Kauai", "Big Island", "Mallorca", "Santorini") and '
            '"region" for a state, region or island group ("Hawaii" alone means the state, a region).\n'
            '  hotel_area: {"text": the city or area to stay in}, only when `awaiting` has hotel_area\n'
            '  confirm: true | false, only when `awaiting` has origin_confirm: whether they accept the '
            'departure airport they were asked about (a different place is an origin, not a confirm)\n'
            "  start_date, end_date: YYYY-MM-DD, trip dates not tied to flight or hotel\n"
            "  depart_date, return_date: YYYY-MM-DD, explicitly flight dates\n"
            "  check_in, check_out: YYYY-MM-DD, explicitly hotel dates\n"
            '  trip_type: "one_way" | "round_trip" (only if stated)\n'
            "  adults: integer; children_count: integer; children_ages: [integers]\n"
            "  rooms: integer; radius: number in km\n"
            '  airport_code: 3-letter code when they pick one of the offered airports\n'
            "Resolve relative dates (\"next Friday\", \"for 3 nights\") against `today`. A bare "
            "answer (\"2\", \"Paris\", a date) answers the fields listed in `awaiting`. "
            "\"No kids\" is children_count 0. \"Me and my wife\" is adults 2. Output intent only when "
            "the message says what the traveller wants to book; a message that merely mentions flying "
            "or staying is not an intent."
        )


        def _vertex_token():
            url = ("http://metadata.google.internal/computeMetadata/v1/instance/"
                   "service-accounts/default/token?scopes="
                   + urllib.parse.quote("https://www.googleapis.com/auth/cloud-platform", safe=""))
            req = urllib.request.Request(url, headers={"Metadata-Flavor": "Google"})
            with urllib.request.urlopen(req, timeout=10) as resp:
                return json.loads(resp.read().decode("utf-8"))["access_token"]


        def llm_read(text, state, awaiting, today, model, project, region):
            host = "aiplatform.googleapis.com" if region == "global" else region + "-aiplatform.googleapis.com"
            endpoint = ("https://%s/v1/projects/%s/locations/%s/publishers/google/models/%s:generateContent"
                        % (host, project, region, model))
            body = json.dumps({
                "systemInstruction": {"parts": [{"text": LLM_SYSTEM_PROMPT}]},
                "contents": [{"role": "user", "parts": [{"text": json.dumps({
                    "message": text, "awaiting": awaiting, "today": today.isoformat(),
                    "state": {k: state.get(k) for k in STATE_KEYS if state.get(k) not in (None, [])},
                }, default=str)}]}],
                "generationConfig": {"temperature": 0, "responseMimeType": "application/json"},
            }).encode("utf-8")
            req = urllib.request.Request(endpoint, data=body, method="POST", headers={
                "Authorization": "Bearer %s" % _vertex_token(), "Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=25) as resp:
                payload = json.loads(resp.read().decode("utf-8"))
            cands = payload.get("candidates") or []
            if not cands:
                raise ValueError("vertex returned no candidates")
            parts = (cands[0].get("content") or {}).get("parts") or []
            return json.loads("".join(p.get("text", "") for p in parts))


        MONTHS = {m: i + 1 for i, m in enumerate(
            ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"])}
        NUMBER_WORDS = {"one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6,
                        "seven": 7, "eight": 8, "nine": 9, "a": 1, "an": 1, "single": 1}


        def _n(token):
            token = token.lower()
            return int(token) if token.isdigit() else NUMBER_WORDS.get(token)


        def _dates_in(text, today):
            found = []
            for m in re.finditer(r"\b(\d{4}-\d{2}-\d{2})\b", text):
                if _iso(m.group(1)):
                    found.append((m.start(), _iso(m.group(1))))
            for m in re.finditer(r"\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b",
                                 text, re.I):
                month, day = MONTHS[m.group(1).lower()], int(m.group(2))
                for year in (today.year, today.year + 1):
                    try:
                        d = date(year, month, day)
                    except ValueError:
                        break
                    if d >= today:
                        found.append((m.start(), d.isoformat()))
                        break
            return [d for _, d in sorted(found)]


        def _place_after(text, cue):
            """The known city or airport code right after `cue` ("from", "to", "in"):
            the longest run of capitalised words that names one, else None."""
            for m in re.finditer(r"\b(?i:" + cue + r")\s+([A-Z][\w'.-]*(?:,?\s+[A-Z][\w'.-]*){0,3})", text):
                words = m.group(1).split()
                for n in range(len(words), 0, -1):
                    cand = " ".join(words[:n]).strip(".,")
                    if _canonical_city(cand) or (len(cand) == 3 and cand.upper() == cand and cand in BY_CODE):
                        return cand
            return None


        def rule_read(text, state, awaiting, today):
            """A deterministic reader for when the model is unavailable (and for tests).
            It understands codes, ISO and "Nov 2" dates, counts and the common phrasings;
            anything else is left for a question, never guessed."""
            t = " ".join(str(text or "").split())
            low = t.lower()
            out = {}
            wants_hotel = bool(re.search(r"\b(hotels?|stay|rooms?|check[- ]?in)\b", low))
            wants_flight = bool(re.search(r"\b(flights?|fly|flying|airport)\b", low))
            current = state.get("intent")
            if not current:
                if re.search(r"\bboth\b", low) or (wants_hotel and wants_flight):
                    out["intent"] = "both"
                elif wants_hotel:
                    out["intent"] = "hotel"
                elif wants_flight:
                    out["intent"] = "flight"
            else:
                # Once known, the intent changes only when the user says so: mentioning
                # "a room" while answering is not a switch to hotel-only.
                adding = re.search(r"\b(also|too|as well|and a|plus)\b", low)
                if re.search(r"\bboth\b", low) or (adding and ((current == "hotel" and wants_flight)
                                                                  or (current == "flight" and re.search(r"\bhotels?\b", low)))):
                    out["intent"] = "both"
            if re.search(r"\b(just|only)( a| the)? hotels?\b", low):
                out["intent"] = "hotel"
            if re.search(r"\b(just|only)( a| the)? flights?\b", low):
                out["intent"] = "flight"

            hotel_name = re.search(r"\b((?:Hotel|The)\s+[A-Z][\w'-]*(?:[\s-][A-Z][\w'-]*)*|[A-Z][\w'-]*(?:\s+[A-Z][\w'-]*)*\s+Hotel)\b", t)
            if hotel_name:
                # A month or weekday ends a name: "Hotel Nov 1 to ..." names no hotel.
                words = []
                for w in hotel_name.group(1).split():
                    if re.fullmatch(r"(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?", w.lower()):
                        break
                    words.append(w)
                name = " ".join(words)
                if len(words) >= 2 and not _canonical_city(name):
                    out["destination"] = {"text": name, "kind": "hotel"}

            codes = [c for c in re.findall(r"\b([A-Z]{3})\b", t) if c in BY_CODE]
            frm = _place_after(t, "from")
            to = _place_after(t, "to") or _place_after(t, "in")
            if frm:
                out["origin"] = {"text": frm, "kind": "airport" if frm in BY_CODE else "city"}
            if to and "destination" not in out:
                out["destination"] = {"text": to, "kind": "airport" if to in BY_CODE else "city"}
            if "destination" not in out and "origin" not in out:
                city = next((a["city"] for a in AIRPORTS if re.search(r"\b%s\b" % re.escape(a["city"].lower()), low)), None)
                if city:
                    out["destination"] = {"text": city, "kind": "city"}
                elif len(codes) == 1 and "airport" in (awaiting or []):
                    out["airport_code"] = codes[0]

            if re.search(r"\bone[- ]way\b", low):
                out["trip_type"] = "one_way"
            elif re.search(r"\bround[- ]?trip\b|\breturn(ing)?\b", low):
                out["trip_type"] = "round_trip"

            m = re.search(r"\b(\d+|one|two|three|four|five|six|seven|eight|nine|a|an|single)\s+adults?\b", low)
            if m:
                out["adults"] = _n(m.group(1))
            m = re.search(r"\b(\d+|one|two|three|four|five|six|seven|eight|nine|a|an|single)\s+(rooms?)\b", low)
            if m:
                out["rooms"] = _n(m.group(1))
            if re.search(r"\bno (kids|children)\b|\bwithout (kids|children)\b", low):
                out["children_count"], out["children_ages"] = 0, []
            else:
                m = re.search(r"\b(\d+|one|two|three|four|five|six|seven|eight|a|an)\s+(children|child|kids?)\b", low)
                if m:
                    out["children_count"] = _n(m.group(1))
                # An age is a number NOT followed by a counted noun ("aged 8, 1 room" is one age).
                age = r"\d{1,2}(?!\d|\s*(?:rooms?|adults?|nights?|km|kids?|child|children|days?|weeks?)\b)"
                ages = re.search(r"\bages?d?\s+(" + age + r"(?:\s*(?:,|and|&)\s*" + age + r")*)", low) \
                    or re.search(r"\b(?:kids?|children|child)\s*(?:\(|,|:)?\s*(" + age + r"(?:\s*(?:,|and|&)\s*" + age + r")*)\b(?!\s*(?:adults?|rooms?))", low) \
                    or re.search(r"\b(" + age + r"(?:\s*(?:,|and|&)\s*" + age + r")*)\s*(?:years?|yrs?)[- ]old\b", low)
                if ages:
                    out["children_ages"] = [int(x) for x in re.findall(r"\d{1,2}", ages.group(1))]
            m = re.search(r"\bwithin\s+(\d+(?:\.\d+)?)\s*(?:km|kilomet)", low)
            if m:
                out["radius"] = float(m.group(1))

            dates = _dates_in(t, today)
            m = re.search(r"\bfor\s+(\d+|one|two|three|four|five|six|seven|eight|nine)\s+nights?\b", low)
            if dates and m and len(dates) == 1:
                dates.append((date.fromisoformat(dates[0]) + timedelta(days=_n(m.group(1)))).isoformat())
            awaiting = list(awaiting or [])
            has_start = any(state.get(k) for k in ("start_date", "depart_date", "check_in"))
            if len(dates) == 1 and "return_date" in awaiting:
                out["return_date"] = dates[0]
            elif len(dates) == 1 and "dates" in awaiting and has_start and not re.search(r"check[- ]?in", low):
                out["end_date"] = dates[0]
            elif dates:
                if re.search(r"check[- ]?in", low) or re.search(r"check[- ]?out", low):
                    out["check_in"] = dates[0]
                    if len(dates) > 1:
                        out["check_out"] = dates[1]
                else:
                    out["start_date"] = dates[0]
                    if len(dates) > 1:
                        out["end_date"] = dates[1]

            # A bare reply answers what was asked.
            bare = re.fullmatch(r"(\d+|one|two|three|four|five|six|seven|eight|nine)", low.strip(" ."))
            if bare and awaiting:
                n = _n(bare.group(1))
                for field in awaiting:
                    if field in ("adults", "rooms") and field not in out and not (field == "adults" and state.get("adults")):
                        out[field] = n
                        break
                    if field == "children_ages" and "children_ages" not in out:
                        out["children_ages"] = [n]
                        break
            if "children_ages" in awaiting and "children_ages" not in out:
                nums = re.findall(r"\b\d{1,2}\b", low)
                if nums and not dates and "adults" not in out and "rooms" not in out:
                    out["children_ages"] = [int(x) for x in nums]
            if "airport" in awaiting and codes and "airport_code" not in out:
                out["airport_code"] = codes[0]
            if "origin" in awaiting and "airport" not in awaiting and "origin" not in out and t and not dates and not bare:
                place = t.strip(" .")
                if _canonical_city(place) or place.upper() in BY_CODE:
                    if _as_dict(out.get("destination")).get("text") == place:
                        out.pop("destination", None)
                    out["origin"] = {"text": place.upper() if place.upper() in BY_CODE else place,
                                     "kind": "airport" if place.upper() in BY_CODE else "city"}
            if "hotel_area" in awaiting and "hotel_area" not in out and "origin" not in out and t and not dates and not bare:
                place = re.sub(r"^(in|near|around|at)\s+", "", t.strip(" ."), flags=re.I)
                if 1 <= len(place.split()) <= 6:
                    out["hotel_area"] = {"text": place}
            if "destination" in awaiting and "airport" not in awaiting and "hotel_area" not in awaiting \
                    and "destination" not in out and "origin" not in out and t and not dates and not bare:
                place = t.strip(" .")
                if 1 <= len(place.split()) <= 5 and not re.search(r"\b(hotel|flight|both)s?\b", low):
                    out["destination"] = {"text": place, "kind": "airport" if place.upper() in BY_CODE else "city"}
            if "children" in awaiting and "children_count" not in out and "children_ages" not in out:
                if re.search(r"^\s*(no|none|nope|just (us|me|adults)|only adults)\b|\bno (kids|children)\b", low):
                    out["children_count"], out["children_ages"] = 0, []
            if "trip_type" in awaiting and "trip_type" not in out:
                if re.search(r"\bone\b", low):
                    out["trip_type"] = "one_way"
                elif re.search(r"\bround\b|\bback\b", low):
                    out["trip_type"] = "round_trip"
            if "intent" in awaiting and "intent" not in out:
                if re.search(r"\bboth\b", low):
                    out["intent"] = "both"
            return out


        NARROW_RE = re.compile(
            r"\b(just|only|instead)\b.{0,20}\b(hotels?|flights?|stay)\b"
            r"|\b(no|without|skip|drop|cancel|don.?t need|do not need|no longer need)\b.{0,20}\b(hotels?|flights?)\b", re.I)


        def resolve_intent(current, proposed, text):
            """Combine the trip's intent with what this message proposes.

            A model reading "I am flying from San Francisco" proposes `flight`; on a
            `both` trip that must not drop the hotel (adiona/frontend#55: "both" came
            back with the flight form only). So: the first intent is taken as given;
            asking for the other half makes the trip `both`; a trip is narrowed only by
            an explicit "just the hotel" / "no flight"."""
            if proposed not in INTENTS:
                return current
            if current not in INTENTS or proposed == current:
                return proposed
            if NARROW_RE.search(text or ""):
                return proposed
            return "both"


        def _place_facts(place):
            """What the model knows about a place (coordinates, airports, a region's
            islands, a name's namesakes), kept only when well-formed. Codes are checked
            against the airport table later, in resolve_place."""
            out = {}
            lat, lon = _num(place.get("lat")), _num(place.get("lon"))
            if lat is not None and lon is not None and -90 <= lat <= 90 and -180 <= lon <= 180:
                out["lat"], out["lon"] = round(lat, 4), round(lon, 4)

            def codes(value):
                return [str(c).strip().upper() for c in (value if isinstance(value, list) else [])
                        if re.fullmatch(r"[A-Za-z]{3}", str(c).strip())][:6]

            if isinstance(place.get("airports"), list):
                out["airports"] = codes(place["airports"])
            islands = []
            for i in place.get("islands") if isinstance(place.get("islands"), list) else []:
                name = " ".join(str(_as_dict(i).get("name") or "").split())[:60]
                if name:
                    islands.append({"name": name, "airports": codes(_as_dict(i).get("airports"))})
            if islands:
                out["islands"] = islands[:12]
            matches = []
            for m in place.get("matches") if isinstance(place.get("matches"), list) else []:
                m = _as_dict(m)
                label = " ".join(str(m.get("label") or "").split())[:80]
                if label:
                    match = {"label": label, "airports": codes(m.get("airports"))}
                    mlat, mlon = _num(m.get("lat")), _num(m.get("lon"))
                    if mlat is not None and mlon is not None and -90 <= mlat <= 90 and -180 <= mlon <= 180:
                        match["lat"], match["lon"] = round(mlat, 4), round(mlon, 4)
                    matches.append(match)
            if len(matches) > 1:
                out["matches"] = matches[:6]
            corrected = " ".join(str(place.get("corrected") or "").split())[:80]
            if corrected:
                out["corrected"] = corrected
            if place.get("exists") is False:
                out["exists"] = False
            return out


        def clean_patch(raw):
            """Keep only well-formed keys of a reader's output (the model's included)."""
            raw = _as_dict(raw)
            out = {}
            if raw.get("intent") in INTENTS:
                out["intent"] = raw["intent"]
            for key, kinds in (("destination", PLACE_KINDS), ("origin", ("city", "airport", "island", "region"))):
                place = _as_dict(raw.get(key))
                text = " ".join(str(place.get("text") or "").split())[:120]
                if text:
                    out[key] = dict({"text": text, "kind": place.get("kind") if place.get("kind") in kinds else "city"},
                                    **_place_facts(place))
            if isinstance(raw.get("confirm"), bool):
                out["confirm"] = raw["confirm"]
            area = raw.get("hotel_area")
            area = " ".join(str(_as_dict(area).get("text") if isinstance(area, dict) else area or "").split())[:120]
            if area:
                out["hotel_area"] = {"text": area}
            for key in DATE_KEYS:
                if raw.get(key) and _iso(raw.get(key)):
                    out[key] = _iso(raw[key])
            if raw.get("trip_type") in ("one_way", "round_trip"):
                out["trip_type"] = raw["trip_type"]
            for key, lo, hi in (("adults", 0, 99), ("rooms", 0, 99), ("children_count", 0, 99)):
                if raw.get(key) is not None and _int(raw.get(key), lo, hi) is not None:
                    out[key] = _int(raw[key], lo, hi)
            if isinstance(raw.get("children_ages"), list):
                ages = [_int(a, -99, 999) for a in raw["children_ages"]]
                if all(a is not None for a in ages):
                    out["children_ages"] = ages
            if _num(raw.get("radius")) is not None:
                out["radius"] = _num(raw["radius"])
            code = str(raw.get("airport_code") or "").strip().upper()
            if code:
                out["airport_code"] = code
            return out


        # ── Merging and validating ───────────────────────────────────────────────

        def coords_from(payload):
            payload = _as_dict(payload)
            for src in (payload, _as_dict(payload.get("submitted_value")), _as_dict(payload.get("value")),
                        _as_dict(payload.get("location"))):
                lat = _num(src.get("latitude", src.get("lat")))
                lon = _num(src.get("longitude", src.get("lng", src.get("lon"))))
                if lat is not None and lon is not None and -90 <= lat <= 90 and -180 <= lon <= 180:
                    return lat, lon
            return None


        def merge(state, patch, coords, awaiting):
            """Apply one turn's patch. The latest value wins (corrections); a changed place
            drops its old airport choice. Returns the changed keys."""
            s = state
            changed = []

            def put(key, value):
                if s.get(key) != value:
                    s[key] = value
                    changed.append(key)

            if "intent" in patch:
                put("intent", patch["intent"])
            for key in ("origin", "destination"):
                if key in patch:
                    place = dict(patch[key], typed=True)
                    if _as_dict(s.get(key)).get("text") != place["text"] or _as_dict(s.get(key)).get("kind") != place["kind"]:
                        put(key, place)
                        s.pop(key + "_code", None)
                        if key == "destination":
                            for k in ("latitude", "longitude", "radius", "destination_airport_place", "hotel_area"):
                                s.pop(k, None)
            if "airport_code" in patch:
                target = next((k for k in ("destination", "origin") if s.get(k + "_options")), None)
                if target and patch["airport_code"] in s[target + "_options"]:
                    put(target + "_code", patch["airport_code"])
            if coords and not (s.get("destination") or {}).get("kind") == "hotel":
                put("latitude", coords[0])
                put("longitude", coords[1])
                if not s.get("destination"):
                    city = nearest_city(*coords)
                    if city:
                        put("destination", {"text": city, "kind": "city", "typed": False, "from_coords": True})
            for key in DATE_KEYS + ("trip_type", "adults", "rooms", "radius", "hotel_area"):
                if key in patch:
                    put(key, patch[key])
            if patch.get("trip_type") == "one_way":
                s.pop("return_date", None)
            if "children_ages" in patch:
                put("children_ages", patch["children_ages"])
                put("children_count", len(patch["children_ages"]))
            elif "children_count" in patch:
                put("children_count", patch["children_count"])
                ages = s.get("children_ages") or []
                if len(ages) != patch["children_count"]:
                    put("children_ages", ages[:patch["children_count"]] if len(ages) > patch["children_count"] else None)
            if s.get("children_count") == 0:
                s["children_ages"] = []
            if (s.get("destination") or {}).get("kind") == "hotel":
                for k in ("latitude", "longitude"):
                    s.pop(k, None)
            return changed


        def wants(state, form):
            return state.get("intent") in (form, "both")


        def effective(state):
            """The per-form values: a form-specific date wins over a trip-wide one."""
            s = state
            # Hotel and flight dates fill each other ("same dates as my flight"): the
            # trip's details are shared, so a stay defaults to the flight's dates and a
            # flight to the stay's, unless the user gave each its own.
            e = {
                "depart": s.get("depart_date") or s.get("start_date") or s.get("check_in"),
                "return": s.get("return_date") or s.get("end_date") or s.get("check_out"),
                "check_in": s.get("check_in") or s.get("start_date") or s.get("depart_date"),
                "check_out": s.get("check_out") or s.get("end_date") or s.get("return_date"),
            }
            e["trip_type"] = s.get("trip_type") or ("round_trip" if wants(s, "flight") and e["return"] else None)
            return e


        def validate(state, today):
            """Clear every invalid value and say why, so it is asked again."""
            s, problems = state, []

            def drop(keys, message):
                for k in keys:
                    s.pop(k, None)
                problems.append(message)

            for key in DATE_KEYS:
                if s.get(key) and s[key] < today.isoformat():
                    drop([key], "%s is in the past." % _human_date(s[key]))
            e = effective(s)
            if wants(s, "flight") and e["trip_type"] == "round_trip" and e["depart"] and e["return"] and e["return"] < e["depart"]:
                drop(["return_date"] if s.get("return_date") else ["end_date"],
                     "The return date can't be before the departure date.")
            e = effective(s)
            if wants(s, "hotel") and e["check_in"] and e["check_out"] and e["check_out"] <= e["check_in"]:
                drop(["check_out"] if s.get("check_out") else ["end_date"],
                     "Check-out has to be after check-in.")
            max_adults = FLIGHT_MAX_ADULTS if wants(s, "flight") else HOTEL_MAX_ADULTS
            if s.get("adults") is not None and not 1 <= s["adults"] <= max_adults:
                drop(["adults"], "I can search for 1 to %d adults." % max_adults)
            if s.get("rooms") is not None and not 1 <= s["rooms"] <= HOTEL_MAX_ROOMS:
                drop(["rooms"], "I can search for 1 to %d rooms." % HOTEL_MAX_ROOMS)
            if wants(s, "hotel") and s.get("rooms") and s.get("adults") and s["rooms"] > s["adults"]:
                drop(["rooms"], "Each room needs at least one adult.")
            if s.get("children_count") is not None and not 0 <= s["children_count"] <= MAX_CHILDREN:
                drop(["children_count", "children_ages"], "I can include up to %d children." % MAX_CHILDREN)
            if s.get("children_ages") and any(not 0 <= a <= MAX_CHILD_AGE for a in s["children_ages"]):
                drop(["children_ages"], "Children's ages are 0 to %d." % MAX_CHILD_AGE)
            if s.get("radius") is not None and not 0 < s["radius"] <= 500:
                drop(["radius"], "The search radius should be between 1 and 500 km.")
            return problems


        def _flight_place(state, key):
            """The place a flight goes to/from: for a named hotel, the city or airport the
            user gave for it (never the hotel's own name)."""
            place = state.get(key)
            if key == "destination" and _as_dict(place).get("kind") == "hotel":
                return state.get("destination_airport_place")
            return place


        def resolve_places(state):
            """Resolve the destination and origin (resolve_place). A flight needs airport
            codes; any trip needs a namesake or a region's island picked, since a hotel
            can't be searched in "Portland" or "Hawaii" either. Sets <place>_code, or
            <place>_options / _matches / _islands (and _nearest) when we must ask."""
            s, notes = state, []
            for key in ("origin", "destination"):
                for suffix in ("_options", "_matches", "_islands", "_nearest"):
                    s.pop(key + suffix, None)
                place = _flight_place(s, key)
                if not place or (key == "origin" and not wants(s, "flight")):
                    continue
                if _as_dict(place).get("kind") == "hotel" or s.get(key + "_code") in BY_CODE:
                    continue
                found = resolve_place(place)
                if found["matches"]:
                    s[key + "_matches"] = found["matches"]
                elif found["islands"]:
                    s[key + "_islands"] = found["islands"]
                elif not wants(s, "flight"):
                    continue
                elif found["code"]:
                    s[key + "_code"] = found["code"]
                elif found["options"]:
                    s[key + "_options"] = found["options"]
                    if found["nearest"]:
                        s[key + "_nearest"] = True
            return notes


        def _island(state):
            """The island the trip goes to, when the destination is one."""
            d = _as_dict(state.get("destination"))
            return d if d.get("text") and place_kind(d) == "island" else None


        # ── What is missing, and the questions ───────────────────────────────────

        def missing(state):
            s, e, need = state, effective(state), []
            if s.get("intent") not in INTENTS:
                return ["intent"]
            if not s.get("destination"):
                need.append("destination")
            elif s.get("destination_islands"):
                need.append("island:destination")
            elif s.get("destination_matches"):
                need.append("which:destination")
            elif wants(s, "flight") and s.get("destination_options"):
                need.append("airport:destination")
            elif wants(s, "flight") and not s.get("destination_code"):
                need.append("airport_unknown:destination")
            # An island is no place to search hotels in: ask where on it, once its
            # airport (for a flight) is settled (adiona/frontend#55).
            if wants(s, "hotel") and _island(s) and not s.get("hotel_area") and not any(
                    n.endswith(":destination") for n in need):
                need.append("hotel_area")
            if wants(s, "flight"):
                if not s.get("origin") and departure_suggestion(s):
                    # adiona/frontend#55 Part 2: the traveller's location suggests one.
                    need.append("origin_confirm")
                elif not s.get("origin"):
                    need.append("origin")
                elif s.get("origin_islands"):
                    need.append("island:origin")
                elif s.get("origin_matches"):
                    need.append("which:origin")
                elif s.get("origin_options"):
                    need.append("airport:origin")
                elif not s.get("origin_code"):
                    need.append("airport_unknown:origin")
            flight_only = s.get("intent") == "flight"
            if flight_only and not e["trip_type"]:
                # Before the dates, so the date picker can ask for one date or two.
                need.append("trip_type")
            if wants(s, "flight") and not e["depart"]:
                need.append("dates")
            elif wants(s, "hotel") and not (e["check_in"] and e["check_out"]):
                need.append("dates")
            if wants(s, "flight") and not flight_only and e["depart"] and not e["trip_type"]:
                need.append("trip_type")
            elif wants(s, "flight") and e["trip_type"] == "round_trip" and not e["return"] and "dates" not in need:
                need.append("return_date")
            # Travellers are one question (adults, whether children come, their ages).
            if not s.get("adults") or s.get("children_count") is None:
                need.append("travelers")
            elif s.get("children_count") and not s.get("children_ages"):
                need.append("children_ages")
            if wants(s, "hotel") and not s.get("rooms"):
                need.append("rooms")
            return need


        def _human_date(iso):
            d = date.fromisoformat(iso)
            return d.strftime("%b ") + str(d.day) + d.strftime(", %Y")


        def _or_list(names):
            return ", ".join(names[:-1]) + " or " + names[-1] if len(names) > 1 else names[0]


        def _airport_list(codes):
            return _or_list(["%s (%s)" % (BY_CODE[c]["name"], c) for c in codes])


        def question(item, state):
            s, e = state, effective(state)
            both = s.get("intent") == "both"
            if item == "intent":
                return "Are you looking for flights, a hotel, or both?"
            if item == "destination":
                return "Where would you like to %s?" % ("go" if wants(s, "flight") else "stay")
            if item == "origin":
                return "Which city or airport are you flying from?"
            if item == "origin_confirm":
                code = departure_suggestion(s)
                return "Are you flying from %s (%s)?" % (BY_CODE[code]["city"].split(",")[0].strip(), code)
            if item.startswith("airport:"):
                key = item.split(":", 1)[1]
                if s.get(key + "_nearest"):
                    return "%s has no airport of its own. The nearest are %s. Which one should I use?" % (
                        _flight_place(s, key)["text"], _airport_list(s[key + "_options"]))
                return "%s has several airports: %s. Which one should I use?" % (
                    _flight_place(s, key)["text"], _airport_list(s[key + "_options"]))
            if item.startswith("which:"):
                key = item.split(":", 1)[1]
                name = _flight_place(s, key)["text"]
                labels = [m["label"] + (" (%s)" % ", ".join(m["airports"]) if wants(s, "flight") and m["airports"] else "")
                          for m in s[key + "_matches"]]
                return "There's more than one %s: %s. Which one do you mean?" % (name, _or_list(labels))
            if item.startswith("island:"):
                key = item.split(":", 1)[1]
                return "%s has several islands: %s. Which island %s?" % (
                    _flight_place(s, key)["text"], _or_list([i["name"] for i in s[key + "_islands"]]),
                    "would you like to visit" if key == "destination" else "are you flying from")
            if item == "hotel_area":
                return "Which city or area on %s would you like to stay in?" % _island(s)["text"]
            if item.startswith("airport_unknown:"):
                key = item.split(":", 1)[1]
                if _as_dict(s.get(key)).get("kind") == "hotel" and not s.get("destination_airport_place"):
                    return "Which city or airport should the flight go to for %s?" % s[key]["text"]
                if _as_dict(s.get(key)).get("kind") == "hotel":
                    return "I couldn't match %s to an airport. Which airport will you fly into?" % (
                        s["destination_airport_place"]["text"])
                return "I couldn't match %s to an airport. Which airport will you fly %s?" % (
                    s[key]["text"], "into" if key == "destination" else "from")
            if item == "dates":
                if both:
                    return "What are your travel dates: when do you leave, and when do you come back?"
                if wants(s, "flight") and e["trip_type"] == "one_way":
                    return "When would you like to depart?"
                if wants(s, "flight"):
                    return "When would you like to depart, and when will you fly back?"
                return "What are your check-in and check-out dates?"
            if item == "trip_type":
                return "Is this a one-way trip or a round trip?"
            if item == "return_date":
                return "When would you like to fly back?"
            if item == "travelers":
                if s.get("adults") and s.get("children_count") is None:
                    return "Will any children be traveling as well? If so, please share each child's age."
                return ("How many adults are traveling? Will any children be traveling as well? "
                        "If so, please share each child's age.")
            if item == "children_ages":
                n = s.get("children_count") or 0
                return "How old %s?" % ("is the child" if n == 1 else "are the %d children" % n)
            if item == "rooms":
                return "How many rooms do you need?"
            return ""


        def awaiting_fields(items):
            out = []
            for item in items:
                if item.startswith(("airport", "which:", "island:")):
                    out.append(item.split(":", 1)[0].replace("airport_unknown", "airport"))
                    out.append(item.split(":", 1)[1])
                elif item == "dates":
                    out.append("dates")
                elif item == "travelers":
                    out.extend(["adults", "children"])
                elif item == "origin_confirm":
                    # A yes/no, or the place they fly from instead.
                    out.extend(["origin_confirm", "origin"])
                else:
                    out.append(item)
            return out


        def next_questions(need):
            """One or two questions. An airport choice is asked on its own."""
            if not need:
                return []
            alone = ("dates", "return_date", "trip_type", "hotel_area", "origin_confirm")
            place = ("airport", "which:", "island:")
            if need[0].startswith(place) or need[0] in alone or len(need) == 1:
                # Asked on their own: an airport choice; a flight's trip type (it decides
                # whether the picker asks for one date or two); and the dates, which come
                # with the date picker (adiona/frontend#55: "first will ask 'Which city or
                # airport are you flying from?' and after user replies ask about the dates
                # and it will return the DatePicker").
                return need[:1]
            second = need[1]
            return need[:1] if second.startswith(place) or second in alone else need[:2]


        # ── The forms ────────────────────────────────────────────────────────────
        # Field names, nesting and order are exactly FlightSearchForm / HotelSearchForm's
        # (and the examples in adiona/frontend#55).

        def date_picker(state, today):
            """The itinerary planner's date_range_picker envelope, unchanged in shape, so
            the Adiona chat renders its DateRangePickerWidget. Its preselection is only
            where the calendar opens: dates enter the forms when the user submits."""
            e = effective(state)
            start = e["depart"] or e["check_in"]
            end = e["return"] or e["check_out"]
            first = date.fromisoformat(start) if start else today + timedelta(days=1)
            return {"schema_version": 1, "widget_type": "date_range_picker", "variant": "compact", "payload": {
                "min_date": today.isoformat(),
                "max_date": (today + timedelta(days=365)).isoformat(),
                "default_from": first.isoformat(),
                "default_to": end or (first + timedelta(days=4)).isoformat(),
                "locale": "en",
                "submit": "submit",
            }}


        def dates_from_widget(payload, state):
            """The DateRangePickerWidget's submit: {action_id: submit_dates, submitted_value: {from, to, nights}}."""
            payload = _as_dict(payload)
            value = _as_dict(payload.get("submitted_value")) or _as_dict(payload.get("value"))
            start, end = _iso(value.get("from")), _iso(value.get("to"))
            if not start:
                return {}
            if state.get("intent") == "flight" and effective(state)["trip_type"] == "one_way":
                return {"depart_date": start}
            out = {"start_date": start}
            if end:
                out["end_date"] = end
            return out


        def _children(state):
            return [{"age": a} for a in (state.get("children_ages") or [])]


        def _default_destination(state, value):
            """Provisional rule (open question 2 on adiona/frontend#55): set only when the
            user typed the destination as a city or airport themselves, not when it came
            from a choice we offered, from coordinates, or is a hotel property."""
            d = state.get("destination") or {}
            if d.get("typed") and d.get("kind") in ("city", "airport") and not d.get("from_coords") \
                    and not state.get("destination_chosen"):
                return value
            return None


        def hotel_form(state):
            s, e = state, effective(state)
            d = s["destination"]
            if d.get("kind") == "hotel":
                dest = d["text"]
            elif _island(s) and s.get("hotel_area"):
                # Where on the island, as the user said it, with the island unless named.
                area = s["hotel_area"]["text"]
                dest = area if _norm_place(d["text"]) in _norm_place(area) else "%s, %s" % (area, d["text"])
            elif d.get("resolved"):
                dest = d["text"]
            else:
                # A city name, never an airport (adiona/frontend#55): a known city as is;
                # an airport, by code or name, becomes its city; else the flight's
                # destination airport's city; else what the user typed.
                dest = (_canonical_city(d["text"]) or airport_city(d["text"])
                        or (BY_CODE[s["destination_code"]]["city"] if d.get("kind") == "airport"
                            and s.get("destination_code") in BY_CODE else None)
                        or d["text"])
            criteria = {"destination": dest}
            if d.get("kind") != "hotel" and s.get("latitude") is not None and s.get("longitude") is not None:
                criteria["latitude"] = s["latitude"]
                criteria["longitude"] = s["longitude"]
            if d.get("kind") != "hotel" and s.get("radius") is not None:
                r = s["radius"]
                criteria["radius"] = int(r) if float(r).is_integer() else r
            criteria.update({"checkIn": e["check_in"], "checkOut": e["check_out"], "rooms": s["rooms"],
                             "adults": s["adults"], "children": _children(s)})
            payload = {"criteria": criteria}
            dd = _default_destination(s, dest)
            if dd:
                payload["defaultDestination"] = dd
            return {"widget_type": "hotel_search_form", "payload": payload}


        def flight_form(state):
            s, e = state, effective(state)
            criteria = {"tripType": e["trip_type"], "origin": s["origin_code"], "destination": s["destination_code"],
                        "departDate": e["depart"]}
            if e["trip_type"] == "round_trip":
                criteria["returnDate"] = e["return"]
            criteria["travelers"] = {"adults": s["adults"], "children": _children(s)}
            payload = {"criteria": criteria}
            dd = _default_destination(s, s["destination_code"])
            if dd:
                payload["defaultDestination"] = dd
            return {"widget_type": "flight_search_form", "payload": payload}


        def forms_for(state):
            """Every form of the trip, hotel first; only once ALL of them are complete."""
            if missing(state):
                return []
            out = []
            if wants(state, "hotel"):
                out.append(hotel_form(state))
            if wants(state, "flight"):
                out.append(flight_form(state))
            return out


        ORDINALS = {"first": 0, "1st": 0, "1": 0, "one": 0, "second": 1, "2nd": 1, "2": 1, "two": 1,
                    "third": 2, "3rd": 2, "3": 2, "three": 2, "fourth": 3, "4th": 3, "4": 3, "four": 3}


        def pick_choice(choices, names, texts, code=None):
            """Which of the offered choices an answer picks: by its name (all of it, or the
            part that tells it apart, "Maine" for "Portland, Maine"), by one of its airport
            codes, or by position ("the second one"). None when it picks none, or several."""
            said = [_norm_place(t) for t in texts if t]
            hits = []
            for i, (choice, name) in enumerate(zip(choices, names)):
                full = _norm_place(name)
                parts = [full] + [p.strip() for p in full.split(",")[1:] if p.strip()]
                if any(re.search(r"\b%s\b" % re.escape(p), t) for p in parts for t in said) \
                        or (code and code in (choice.get("airports") or [])) \
                        or any(re.search(r"\b%s\b" % c.lower(), t) for c in choice.get("airports") or [] for t in said):
                    hits.append(i)
            if len(hits) == 1:
                return choices[hits[0]]
            if not hits:
                for t in said:
                    words = re.findall(r"[a-z0-9]+", t)
                    pos = [ORDINALS[w] for w in words if w in ORDINALS and (w not in ("one", "1") or len(words) <= 3)]
                    if len(set(pos)) == 1 and pos[0] < len(choices) and ("one" in words or len(words) <= 3
                                                                         or any(w in ("first", "second", "third", "fourth") for w in words)):
                        return choices[pos[0]]
            return None


        def clean_user_location(value):
            """The traveller's location as the frontend sends it (adiona/frontend#55
            Part 2): {city, region, country, lat, lon}, each optional, kept in the
            intake state. It only ever turns the departure question into a yes/no
            about the nearest airport (departure_suggestion); nothing is filled in
            from it without the traveller saying yes."""
            value = _as_dict(value)
            out = {}
            for key in ("city", "region", "country"):
                text = " ".join(str(value.get(key) or "").split())[:80]
                if text:
                    out[key] = text
            lat, lon = _num(value.get("lat", value.get("latitude"))), _num(value.get("lon", value.get("lng", value.get("longitude"))))
            if lat is not None and lon is not None and -90 <= lat <= 90 and -180 <= lon <= 180:
                out["lat"], out["lon"] = lat, lon
            return out


        def departure_suggestion(state):
            """The airport to suggest as the departure, from the traveller's location:
            the nearest LARGE airport within NEAREST_KM (a small one nearby is not
            suggested when a bigger one is in reach), else the nearest one. None when
            there is no usable location, or the traveller already said no."""
            s = state
            if s.get("origin_suggestion_declined"):
                return None
            loc = _as_dict(s.get("user_location"))
            lat, lon = _num(loc.get("lat")), _num(loc.get("lon"))
            if lat is None or lon is None:
                name = ", ".join(x for x in (loc.get("city"), loc.get("region")) if x)
                places = (_table_places(name) if name else []) or (_table_places(loc.get("city")) if loc.get("city") else [])
                if not places:
                    return None
                lat, lon = places[0]["lat"], places[0]["lon"]
            near = nearest_airports(lat, lon)
            return near[0] if near else None


        YES_RE = re.compile(r"^\s*(yes|yeah|yep|yup|sure|correct|right|that'?s right|ok(ay)?|y)\b", re.I)
        NO_RE = re.compile(r"^\s*(no|nope|nah|not really|n)\b", re.I)


        def _similar(a, b):
            import difflib
            return difflib.SequenceMatcher(None, _norm_place(a), _norm_place(b)).ratio()


        def check_places(patch):
            """adiona/frontend#55: a misspelled place the model recognised is corrected
            without asking when the correction is at least 60% alike to what was
            typed; a place the model says does not exist, or a correction too far
            from the text, is not used. Returns the messages to say."""
            problems = []
            for key in ("destination", "origin"):
                place = patch.get(key)
                if not place or place.get("kind") in ("hotel", "airport"):
                    continue
                corrected = place.get("corrected")
                if corrected and _norm_place(corrected) != _norm_place(place["text"]):
                    if _similar(place["text"], corrected) >= 0.6:
                        place["typed_as"], place["text"] = place["text"], corrected
                    else:
                        place["exists"] = False
                if place.get("exists") is False:
                    patch.pop(key)
                    problems.append("We couldn't find a place called \"%s\". Please check the spelling or enter "
                                    "a nearby city." % place.get("typed_as", place["text"]))
            return problems


        def run_turn(state, text, payload, today, reader, user_location=None):
            """One turn: read, merge, validate, resolve, then ask or return the forms."""
            state = json.loads(json.dumps(state or {}))
            awaiting = state.pop("awaiting", [])
            location = clean_user_location(user_location)
            if location:
                state["user_location"] = location
            patch = clean_patch(reader(text, state, awaiting, today))
            place_problems = check_places(patch)
            # "Are you flying from San Jose (SJC)?": yes takes it, no asks the open
            # question; naming a place answers it directly.
            if "origin_confirm" in awaiting and "origin" not in patch:
                suggested = departure_suggestion(state)
                said_yes = patch.get("confirm") is True or (patch.get("confirm") is None and YES_RE.search(text or ""))
                said_no = patch.get("confirm") is False or (patch.get("confirm") is None and NO_RE.search(text or ""))
                if said_yes and suggested:
                    patch["origin"] = {"text": suggested, "kind": "airport"}
                    state["origin_from_location"] = True
                elif said_no:
                    state["origin_suggestion_declined"] = True
            patch.update(dates_from_widget(payload, state))
            if "intent" in patch:
                patch["intent"] = resolve_intent(state.get("intent"), patch["intent"], text)
                if patch["intent"] == state.get("intent"):
                    patch.pop("intent")
            # Travellers were asked together: an answer that gives the adults and says
            # nothing about children means none (they were asked about directly).
            if ("children" in awaiting and "children_count" not in patch and "children_ages" not in patch
                    and (patch.get("adults") or state.get("adults")) and state.get("children_count") is None
                    and (text or "").strip()):
                patch["children_count"], patch["children_ages"] = 0, []
            # An answer to "which airport?": one of the offered codes. A destination
            # picked from our options was not typed by the user (defaultDestination).
            for key in ("destination", "origin"):
                opts = state.get(key + "_options") or []
                if not opts:
                    continue
                pick = patch.get("airport_code")
                if pick not in opts and key in patch:
                    pick = next((o for o in opts if _names_airport(patch[key]["text"], o)), pick)
                if pick not in opts:
                    # A bare answer naming exactly one of the offered airports or its town
                    # ("Hilo"); "London" names all of London's, so it picks none.
                    named = [o for o in opts if _names_airport(text, o) or any(
                        len(w) >= 4 and re.search(r"\b%s\b" % re.escape(w), _norm_place(text))
                        for w in _norm_place(BY_CODE[o]["city"]).replace(",", " ").split())]
                    pick = named[0] if len(named) == 1 else pick
                if pick in opts:
                    # The answer names the airport ("LHR", "Heathrow Airport (LHR)"): it picks
                    # the flight's airport and must not replace the place itself, which stays
                    # the city the hotel form needs. A different place is a change of mind.
                    if key in patch and _names_airport(patch[key]["text"], pick):
                        patch.pop(key)
                    patch["airport_code"] = pick
                    if key == "destination":
                        state["destination_chosen"] = True
                    break
            # An answer to "which Portland?" or "which island?": the place it picks
            # replaces the name, so the hotel and flight both use it.
            for key in ("destination", "origin"):
                matches, islands = state.get(key + "_matches") or [], state.get(key + "_islands") or []
                if not (matches or islands) or patch.get(key, {}).get("kind") == "hotel":
                    continue
                said = [text, _as_dict(patch.get(key)).get("text")]
                if matches:
                    m = pick_choice(matches, [m["label"] for m in matches], said, patch.get("airport_code"))
                    picked = m and dict({"text": m["label"], "kind": "city", "resolved": True, "airports": m["airports"]},
                                        **({"lat": m["lat"], "lon": m["lon"]} if m.get("lat") is not None else {}))
                else:
                    i = pick_choice(islands, [i["name"] for i in islands], said, patch.get("airport_code"))
                    picked = i and {"text": i["name"], "kind": "island", "resolved": True, "airports": i.get("airports") or []}
                if picked:
                    patch[key] = picked
                    patch.pop("airport_code", None)
                    if key == "destination":
                        state["destination_chosen"] = True
            if "destination" in patch and not patch["destination"].get("resolved"):
                state.pop("destination_chosen", None)
            # "Which city or area on Kauai?": the answer is where to stay, not a new
            # destination, unless it names another island or region.
            if "hotel_area" in awaiting and "hotel_area" not in patch and "destination" in patch \
                    and place_kind(patch["destination"]) not in ("island", "region"):
                patch["hotel_area"] = {"text": patch.pop("destination")["text"]}
            # A named hotel with a flight: the flight needs a city or airport for it,
            # which must not replace the hotel as the hotel form's destination.
            if ("airport" in awaiting and "destination" in awaiting
                    and _as_dict(state.get("destination")).get("kind") == "hotel"
                    and _as_dict(patch.get("destination")).get("kind") in ("city", "airport")):
                state["destination_airport_place"] = dict(patch.pop("destination"), typed=True)
                state.pop("destination_code", None)
            changed = merge(state, patch, coords_from(payload), awaiting)
            problems = validate(state, today)
            resolve_places(state)
            need = missing(state)
            asks = next_questions(need)
            forms = forms_for(state)
            state["awaiting"] = awaiting_fields(asks)
            widget = date_picker(state, today) if any(a in ("dates", "return_date") for a in asks) else None
            lines = place_problems + list(problems) + [question(item, state) for item in asks]
            if forms:
                kinds = " and ".join(f["widget_type"].split("_")[0] for f in forms)
                lines.append("Here's your %s search. Check the details and search when you're ready." % kinds)
            return {"state": state, "patch": patch, "changed": changed, "problems": place_problems + problems,
                    "missing": need, "asked": asks, "forms": forms, "widget": widget,
                    "bot_message": " ".join(l for l in lines if l)}


        # ── The turn ─────────────────────────────────────────────────────────────
        # Tests exec this code with _INTAKE_LIBRARY_ONLY set and call the functions
        # above directly; the playbook runs the body below.
        if not globals().get("_INTAKE_LIBRARY_ONLY"):
            def _flag(value):
                if isinstance(value, bool):
                    return value
                return str(value or "").strip().lower() in ("1", "true", "yes", "on")

            loaded = _as_dict(loaded_state)
            document = _as_dict(loaded.get("document"))
            prior = _as_dict(document.get("data"))
            payload = _as_dict(event_payload)
            text = str(payload.get("text") or payload.get("message") or "").strip()
            today = date.fromisoformat(str(today_override)) if _iso(today_override) else date.today()

            llm = {"used": False, "model": str(llm_model or ""), "fallback_reason": ""}

            def _reader(t, s, awaiting, d):
                if not t:
                    return {}
                if _flag(llm_enabled):
                    try:
                        out = llm_read(t, s, awaiting, d, str(llm_model), str(vertex_project), str(vertex_region))
                        llm["used"] = True
                        return out
                    except Exception as exc:
                        llm["fallback_reason"] = "%s: %s" % (type(exc).__name__, str(exc)[:200])
                return rule_read(t, s, awaiting, d)

            turn = run_turn(prior, text, payload, today, _reader, globals().get("user_location"))
            state = turn["state"]
            forms = turn["forms"]
            actor = {"kind": "agent", "name": "muno-trip-intake"}

            turn_events = [
                {"thread_path": thread_path, "event": input_event},
                {"thread_path": thread_path, "event": {
                    "type": "agent_slot_update",
                    "payload": {"changes": turn["changed"], "intake_state": state, "missing": turn["missing"],
                                "llm": llm},
                    "actor": actor}},
            ]
            if turn["bot_message"]:
                turn_events.append({"thread_path": thread_path, "event": {
                    "type": "agent_chat", "payload": {"text": turn["bot_message"]}, "actor": actor}})
            # The forms once complete; otherwise the date picker when the dates are asked.
            widgets = forms or ([turn["widget"]] if turn.get("widget") else [])
            for widget in widgets:
                turn_events.append({"thread_path": thread_path, "event": {
                    "type": "agent_widget_emit", "payload": {"envelope": widget}, "actor": actor}})

            # The intake keeps its own slot document, so a thread the itinerary planner
            # also serves keeps its slot_state/current untouched.
            turn_docs = [{"path": "%s/slot_state/intake" % thread_path, "doc": state, "merge": False}]
            turn_docs.extend(relation_docs if isinstance(relation_docs, list) else [])

            result = {
                "thread_path": thread_path,
                "intake_state": state,
                "complete": bool(forms),
                "missing": turn["missing"],
                "asked": turn["asked"],
                "problems": turn["problems"],
                "forms": forms,
                "render": widgets[0] if widgets else None,
                "widget": turn.get("widget"),
                "bot_message": turn["bot_message"],
                "llm": llm,
                "turn_docs": turn_docs,
                "turn_events": turn_events,
            }
            globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        - step: persist_turn

  - step: persist_turn
    desc: Save the intake state, the relation edge and the turn's events in ONE batched Firestore call
    tool:
      kind: playbook
      path: automation/agents/mcp/firestore
      payload:
        method: tools/call
        tool: batch_write
        firestore_database: "{{ workload.firestore_database }}"
        arguments:
          set_docs: "{{ intake_turn.turn_docs }}"
          append_events: "{{ intake_turn.turn_events }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: final_result

  - step: final_result
    desc: Return the turn's result (render = the first form) and notify the gateway
    tool:
      kind: python
      input:
        thread_path: "{{ normalize_input.thread_path }}"
        intake: "{{ intake_turn }}"
        request_id: "{{ workload.request_id | default('') }}"
        gateway_url: "{{ workload.gateway_url | default('') }}"
      code: |
        import json
        import urllib.request

        intake = intake if isinstance(intake, dict) else {}
        forms = intake.get("forms") if isinstance(intake.get("forms"), list) else []
        result = {
            "status": "completed",
            "thread_id": thread_path.split("/", 1)[1] if "/" in str(thread_path) else thread_path,
            "thread_path": thread_path,
            "complete": bool(forms),
            "missing": intake.get("missing") or [],
            # The first form once complete, otherwise the date picker when the
            # dates are asked (the planner's date_range_picker), otherwise none.
            "render": intake.get("render") if isinstance(intake.get("render"), dict) else None,
            "forms": forms,
            "emitted_widget_types": [w.get("widget_type") for w in (forms or [intake.get("render")]) if isinstance(w, dict)],
            "bot_message": intake.get("bot_message") or "",
            "final_slot_state": intake.get("intake_state") or {},
        }

        if request_id and gateway_url:
            try:
                body = json.dumps({"request_id": request_id, "status": "COMPLETED", "data": result}).encode("utf-8")
                req = urllib.request.Request(
                    gateway_url.rstrip("/") + "/api/internal/callback/async",
                    data=body, headers={"Content-Type": "application/json"}, method="POST")
                with urllib.request.urlopen(req, timeout=5) as response:
                    result["gateway_callback"] = {"delivered": 200 <= response.status < 300}
            except Exception as exc:
                result["gateway_callback"] = {"delivered": False, "error": str(exc)[:300]}
        globals().update({"result": result})
