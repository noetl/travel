apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: muno_trip_intake
  path: muno/playbooks/trip-intake
  description: |
    Trip intake (adiona/frontend#55): talk with the traveller until every
    required field of FlightSearchForm and/or HotelSearchForm is known, then
    return the form JSON exactly as those forms take it. It does NOT search:
    no flight, hotel or places provider is called, and no results are returned.

    One chat turn per invocation, like the itinerary planner, and the same
    thread rules: the caller must own the thread (load_state is the planner's
    load_slot_state verbatim, guarded by scripts/trip_intake_test.py), and the
    turn is saved to chat_threads/{thread_id} through mcp/firestore.

    REQUIRED (asked until known, one or two questions at a time, never asked
    again once given; the latest answer wins, so corrections just work):
      hotel   destination (a city, or a named hotel), checkIn, checkOut, rooms,
              adults (+ each child's age, if they mentioned children)
      flight  origin, destination (airport codes), departDate, tripType,
              returnDate for a round trip, adults (+ children's ages)
      both    the shared details (destination, dates, travellers) once

    OPTIONAL (only when the user gave them; nothing is defaulted or invented)
      latitude/longitude (coordinates sent with a turn), radius (km),
      defaultDestination (see _default_destination). `children` is [] when
      there are none.

    OUTPUT. result.render is the first form; result.forms holds every form of
    the trip (hotel first); result.bot_message is the question or the hand-off
    line. Each form is exactly:
      {"widget_type": "hotel_search_form" | "flight_search_form",
       "payload": {"criteria": {...}, "defaultDestination"?: "..."}}

    VALIDATION. Dates are YYYY-MM-DD and not in the past; return >= departure;
    check-out after check-in; counts within the forms' own limits. Airport codes
    are only those FlightSearchForm can prefill (its airports.ts); a city with
    several airports is a question, never a pick.
  version: "1"
  agent: true
  tags: [muno, intake, forms, event-sourced]
  terminal:
    visible: true
    workspace: muno
    scopes: [/muno/intake, /mcp/firestore]
  capabilities: [mcp:firestore, ai:vertex-ai]

workload:
  thread_id: ""
  user_uid: guest
  request_id: ""
  gateway_url: ""
  event_type: user_message
  event_payload: {}
  firestore_database: "(default)"
  firestore_project: shastaratech-noetl-prod
  allow_guest_threads: false
  # The model only reads the user's words into fields; every rule is code.
  # false = the deterministic reader alone (also the fallback on any model error).
  llm_enabled: true
  llm_model: gemini-3.8-flash
  vertex_project: shastaratech-noetl-prod
  vertex_region: global
  # YYYY-MM-DD; empty = today. For replays and tests only.
  today: ""

workflow:
  - step: start
    desc: Entry point — the Rust runtime requires a step named `start`
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: normalize_input

  - step: normalize_input
    desc: Normalize caller input and generate a thread id when needed
    tool:
      kind: python
      input:
        thread_id: "{{ workload.thread_id }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
        event_type: "{{ workload.event_type | default('user_message') }}"
        event_payload: "{{ workload.event_payload | default({}) }}"
        replay: "{{ workload.replay | default(false) }}"
        replay_thread_id: "{{ workload.replay_thread_id | default('') }}"
      code: |
        import json
        import time
        import uuid

        def _as_dict(value):
            if isinstance(value, dict):
                return value
            if isinstance(value, str):
                try:
                    parsed = json.loads(value)
                    return parsed if isinstance(parsed, dict) else {}
                except Exception:
                    try:
                        import ast
                        parsed = ast.literal_eval(value)
                        return parsed if isinstance(parsed, dict) else {}
                    except Exception:
                        return {}
            return {}

        tid = str(replay_thread_id or thread_id or "").strip()
        if not tid:
            tid = f"chat_threads/_smoke-{uuid.uuid4().hex[:10]}"
        elif not tid.startswith("chat_threads/"):
            tid = f"chat_threads/{tid.strip('/')}"

        payload = _as_dict(event_payload)
        event = {
            "type": str(event_type or "user_message"),
            "payload": payload,
            "actor": {"kind": "user", "uid": user_uid or "guest"},
            "created_at_ms": int(time.time() * 1000),
            "source": "muno.trip_intake",
        }
        result = {
            "thread_path": tid,
            "thread_id": tid.split("/", 1)[1] if "/" in tid else tid,
            "event_type": event["type"],
            "event_payload": payload,
            "input_event": event,
            "replay": bool(replay),
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: load_state

  - step: load_state
    desc: Load the intake state and decide thread access (the planner's load_slot_state, verbatim)
    # The code is byte-identical to itinerary-planner's load_slot_state, so
    # both playbooks enforce the same thread ownership and write the same
    # user<->thread relation (scripts/trip_intake_test.py fails on any drift).
    # Only doc_path differs: the intake keeps its own slot document.
    tool:
      kind: python
      input:
        doc_path: "{{ normalize_input.thread_path }}/slot_state/intake"
        firestore_database: "{{ workload.firestore_database | default('(default)') }}"
        firestore_project: "{{ workload.firestore_project | default('shastaratech-noetl-prod') }}"
        thread_id: "{{ normalize_input.thread_id }}"
        user_uid: "{{ workload.user_uid | default('guest') }}"
        event_type: "{{ normalize_input.event_type }}"
        event_payload: "{{ normalize_input.event_payload }}"
        allow_guest_threads: "{{ workload.allow_guest_threads | default(false) }}"
      code: |
        import json
        import urllib.error
        import urllib.parse
        import urllib.request

        METADATA_TOKEN_URL = (
            "http://metadata.google.internal/computeMetadata/v1/instance/"
            "service-accounts/default/token"
        )

        def _as_dict(value):
            return value if isinstance(value, dict) else {}

        def _as_list(value):
            return value if isinstance(value, list) else []

        def _safe_int(value, default=0):
            try:
                return int(value)
            except (TypeError, ValueError):
                return default

        def _token():
            req = urllib.request.Request(
                METADATA_TOKEN_URL, headers={"Metadata-Flavor": "Google"}, method="GET")
            with urllib.request.urlopen(req, timeout=10) as resp:
                payload = json.loads(resp.read().decode("utf-8") or "{}")
            token = (payload or {}).get("access_token")
            if not token:
                raise RuntimeError("metadata token endpoint returned no access_token")
            return token

        def _decode_value(value):
            value = _as_dict(value)
            if "nullValue" in value:
                return None
            if "booleanValue" in value:
                return bool(value.get("booleanValue"))
            if "integerValue" in value:
                return _safe_int(value.get("integerValue"), 0)
            if "doubleValue" in value:
                try:
                    return float(value.get("doubleValue"))
                except (TypeError, ValueError):
                    return 0.0
            for key in ("timestampValue", "stringValue", "bytesValue",
                        "referenceValue", "geoPointValue"):
                if key in value:
                    return value.get(key)
            if "arrayValue" in value:
                return [_decode_value(i)
                        for i in _as_list(_as_dict(value.get("arrayValue")).get("values"))]
            if "mapValue" in value:
                fields = _as_dict(_as_dict(value.get("mapValue")).get("fields"))
                return {k: _decode_value(v) for k, v in fields.items()}
            return value

        def _relative_from_name(name):
            marker = "/documents/"
            name = str(name or "")
            return name.split(marker, 1)[1] if marker in name else name

        path = str(doc_path or "").strip().strip("/")
        db = str(firestore_database or "(default)")
        root = ("https://firestore.googleapis.com/v1/projects/"
                + str(firestore_project)
                + "/databases/" + urllib.parse.quote(db, safe="()")
                + "/documents")
        url = root + "/" + urllib.parse.quote(path, safe="/")

        found = False
        document = None
        error = ""
        try:
            req = urllib.request.Request(
                url,
                headers={"Authorization": "Bearer %s" % _token(),
                         "Accept": "application/json"},
                method="GET")
            with urllib.request.urlopen(req, timeout=30) as resp:
                body = json.loads(resp.read().decode("utf-8") or "{}")
            fields = _as_dict(body.get("fields"))
            document = {
                "name": body.get("name"),
                "path": _relative_from_name(body.get("name")),
                "createTime": body.get("createTime"),
                "updateTime": body.get("updateTime"),
                "data": {k: _decode_value(v) for k, v in fields.items()},
            }
            found = True
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                # A brand-new thread has no projection yet.  Not an error --
                # the turn starts from an empty slot state.
                found = False
            else:
                error = "HTTP %s: %s" % (
                    exc.code, exc.read().decode("utf-8", "replace")[:300])
        except Exception as exc:
            error = "%s: %s" % (type(exc).__name__, str(exc)[:200])

        # ── Thread access + the user<->thread relation ───────────────────────
        # Two records live beside chat_threads/** (which is never modified):
        #
        #   thread_owners/{thread_id}       who CREATED the thread: the anchor of
        #                                   access, written once by the first turn
        #   user_thread_map/{edge_id}       one edge per (uid, thread_id): uid,
        #                                   thread_id, role, label, first_added_at_ms,
        #                                   last_activity_ms, turn_count, archived.
        #                                   edge_id = sha256(uid + "\n" + thread_id)
        #
        # ⚠ An edge is written ONLY for a caller this step has already
        # authorized, so authoring an event can never create membership by
        # itself. A turn is authorized when the caller
        #   1. has an edge for the thread (owner or member), or
        #   2. is the thread's recorded owner (an edge lost or never written is
        #      repaired), or
        #   3. starts a brand-new thread (no owner record, no history), or
        #   4. continues an UNOWNED thread with history -- one started anonymously
        #      (or before ownership existed) -- after signing in: claim-on-signin,
        #      a product decision (2026-10-13). The first signed-in caller becomes
        #      its owner; from then on rule 1/2 applies and everyone else is
        #      refused. Threads are single-owner: nothing here adds a member.
        # Everything else is refused (refuse_thread). Members other than the
        # owner can only be added by an explicit grant, which this change does
        # not offer (see the PR).
        #
        # relation_docs are the writes this turn adds to the persist batch
        # (appended to render_widget_chat.post_docs).
        import hashlib
        import re
        import time

        THREAD_ID_RE = re.compile(r"^[A-Za-z0-9_-]{1,128}$")
        LABEL_MAX = 80
        _token_cache = []

        def _cached_token():
            if not _token_cache:
                _token_cache.append(_token())
            return _token_cache[0]

        def _get_fields(rel_path):
            """(found, fields, error) for one document. 404 is (False, {}, "")."""
            doc_url = root + "/" + urllib.parse.quote(rel_path, safe="/")
            try:
                req = urllib.request.Request(
                    doc_url,
                    headers={"Authorization": "Bearer %s" % _cached_token(),
                             "Accept": "application/json"},
                    method="GET")
                with urllib.request.urlopen(req, timeout=30) as resp:
                    body = json.loads(resp.read().decode("utf-8") or "{}")
                fields = _as_dict(body.get("fields"))
                return True, {k: _decode_value(v) for k, v in fields.items()}, ""
            except urllib.error.HTTPError as exc:
                if exc.code == 404:
                    return False, {}, ""
                return False, {}, "HTTP %s" % exc.code
            except Exception as exc:
                return False, {}, "%s: %s" % (type(exc).__name__, str(exc)[:200])

        def _edge_id(edge_uid, edge_thread):
            # A hash, not "{uid}__{thread_id}": both parts may contain "_", so a
            # joined id could be the same string for two different pairs.
            return hashlib.sha256((edge_uid + "\n" + edge_thread).encode("utf-8")).hexdigest()

        def _flag(value):
            if isinstance(value, bool):
                return value
            return str(value or "").strip().lower() in ("1", "true", "yes", "on")

        def _label():
            payload = _as_dict(event_payload)
            if str(event_type or "") == "user_message":
                text = " ".join(str(payload.get("text") or "").split())
                if text:
                    return text if len(text) <= LABEL_MAX else text[:LABEL_MAX - 1] + "\u2026"
            return "New trip"

        thread_key = str(thread_id or "").strip()
        uid = str(user_uid or "").strip()
        anonymous = uid in ("", "guest")
        now_ms = int(time.time() * 1000)
        access = {"ok": False, "reason": "", "thread_id": thread_key,
                  "uid": "" if anonymous else uid, "role": "", "claim": False}
        relation_docs = []

        if not THREAD_ID_RE.match(thread_key):
            access["reason"] = "invalid_thread_id"
        elif "/" in uid:
            access["reason"] = "invalid_uid"
        elif anonymous:
            if thread_key.startswith("_smoke-") or _flag(allow_guest_threads):
                access.update(ok=True, reason="anonymous_unmapped")
            else:
                access["reason"] = "sign_in_required"
        elif error:
            # The slot read failed: we cannot tell a new thread from an old one.
            access["reason"] = "access_unverifiable"
        else:
            edge_path = "user_thread_map/" + _edge_id(uid, thread_key)
            edge_found, edge, edge_error = _get_fields(edge_path)
            owner = {}
            if edge_error:
                access["reason"] = "access_unverifiable"
            elif edge_found and str(edge.get("uid") or "") == uid and str(edge.get("thread_id") or "") == thread_key:
                access.update(ok=True, reason="member", role=str(edge.get("role") or "member"))
            else:
                owner_found, owner, owner_error = _get_fields("thread_owners/" + thread_key)
                if owner_error:
                    access["reason"] = "access_unverifiable"
                elif owner_found:
                    if str(owner.get("uid") or "") != uid:
                        access["reason"] = "not_member"
                    elif owner.get("unlinked_at_ms"):
                        access["reason"] = "thread_unlinked"
                    else:
                        access.update(ok=True, reason="owner_edge_repaired", role="owner")
                elif found:
                    # History but no owner: started anonymously, or before ownership
                    # existed. Claim-on-signin (rule 4 above).
                    access.update(ok=True, reason="claimed_on_signin", role="owner", claim=True)
                else:
                    access.update(ok=True, reason="created", role="owner", claim=True)

            if access["ok"]:
                doc = {
                    "uid": uid,
                    "thread_id": thread_key,
                    "thread_path": "chat_threads/" + thread_key,
                    "last_activity_ms": now_ms,
                }
                if edge_found:
                    doc["turn_count"] = _safe_int(edge.get("turn_count"), 0) + 1
                else:
                    doc.update({
                        "role": access["role"],
                        "label": _label(),
                        "first_added_at_ms": _safe_int(owner.get("created_at_ms"), 0) or now_ms,
                        "turn_count": 1,
                        "archived": False,
                        "added_by": "planner",
                    })
                relation_docs.append({"path": edge_path, "doc": doc, "merge": True})
                if access["claim"]:
                    relation_docs.append({
                        "path": "thread_owners/" + thread_key,
                        "doc": {"uid": uid, "thread_id": thread_key,
                                "created_at_ms": now_ms, "claimed_by": "planner"},
                        "merge": False,
                    })

        # Same envelope the mcp/firestore child returned, so downstream
        # accessors are unchanged.
        result = {
            "data": {"found": found, "path": path, "document": document},
            "load_error": error,
            "thread_access": access,
            "relation_docs": relation_docs,
        }
        globals().update({"result": result})
    next:
      spec: { mode: exclusive }
      arcs:
        # refuse_thread is a terminal leaf nothing else routes to
        # (scripts/playbook_skip_topology_test.py).
        - when: "{{ load_state.thread_access.ok }}"
          step: intake_turn
        - step: refuse_thread

  - step: refuse_thread
    desc: End a turn on a thread the caller does not own, without reading or writing it
    tool:
      kind: python
      input:
        access: "{{ load_state.thread_access }}"
        request_id: "{{ workload.request_id | default('') }}"
        gateway_url: "{{ workload.gateway_url | default('') }}"
      code: |
        import json
        import urllib.request

        reason = str((access or {}).get("reason") or "denied") if isinstance(access, dict) else "denied"
        if reason == "sign_in_required":
            text = "Please sign in to continue this conversation."
        else:
            text = "That conversation isn't available, so I've started a new one. Please send your message again."
        # A normal completed result, so the SPA renders bot_message and resets
        # its stored thread id on `thread_access == "denied"`. No thread data is
        # included, and "not yours" reads the same as "does not exist".
        result = {
            "status": "completed",
            "thread_access": "denied",
            "thread_access_reason": "sign_in_required" if reason == "sign_in_required" else "unavailable",
            "bot_message": text,
            "final_slot_state": {},
            "emitted_widget_types": [],
        }
        if request_id and gateway_url:
            try:
                body = json.dumps({"request_id": request_id, "status": "COMPLETED", "data": result}).encode("utf-8")
                req = urllib.request.Request(
                    gateway_url.rstrip("/") + "/api/internal/callback/async",
                    data=body, headers={"Content-Type": "application/json"}, method="POST")
                with urllib.request.urlopen(req, timeout=5) as response:
                    result["gateway_callback"] = {"delivered": 200 <= response.status < 300}
            except Exception as exc:
                result["gateway_callback"] = {"delivered": False, "error": str(exc)[:300]}
        globals().update({"result": result})

  - step: intake_turn
    desc: Read the turn, merge and validate it, then ask for what is missing or return the form JSON
    tool:
      kind: python
      input:
        thread_path: "{{ normalize_input.thread_path }}"
        event_payload: "{{ normalize_input.event_payload }}"
        input_event: "{{ normalize_input.input_event }}"
        loaded_state: "{{ load_state.data | default({}) }}"
        relation_docs: "{{ load_state.relation_docs | default([]) }}"
        llm_enabled: "{{ workload.llm_enabled | default(true) }}"
        llm_model: "{{ workload.llm_model | default('gemini-3.8-flash') }}"
        vertex_project: "{{ workload.vertex_project | default('shastaratech-noetl-prod') }}"
        vertex_region: "{{ workload.vertex_region | default('global') }}"
        today_override: "{{ workload.today | default('') }}"
      code: |
        import json
        import math
        import re
        import urllib.parse
        import urllib.request
        from datetime import date, timedelta

        # ── What this step does ──────────────────────────────────────────────────
        # One chat turn of trip intake (adiona/frontend#55). It reads the user's
        # message, merges what they said into the intake state, and either asks for
        # what is still missing (one or two questions) or, once every required field
        # of the form(s) is known, returns the form JSON exactly as FlightSearchForm /
        # HotelSearchForm take it.
        #
        #   * No flight or hotel search: nothing here calls a provider. The only
        #     network call is the optional Gemini extraction of the user's words.
        #   * Nothing is invented: a value is only ever what the user said in this
        #     thread. Optional fields (latitude/longitude/radius, defaultDestination)
        #     appear only when the user gave them; `children` is [] when there are none.
        #   * The model only READS the message. Every rule (required fields, dates,
        #     airports, the output shape) is plain code below, so the output cannot
        #     drift with the model.

        # The airports FlightSearchForm can prefill (adiona/frontend src/data/airports.ts,
        # generated by scripts/gen_intake_airports.py). A code outside this table would
        # leave the form's field empty, so the intake never returns one.
        AIRPORTS_TABLE = """
