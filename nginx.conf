map $uri $loggable_request {
  default 1;
  ~*\.(?:js|css|map|svg|png|jpe?g|gif|ico|woff2?|ttf|otf|eot)$ 0;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log combined if=$loggable_request;
  location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
  location = /robots.txt { access_log off; log_not_found off; try_files $uri =204; }
  location / { try_files $uri $uri/ /index.html; }
}
